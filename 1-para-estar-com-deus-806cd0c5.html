uando se prepara para o Santo Sacrifício. Vai ver como, pouco a pouco, irá metendo mais “vida” e amor na Missa, e conseguirá, com a ajuda da graça, que cada Missa seja um encontro pessoal com Cristo, e, através dele e em união com o Espírito Santo, com Deus Pai, e com todos os irmãos."}, {"t": "p", "x": "O Papa Bento XVI diz que, de todas as orações da Missa, talvez a que mais goste seja a que diz o sacerdote antes de comungar: «Senhor Jesus Cristo, Filho do Deus vivo, que, cumprindo a vontade do Pai e agindo com o Espírito Santo, pela vossa morte destes vida ao mundo: livrai- -me dos meus pecados e de todo mal; pelo vosso corpo e pelo vosso sangue, dai-me cumprir sempre a vossa vontade e jamais separar-me de vós». «Jamais separar-me de vós!...»"}, {"t": "p", "x": "A Missa bem vivida torna-se a “ignição” da alma, que nos move a cumprir com carinho a vontade de Deus – «dai-me cumprir sempre a vossa vontade» – nos detalhes cotidianos do trabalho, da vida familiar, da vida social..., enfim, em todos os momentos e circunstâncias da vida."}], "footnote": null}, {"n": 26, "label": "Capítulo 26", "title": "Amor à Missa: o Céu sobre a terra", "items": [{"t": "h", "x": "A luz “tabórica”"}, {"t": "p", "x": "Se fôssemos capazes de “ver” com os olhos da fé as riquezas divinas que encerra a Missa, reagiríamos como São Pedro no dia da Transfiguração de Jesus. Diríamos, cativados, ao assistir à Missa: <em>Como é bom estarmos aqui!<\/em>, e teríamos, como ele, desejos de perpetuar aqueles momentos (cf. Mt 17,4)."}, {"t": "p", "x": "Acho que você se lembra da cena da Transfiguração. Foi aquele dia em que Jesus pediu a Pedro, Tiago e João que o acompanhassem até o alto de uma montanha para orar – a tradição diz que era o monte Tabor –, e lá <em>se transfigurou na presença deles<\/em>. Seu rosto, seu corpo, suas vestes, começaram a <em>brilhar como o sol<\/em>, deixando entrever a maravilha indescritível da divindade de Cristo, que no dia-a-dia ficava oculta na sua humanidade (Cf. Mt 17,2; Mc 9, 2 e 5; e Lc 9,29 e 33). Essa luz que extasiou os três Apóstolos e lhes fez vislumbrar a beleza divina de Jesus e com a qual nenhuma beleza humana se pode comparar, é chamada às vezes de “luz tabórica” (do Tabor)."}, {"t": "p", "x": "Pois bem, a Missa – como já víamos – “é uma Pessoa”, é Jesus, Deus e Homem verdadeiro. Se, por um milagre, um raio de “luz tabórica” nos fizesse enxergar na Missa a divindade de Cristo, realmente presente no altar após a Consagração (e presente, depois, nos sacrários), ficaríamos extasiados, deslumbrados, arrebatados por uma alegria indescritível. E, além de Cristo irradiando os fulgores da divindade, veríamos também o que diz João Paulo II na Encíclica sobre a Eucaristia (n. 19):"}, {"t": "p", "x": "«A Eucaristia é verdadeiramente um pedaço de Céu que se abre sobre a terra. É um raio de glória da Jerusalém celeste, que atravessa as nuvens da nossa história e vem iluminar o nosso caminho»."}, {"t": "h", "x": "Um pedaço do Céu que se abre sobre a terra"}, {"t": "p", "x": "Você entende? O Papa, nesse texto que acabo de citar, refere-se à Jerusalém celeste, à imagem do Céu, que São João contempla no Apocalipse: <em>Vi descer do céu, de junto de Deus, a Cidade Santa, a nova Jerusalém... Ao mesmo tempo, ouvi do trono <\/em>[de Deus] <em>uma grande voz que dizia: «Eis aqui o tabernáculo de Deus com os homens. Habitará com eles e serão o seu povo e Deus mesmo estará com eles<\/em>» (Apoc 21,2-3)."}, {"t": "p", "x": "Nessa cidade celestial, <em>não haverá nada de execrável, mas nela estará o trono de Deus e do Cordeiro. Os seus servos lhe prestarão culto; verão a sua face e o seu nome estará nas suas frontes<\/em> (Apoc 22,3-4)"}, {"t": "p", "x": "Esse «pedaço do céu que se abre sobre a terra» é uma realidade, visível com a fé, em cada Missa. Pois em cada Missa Deus está presente e, com Ele, todos os anjos e santos que, contemplando-O e cultuando-O, formam a Jerusalém celeste."}, {"t": "p", "x": "Veja também o que já dizia o <em>Catecismo da Igreja Católica<\/em>, antes da Encíclica sobre a Eucaristia, de acordo com a fé de sempre. Na Missa, «à oferenda de Cristo unem- -se não somente os membros que estão ainda na terra, mas também os que já estão <em>na glória do céu<\/em>: é em comunhão com a Santíssima Virgem Maria [...], assim como com todos os santos e santas, que a Igreja oferece o Sacrifício Eucarístico» (n. 1370)."}, {"t": "p", "x": "Penso que vale a pena lembrar-lhe que, na mesma Encíclica sobre a Eucaristia, João Paulo II fez uma referência tocante à presença de Nossa Senhora na Missa."}, {"t": "p", "x": "Na Missa – diz –, que é «memorial do Calvário, está presente tudo o que Cristo realizou em sua paixão e morte. Por isso, não pode faltar <em>o que Cristo fez para sua Mãe <\/em>em nosso favor. De fato, entrega-lhe o discípulo predileto e, nele, entrega cada um de nós: “Eis aí o teu filho”. E de igual modo, diz a cada um de nós: “Eis aí a tua mãe” (Cf. Jo 19,26-27). Viver o memorial da morte de Cristo na Eucaristia [a Missa] implica também receber continuamente este dom. Significa levar conosco – a exemplo de João – aquela que sempre de novo nos é dada como Mãe» (<em>Ecclesia de Eucharistia<\/em>, n. 57)."}, {"t": "p", "x": "Já tinha pensado nisso? Recebemos Maria como Mãe em cada Missa! É para ficarmos loucos de agradecimento e de confiança!"}, {"t": "h", "x": "Mais orações do coração"}, {"t": "p", "x": "Tendo no coração essas luzes da fé, procuremos agir em consequência. Essas realidades podem inspirar-nos lampejos de devoção, daquelas «orações do coração», íntimas e silenciosas, de que falávamos na meditação passada."}, {"t": "p", "x": "É maravilhoso abrir os olhos interiores e “ver” que Nossa Senhora está também junto de Jesus Eucaristia, junto do altar, como esteve <em>junto da Cruz<\/em> (Jo 19,25); e, então, falar-lhe, pedir-lhe que nos ajude a rezar com amor as orações litúrgicas da Missa, que nos acompanhe a receber com fervor a Santa Comunhão; que se lembre, como diz a Liturgia, de dizer «coisas boas» a seu Filho em nosso favor."}, {"t": "p", "x": "E também estão presentes os santos, e os anjos. São Josemaria gostava de dizer que, no altar, na Missa, se sabia «rodeado de anjos», que com ele louvavam o Senhor."}, {"t": "p", "x": "Quando esteve no Brasil, em 1974, na véspera da sua partida, disse-nos, aos que convivemos com ele, as seguintes palavras, como um “legado de despedida”: «Quando vierem dizer ao Senhor – referia-se a Jesus sacramentado, presente no Sacrário –, talvez sem ruído de palavras: “Senhor, eu te amo, creio que estás aqui”, nesses momentos, louvem também a Santíssima Trindade, o Pai, o Filho e o Espírito Santo, e invoquem Maria e José, porque de alguma maneira estarão presentes no Sacrário, como o estiveram em Belém e em Nazaré. Não se esqueçam!»"}, {"t": "p", "x": "Antes de terminarmos hoje a reflexão, queria acrescentar um pensamento. Na Missa, você, com certeza, reza pelas pessoas queridas que já faleceram. Provavelmente tem a convicção moral – uma piedosa convicção íntima – de que muitas delas já estão no Céu ou, pelo menos, no Purgatório. Se é isso o que acha, não percebe que elas também têm que estar presentes neste «Céu sobre a terra» que é a Eucaristia? Por isso, repare que em nenhum lugar poderá estar mais perto das pessoas que amou – pai, mãe, esposa ou marido, filhos, parentes, amigos falecidos –, que em nenhum lugar poderá “conversar” melhor com eles do que na Santa Missa, na comunhão e rezando perto do Sacrário."}, {"t": "p", "x": "Como é grande a riqueza da Missa! Quantos motivos para vivê-la com fervor, em contínua oração! As diversas sugestões que vim comentando ficam aí, à sua disposição, como que guardadas numa arca sem chave, para que possa lançar mão ora de umas ora de outras, conforme os dias e a inspiração que Deus lhe der."}], "footnote": null}, {"n": 27, "label": "Capítulo 27", "title": "Amor à Missa: a ação de graças", "items": [{"t": "h", "x": "Ação de graças depois de comungar"}, {"t": "p", "x": "Receber Deus! Receber Jesus, «verdadeiro Deus e verdadeiro homem»! Pode haver um dom maior?"}, {"t": "p", "x": "Por isso, as almas que vivem da fé sempre sentiram a necessidade de dedicar um tempo mais ou menos longo a recolher-se após a Missa e a Comunhão (tanto se a Comunhão foi recebida na Missa, como em outro ato eucarístico, como por um doente em casa ou num hospital...); a recolher-se – dizia – para se compenetrarem da realidade da presença do Senhor dentro de si, e agradecer-lhe esse dom precioso."}, {"t": "p", "x": "Deixe-me adiantar-lhe que há uma coisa que você nunca deveria permitir-se, salvo em casos de urgente necessidade: comungar e, logo depois, ir embora ou ficar se distraindo, com o pensamento aéreo ou conversando dentro da igreja (ou na saída da igreja: na realidade, se tem tempo de conversar na saída, teria tido tempo de dar graças antes de sair)."}, {"t": "p", "x": "Vendo alguns descuidos e indelicadezas desse gênero, compreende-se o que fez em certa ocasião São Filipe Neri. Uma mulher, depois da comunhão – que o santo lhe tinha administrado –, saiu diretamente para a rua. São Filipe mandou então dois coroinhas paramentados acompanhá-la com velas acesas, um de cada lado, ao longo de todo o seu percurso; era isso o que se fazia, durante muitos séculos, quando um padre andava pela rua com o Santíssimo Sacramento para levar a comunhão aos doentes, ou o Viático a um moribundo."}, {"t": "p", "x": "Você deve ter reparado que, em algumas Missas, o celebrante se senta na <em>sede<\/em>,<em> <\/em>depois de distribuir a comunhão, e fica em silêncio por cinco ou mais minutos. Não é obrigatório fazer isso, mas, quando é possível, esse «silêncio sagrado» – como o chama a Liturgia – facilita muito a ação de graças dos fiéis."}, {"t": "p", "x": "Quando não se faz ou não é oportuna essa pausa dentro da Missa, você deveria permanecer na igreja após a Missa (melhor se começa ficando uns minutos de joelhos) e dedicar pelo menos de cinco a dez minutos a dar graças a nosso Senhor: fale com Jesus, que está dentro do seu peito, como se fala com o pai, a mãe, um irmão, um grande amigo!"}, {"t": "h", "x": "Sugestões para fazer uma boa ação de graças"}, {"t": "p", "x": "Não quero indicar-lhe “fórmulas” fixas para esses minutos de ação de graças, mas, apenas a título de exemplo, posso dar-lhe algumas sugestões:"}, {"t": "p", "x": "• É um bom costume começar a ação de graças fazendo alguns atos de fé, de amor e de adoração. Por exemplo: Jesus, sei que estás aqui comigo, eu te amo, te adoro, te dou graças por teres vindo a mim”."}, {"t": "p", "x": "«Renovemos – dizia São Josemaria – o oferecimento sincero do nosso amor; digamos-lhe sem medo que o amamos; agradeçamos-lhe esta prova diária de misericórdia, tão cheia de ternura, e fomentemos o desejo de nos aproximarmos da comunhão com confiança. Eu me surpreendo diante deste mistério de Amor: o Senhor procura como trono o meu pobre coração, para não me abandonar se eu não me afasto dEle» (É Cristo que passa, n. 161)."}, {"t": "p", "x": "• Procure depois falar com Ele, dizendo-lhe coisas íntimas – às vezes serão desabafos – com simplicidade, porque com Deus não devemos fazer “cerimônia”. É melhor uma brevíssima expressão carinhosa, ou um ato de agradecimento sempre repetido, ou contar a Nosso Senhor o que nos acontece, antes que fazer uma espécie de discurso retórico."}, {"t": "p", "x": "• Pode acontecer que, algumas vezes, sinta dificuldade em fazer o que sugiro acima. Nestes casos, costuma ser uma boa ajuda ler em silêncio (acompanhando por dentro as palavras com a maior atenção) algumas das “Orações para depois da Missa”, ou “Orações depois de comungar”, que se encontram em quase todos os devocionários ou livrinhos de orações do cristão."}, {"t": "p", "x": "Há várias orações de ação de graças tradicionais, antigas, que muitos santos e católicos piedosos recitaram ao longo de séculos: por exemplo, a oração a Jesus Crucificado, a oração “Alma de Cristo”, a oração de S. Tomás de Aquino, a atribuída ao Papa Clemente XI, as orações a Nossa Senhora e a São José, as orações de Santo Afonso para cada dia da semana, etc. Não se preocupe se, em dias em que a cabeça anda cansada, só consegue agradecer lendo essas orações. Os santos as usaram... e fizeram-lhes muito bem!;"}, {"t": "p", "x": "• É natural também que, nesses minutos de intimidade com Jesus, você lhe peça as coisas que mais deseja. São Josemaria dizia que não devemos preocupar-nos se «na ação de graças depois da Comunhão, a primeira coisa que te vem aos lábios, sem o poderes evitar, é a petição: – Jesus, dá-me isto! Jesus, aquela alma; Jesus, aquela atividade...». Isto – comenta o santo – é o que fazem as crianças: «o garotinho mete as mãos no bolso do pai, à procura de guloseimas, antes de lhe dar o beijo de boas-vindas» (<em>Caminho<\/em>, n. 896). Afinal, nós somos crianças diante de Deus;"}, {"t": "p", "x": "• Depois, ao longo do dia – ou à noite, se comungou de tarde –, não deixe de lembrar que recebeu Jesus, e de lhe dar graças de novo algumas vezes. E não duvide de que o melhor agradecimento será corresponder à graça recebida <em>com atos e de verdade<\/em> (1 Jo 3,18), procurando «que os nossos pensamentos sejam sinceros: de paz, de entrega, de serviço; que as nossas palavras sejam verdadeiras, claras, oportunas: que saibam consolar e ajudar, que saibam sobretudo levar aos outros a luz de Deus; que as nossas ações sejam coerentes, eficazes, acertadas: que tenham o <em>bom odor<\/em> de Cristo (2 Cor,2,15)» (É Cristo que passa, n. 156). Enfim, que na vida diária se note que recebemos a nosso Senhor."}], "footnote": null}, {"n": 28, "label": "Capítulo 28", "title": "Devoção ao Santíssimo Sacramento", "items": [{"t": "h", "x": "O olhar lúcido da fé"}, {"t": "p", "x": "Quero recordar a você que a fé é o único olhar totalmente lúcido que o homem pode ter, porque – no meio das sombras da vida – faz-nos ver as coisas como Deus as vê. Poderíamos dizer que quando a nossa alma se abre à graça da fé, Cristo, o autêntico <em>Sol nascente<\/em> (Lc 1,78), inunda-a com a luminosidade do Espírito Santo, e tudo na vida fica também iluminado."}, {"t": "p", "x": "Por que lhe digo isso agora? Porque vamos meditar sobre a devoção ao Santíssimo Sacramento, e acho muito importante começarmos renovando a nossa fé na presença real de Cristo na Eucaristia, também fora da Missa."}, {"t": "p", "x": "São Josemaria, quando estava – em pensamento ou de fato – na presença da Eucaristia, fazia o que ele chamava um ato de fé explícita: «Adoro-te com devoção, Deus escondido... Creio que és Jesus, o Filho de Maria sempre Virgem... Creio que estás presente com o teu Corpo, com o teu Sangue, com a tua Alma e com a tua Divindade... Meu Jesus, eu te adoro!»."}, {"t": "p", "x": "É bom lembrarmos isso agora que vamos refletir sobre o amor e a adoração ao Santíssimo Sacramento, não na Missa e na hora de comungar – isso já foi comentado –, mas quando encontramos Jesus realmente presente nas Hóstias consagradas que se reservam nos Sacrários das igrejas e capelas."}, {"t": "h", "x": "O tesouro escondido"}, {"t": "p", "x": "Acabo de lhe dizer “quando encontramos Jesus”. Mas, será que o encontramos? Cristo, nos Sacrários, é verdadeiramente aquele <em>tesouro escondido <\/em>de que fala o Evangelho (Mt 13,44): um tesouro <em>escondido num campo<\/em>, junto do qual passam muitos sem perceber nada, como se só houvesse lá terra, capim e pedras. Só o cristão que ama a Eucaristia é capaz de <em>encontrá-lo, cheio de alegria<\/em> lá onde há um Sacrário. Então, como na parábola, o feliz descobridor compreende que aquele tesouro vale mais que todos os bens da terra."}, {"t": "p", "x": "Você entende o que isso nos sugere? Imagine que você e eu vamos pela rua e passamos diante de uma igreja, um hospital ou um colégio católicos que têm capela. Lá há um Sacrário, lá dentro está o Santíssimo Sacramento – Cristo vivo! –, e nós podemos passar sem ligar a mínima, como aqueles viajantes indiferentes da parábola do samaritano. Que pena! Você vai-me dizer que anda pela rua distraído, que não tem má vontade. E eu lhe respondo: «Compreendo bem, mas seria ótimo que se propusesse tomar consciência da presença de Cristo tão perto de você e tentasse ter algum detalhe de amor para com Ele»."}, {"t": "p", "x": "Vou-lhe sugerir algumas atitudes práticas:"}, {"t": "p", "x": "• Comece agora refazendo mentalmente os seus itinerários mais habituais. Não precisa para isso nem de mapa nem de GPS. É fácil recordar as ruas e lugares onde você já sabe que há alguma igreja ou capela."}, {"t": "p", "x": "• Proponha-se então dizer algo a nosso Senhor, sempre que passar por esses lugares. Pode ser um ato de amor (“Jesus, que estás aí, eu te adoro, eu te amo!”), uma saudação simples e cordial (“Jesus, bom dia, acompanha-me hoje no trabalho!), ou – e essa pode ser uma excelente solução – reze uma “Comunhão espiritual”, que consiste em dizer a Jesus que desejaria recebê-lo com devoção. “Invente” a maneira de Lhe dizer isso."}, {"t": "p", "x": "Talvez o ajude aprender de cor a fórmula de uma bela Comunhão espiritual, que já foi rezada por almas muito santas e que hoje muitos utilizam. Diz assim: «Eu quisera, Senhor, receber-vos com aquela pureza, humildade e devoção com que vos recebeu a vossa Santíssima Mãe, com o espírito e o fervor dos santos»."}, {"t": "p", "x": "• Aproveito o anterior para acrescentar que a Comunhão espiritual bem rezada, em qualquer momento, lugar ou circunstância, tem um grande valor. Veja o que diz João Paulo II: «É conveniente <em>cultivar continuamente na alma o desejo do sacramento da Eucaristia<\/em>. Daqui nasceu a prática da “comunhão espiritual” em uso na Igreja há séculos, recomendada por santos mestres de vida espiritual. Escrevia Santa Teresa de Jesus: “Quando não comungais e não participais na Missa, comungai espiritualmente, porque é muito vantajoso. [...] Deste modo, imprime-se em vós muito do amor de nosso Senhor”» (Encíclica <em>Ecclesia de Eucharistia<\/em>, n. 34)."}, {"t": "p", "x": "Santo Tomás de Aquino afirma que uma comunhão espiritual rezada com fervor pode alcançar-nos muitas das graças que receberíamos se comungássemos sacramentalmente."}, {"t": "p", "x": "<em>A visita ao Santíssimo Sacramento<\/em>"}, {"t": "p", "x": "São Josemaria dizia: «Quando te aproximares do Sacrário, pensa que Ele!... faz vinte séculos que te espera» (<em>Caminho<\/em>, n. 537)."}, {"t": "p", "x": "Sim, no Sacrário Jesus “te” espera, “me espera”. Está oferecendo-nos um encontro pessoal e aguardando que nós aceitemos seu convite. Você entende a importância de fazer uma visita ao Santíssimo Sacramento, se possível diariamente?"}, {"t": "p", "x": "É verdade que Deus está em toda a parte. Mas Jesus vivo, com seu corpo, sangue, alma e divindade, com seu Coração humano batendo como quando estava visível na terra, só o encontramos no Santíssimo Sacramento. Sua presença deveria atrair-nos como um ímã."}, {"t": "p", "x": "Como é bom entrar numa igreja, numa capela, numa hora calma, e ajoelhar-nos diante do Sacrário, e olhar para ele, certos de que nosso olhar está se encontrando com o olhar de Jesus, e o nosso coração está sendo atingido pelo calor de seu Coração!"}, {"t": "p", "x": "Veja o que diz sobre isso João Paulo II: «É bom demorar-se com Ele e, inclinado sobre o seu peito como o discípulo predileto (cf.<em> Jo<\/em> 13, 25), deixar-se tocar pelo amor infinito do seu coração. Se atualmente o cristianismo se deve caracterizar sobretudo pela “arte da oração”, como não sentir de novo a necessidade de permanecer longamente, em diálogo espiritual, adoração silenciosa, atitude de amor, diante de Cristo presente no Santíssimo Sacramento? Quantas vezes, meus queridos irmãos e irmãs, fiz esta experiência, recebendo dela força, consolação, apoio!»."}, {"t": "p", "x": "E acrescenta, citando Santo Afonso Maria de Ligório, que «a devoção de adorar Jesus sacramentado é, depois dos sacramentos, a primeira de todas as devoções, a mais agradável a Deus e a mais útil para nós» (Encíclica <em>Ecclesia de Eucharistia<\/em>, n. 25)."}, {"t": "p", "x": "Como fazer essa visita? Com absoluta liberdade, como quiser:"}, {"t": "p", "x": "• Pode permanecer junto do Sacrário cinco minutos ou várias horas. No meio da azáfama do dia, podem bastar uns poucos minutos. Outras vezes, você sentirá a necessidade de ficar mais tempo."}, {"t": "p", "x": "Se participa de devoções tão recomendadas pelos Papas como a vigília de adoração noturna (uma noite de adoração, em que as pessoas se revezam), as Quarenta Horas, ou apenas um dia ou umas horas de adoração permanente (prática frequente hoje nas igrejas às quintas-feiras, com o Santíssimo Sacramento exposto no ostensório), então é lógico que você fique mais tempo, meia hora, uma hora..."}, {"t": "p", "x": "• E o que vai dizer a Jesus?. Deixe seu coração falar..., ou calar, e fique olhando com amor (que é uma boa forma de adoração). São Josemaria aconselhava: «Não abandones a visita ao Santíssimo. – Depois da oração vocal que tenhas por costume, conta a Jesus, realmente presente no Sacrário, as preocupações do dia. – E terás luzes e ânimo para a tua vida de cristão» (<em>Caminho<\/em>, n. 554)."}, {"t": "p", "x": "Essa “oração vocal” de que fala pode ser a que você preferir. Em muitos lugares é costume rezar o que tradicionalmente se chama “estação”, e que consiste em rezar três conjuntos de Pai-nosso, Ave Maria e Glória ao Pai, que se iniciam e terminam com uma invocação eucarística (por ex. “Graças e louvores se deem a todo momento ao Santíssimo e diviníssimo Sacramento”). Para finalizar, reza-se uma comunhão espiritual."}], "footnote": null}, {"n": 29, "label": "Capítulo 29", "title": "A Confissão: «Eu vim para que tenham vida»", "items": [{"t": "h", "x": "Para ter mais vida"}, {"t": "p", "x": "Aos católicos que desejam levar a sério a vida espiritual e chegar à maturidade cristã (cf. Ef. 4,13), sempre foi recomendada a prática da Confissão frequente."}, {"t": "p", "x": "Você sabe que a Confissão é um os sete Sacramentos – o Sacramento da Reconciliação ou da Penitência –, instituído por Jesus Cristo, quando, depois de ressuscitado, apareceu aos Apóstolos reunidos no Cenáculo e lhes disse: <em>“Como o Pai me enviou, assim também eu vos envio a vós”. Depois dessas palavras, soprou<\/em> <em>sobre eles dizendo-lhes: “Recebei o Espírito Santo; àqueles a quem perdoardes os pecados, ser-lhes-ão perdoados; àqueles a quem os retiverdes, ser-lhes-<\/em>ão retiros (Jo 20, 21-23). É impressionante. Se Cristo não tivesse dado esse poder aos sacerdotes, nós não nos atreveríamos a pensar que isso fosse possível."}, {"t": "p", "x": "Mas Jesus não quis limitar-se só a facilitar o “perdão” dos pecados por meio da confissão Fez muito mais."}, {"t": "h", "x": "Um canal de vida divina"}, {"t": "p", "x": "Para entender esse “muito mais”, você tem que pensar que todos os Sacramentos são fontes de graça, canais por onde Cristo nos concede a graça do Espírito Santo: <em>Eu vim para que tenham vida, e a tenham em abundância<\/em> (Jo 10,10). Ele está disposto a nos dar a graça sem medida (Jo 3, 34)."}, {"t": "p", "x": "Por esquecerem essa realidade, muitos acham que só deveriam confessar-se quando tem a desgraça de cometer pecados mortais, para ficarem livres deles e poder comungar. Quando não têm consciência de pecado grave, dizem: “Por que confessar-se? Para que a confissão frequente, mensal, ou até semanal?”."}, {"t": "p", "x": "Os que pensam assim ignoram que a Confissão não foi instituída por Cristo somente para perdoar os pecados, mas – como veremos a seguir – também para nos unir a Deus com mais amor, para nos fortalecer e para nos fazer amadurecer. Um texto antigo, citado no <em>Catecismo da Igreja Católica<\/em> (CIC), diz, de maneira muito bonita: «Toda a força da Penitência reside no fato de ela nos reconstituir na graça de Deus e de <em>nos unir a Ele com a máxima amizade<\/em>» (n. 1468)."}, {"t": "p", "x": "Para compreendermos melhor isso tudo, vamos considerar agora as duas circunstâncias em que os católicos bem formados costumam se confessar."}, {"t": "p", "x": "• Os bons católicos recorrem quanto antes à confissão, se têm consciência de haverem cometido um pecado mortal e, portanto, de terem perdido a graça de Deus."}, {"t": "p", "x": "• Além disso, procuram confessar-se frequentemente (uma vez por mês, cada quinze dias, semanalmente) dos pecados veniais, daquelas faltas que não nos privam da graça habitual, mas que vão deixando a alma adoentada. «Os pecados veniais – diz São Josemaria – fazem muito mal à alma», e afirma: «Já sei que evitas os pecados mortais. – Queres salvar-te! – Mas não te preocupa esse contínuo cair deliberadamente em pecados veniais, ainda que sintas o chamado de Deus para te venceres em cada caso. – É a tibieza que torna a tua vontade tão fraca» (<em>Caminho<\/em>, nn. 329 e 327)."}, {"t": "h", "x": "A confissão dos pecados graves"}, {"t": "p", "x": "«Aquele que quiser obter a reconciliação com Deus e com a Igreja – diz o <em>Catecismo<\/em> <em>da Igreja Católica <\/em>– deve confessar ao sacerdote todos os pecados graves que ainda não confessou e de que se lembra, depois de examinar cuidadosamente a sua consciência» (CIC, n. 1493)."}, {"t": "p", "x": "Depois, acrescenta: «A confissão individual e integral dos pecados graves, seguida da absolvição, continua sendo o único meio ordinário de reconciliação com Deus e com a Igreja» (CIC, n. 1497). Esta doutrina faz parte intangível da nossa fé católica."}, {"t": "p", "x": "Após lembrar isso, volto ao que dizíamos acima. Será que a confissão só “apaga” o pecado...e pronto? E resposta é: Não. Falando com linguagem teológica, além de conferir o perdão dos pecados e restituir a <em>graça santificante<\/em> (o “estado de graça”), se foi perdida, concede a <em>graça sacramental<\/em>."}, {"t": "p", "x": "Em que consiste essa <em>graça sacramental<\/em>? Fundamentalmente em duas coisas:"}, {"t": "p", "x": "• Em receber, junto com o perdão, um especial auxílio divino para fortalecer a alma na luta contra as tentações e evitar cair de novo nos mesmos pecados;"}, {"t": "p", "x": "• Além disso, Santo Tomás ensina que, depois de uma confissão bem feita, contrita, cheia de dor de amor, o penitente “pode” sair do confessionário tendo na alma um grau mais elevado de graça e caridade do que aquele que tinha antes de cair no pecado grave. Por isso, como é importante confessar-se com frequência e com fervor!"}, {"t": "p", "x": "Se você achar que não é bem assim, eu lhe direi que não compreendeu a parábola do filho pródigo. O rapaz abandona o pai, despreza-o, cai na gandaia, esbanja tudo, e acaba na miséria material e espiritual. Feito um farrapo humano, volta tremendo de medo para pedir perdão ao pai, e só espera que lhe permita ficar em casa como o último empregado."}, {"t": "p", "x": "E o pai, que faz? Radiante de alegria, adianta-se, vai ao encontro do filho que volta, <em>lançou-se-lhe ao pescoço e o cobriu de beijos<\/em>. A seguir, mandou colocar aquele filho ingrato no lugar de honra da casa: <em>Trazei depressa a melhor veste, e vesti-lha, e ponde-lhe um anel no dedo e calçado nos pés. Trazei também um novilho gordo e matai-o; comamos e façamos uma festa. Este meu filho estava morto e reviveu; tinha-se perdido e foi achado<\/em> (Lc 15, 17-24)."}, {"t": "p", "x": "Você percebe? Deus não se limita a dizer: “Eu te perdoo, vamos esquecer”. Faz muito mais. O filho pecador recebe mais carinho, mais honra e mais bens do que nunca. O amor de Deus sempre “exagera”, e nós somos tão tolos que o desprezamos..., com essa pretensão de que “não preciso me confessar!”."}, {"t": "h", "x": "A confissão dos pecados veniais"}, {"t": "p", "x": "«Apesar de não ser estritamente necessária – diz o <em>Catecismo da Igreja Católica <\/em>–, a confissão das faltas cotidianas (pecados veniais) é vivamente recomendada pela Igreja». A seguir dá quatro razões: «A confissão regular de nossos pecados veniais nos ajuda a formar a consciência, a lutar contra as nossas más tendências, a deixar-nos curar por Cristo, a progredir na vida do Espírito (na santidade)» (n. 1458)."}, {"t": "p", "x": "Meditemos sobre essas palavras. A pessoa que se confessa “regularmente”, recorrendo a bom um confessor:"}, {"t": "p", "x": "• Terá uma “consciência cada vez melhor formada”: saberá distinguir o que é certo do que é errado, o que é grave do que é leve, terá segurança nas suas decisões morais, evitará complicações de consciência."}, {"t": "p", "x": "• Além disso, como já vimos, será cada vez mais forte – como que “medicado”–para “lutar contra suas más inclinações” (impaciências, irritações, preguiça, curiosidade sensual, vaidade, críticas, descontrole da gula, inveja, etc.). Muitos cristãos, por não procurarem essa ajuda da confissão frequente, ficam encalhados nas mesmas faltas e não são “curados” por Cristo."}, {"t": "p", "x": "• Finalmente, a pessoa que pratica a confissão frequente “progride” no caminho do amor de Deus e do próximo, renova-se, descobre novas maneiras de fazer o bem."}], "footnote": null}, {"n": 30, "label": "Capítulo 30", "title": "A Confissão: «Teus pecados te são perdoados»", "items": [{"t": "h", "x": "Elementos essenciais da Confissão"}, {"t": "p", "x": "Na vida, tudo o que se faz bem feito é eficaz, traz um bem. Uma casa conseguirá ser bela, prática e aconchegante, se for construída com plantas e cálculos bem feitos, com bons materiais, com cuidado e perfeito acabamento de todos os elementos que a compõem."}, {"t": "p", "x": "De maneira análoga, uma confissão será “boa” e dará “frutos de graça” – como víamos na reflexão anterior –, se forem bem praticados e cuidados todos os elementos que a compõem. Você sabe que os «elementos essenciais» do Sacramento da Penitência» são os «atos do penitente» e a «absolvição do sacerdote» (Cf. <em>Catecismo<\/em>, n. 1448). Sem eles, não haveria Sacramento."}, {"t": "p", "x": "De nós dependem os «atos do penitente». Como aprendemos ao preparar-nos para a primeira Comunhão, são quatro: 1º o exame de consciência; 2º o arrependimento (que inclui o propósito de não pecar), 3º a confissão oral ao sacerdote; 4º a penitência ou satisfação."}, {"t": "p", "x": "Bem sabe que não estamos aqui para ter aulas teóricas. Mas o catecismo clássico é um guia excelente para a vida espiritual. Vamos ver, então, recordando-o, alguns conselhos práticos sobre cada um dos atos do penitente."}, {"t": "h", "x": "O exame de consciência"}, {"t": "p", "x": "O catecismo ensina que, para fazer uma boa Confissão, é necessário, antes de tudo, pedir luzes a Deus para conhecermos todos os nossos pecados. Para isso, lhe aconselho:"}, {"t": "p", "x": "• Antes de se confessar (no próprio dia, o antes), dedique uns minutos a fazer exame de consciência diante de Deus, procurando lembrar os seus pecados. Se acha que depois os vai esquecer, pode anotá-los. Pouco antes de se confessar, reveja a listinha que escreveu –a “cola” –, para refrescar a memória. Depois, triture ou risque logo o papel, ou apague a agenda eletrônica. Só use na hora se sua memória estiver fraca."}, {"t": "p", "x": "• Quando se trata de uma pessoa que leva muito tempo sem se confessar, a preparação deverá ser mais demorada, e é aconselhável que tenha antes uma conversa preparatória, calma, com o confessor, pedindo-lhe que o ajude a preparar-se bem."}, {"t": "p", "x": "• Há impressos bem práticos para fazer o exame, como os do livrinho “Orações do cristão” e outros devocionários. Normalmente trazem o elenco dos possíveis pecados cometidos contra cada um dos Dez Mandamentos."}, {"t": "p", "x": "• Às pessoas que se confessam com frequência, eu aconselharia a basear o exame, de preferência, nos sete Pecados Capitais (soberba, avareza, luxúria, ira, gula, inveja e preguiça), sem descurar antes uma olhada rápida aos dez Mandamentos. Por quê? Porque as pequenas faltas cotidianas costumam ser “satélites” dos pecados capitais."}, {"t": "p", "x": "Apenas como subsídio, vou enumerar os pecados capitais, colocando entre parênteses uns poucos exemplos de “satélites”:"}, {"t": "p", "x": "<em>Soberba<\/em> ou orgulho (vaidade, exibicionismo, falar de si, não saber ouvir os outros, ficar arrasado com uma pequena humilhação, preocupar-se demais com o que os outros pensam de si, agir de modo diferente quando está a sós e quando é visto...)."}, {"t": "p", "x": "<em>Avareza<\/em> (não ajudar os necessitados, ficar indiferente antes os problemas sociais da pobreza e da miséria, ser avarento do tempo, do afeto, da colaboração possível, dos pequenos serviços no lar, do sacrifício dedicado ao apostolado, do que poderia emprestar e não quer...)."}, {"t": "p", "x": "<em>Luxúria<\/em> ou sensualidade (olhares sensuais pela rua, na tv, na Internet, na banca de jornais, etc.; flertar frivolamente no trabalho; ter maus pensamentos ou desejos não afastados com a devida rapidez...)."}, {"t": "p", "x": "<em>Ira<\/em> (irritações, impaciências, raiva, respostas bruscas, reclamações ásperas, xingações, explosões...)."}, {"t": "p", "x": "<em>Gula<\/em> (excessos no comer e no beber; exigir requintes impróprios; abusar de chocolate, cerveja, doce; despesas exageradas por pura gulodice...)."}, {"t": "p", "x": "<em>Inveja<\/em> (tristeza porque os outros são ou têm mais do que nós, mesmo que não lhes desejemos mal; críticas invejosas; competitividade ansiosa...)"}, {"t": "p", "x": "<em>Preguiça<\/em> (de levantar, de estudar, de trabalhar, de rezar, de ir à Missa, de arrumar a cama, de cuidar das coisas materiais da casa, de visitar parentes ou doentes que precisam, etc. )"}, {"t": "p", "x": "Algumas dessas faltas podem aumentar de “calibre” e constituir um verdadeiro pecado mortal. Esclareça a consciência, neste ponto, com a orientação de um confessor experiente e prudente."}, {"t": "h", "x": "O arrependimento ou contrição"}, {"t": "p", "x": "Uma definição clássica diz que é «a dor da alma e o repúdio do pecado cometido, com a resolução de esforçar- -se para não mais pecar no futuro» (<em>Catecismo<\/em>, n. 1451)."}, {"t": "p", "x": "A Igreja ensina que há dois tipos de contrição:"}, {"t": "p", "x": "• A chamada “contrição perfeita”, que é a dor que tem como motivo o amor a Deus. É uma “dor de amor” por tê- -lo ofendido, por ser Ele quem é, bondade suma, que deu a vida por nós. Essa contrição é a ideal e, quanto mais impregnada de amor estiver, mais graça divina vai atrair."}, {"t": "p", "x": "Tenha em conta que “perfeita” não significa “máxima” – de máxima intensidade –, e, além disso, que não precisa “sentir” emocionalmente essa dor. Basta ter a “convicção” de que Deus é bom e nos ama, e de que nós o ofendemos ao pecar. Pode ajudá-lo olhar para um crucifixo beijá-lo, pensando no que Jesus passou pelos nossos pecados."}, {"t": "p", "x": "• A “contrição imperfeita” (ou “atrição”) é, como lembra o catecismo clássico, a dor e detestação dos pecados cometidos, por temor dos castigos de Deus nesta vida ou na outra; ou ainda porque nos incomoda a “fealdade” dessas faltas dentro da alma."}, {"t": "p", "x": "Essa contrição imperfeita, unida à absolvição sacramental, é suficiente para fazer uma confissão válida (mesmo de todos os pecados mortais), mas é bom lembrar de novo que o “fruto” do Sacramento aumenta na medida do amor. Por isso, Jesus disse a respeito da pecadora que chorava aos seus pés: <em>Seus numerosos pecados lhe foram perdoados, porque ela muito amou<\/em> (Lc 7, 47)."}, {"t": "p", "x": "É claro que a autêntica contrição inclui o <em>propósito <\/em>de não pecar mais. O propósito deve ser sincero, ainda que não exclua o temor de voltar a fraquejar e cair. Mas será sincero, mesmo havendo esse receio (que é diferente da má vontade), se concretizarmos alguns “meios” práticos para evitar os pecados confessados, como, por exemplo, pedir mais ajuda a Deus e à Virgem, comungar com mais frequência, evitar totalmente determinadas ocasiões perigosas, lugares, situações, pessoas ou conversas que nos possam levar a pecar..."}, {"t": "h", "x": "A confissão ao sacerdote"}, {"t": "p", "x": "«A confissão individual e integral dos pecados graves – citávamos antes –, seguida da absolvição, continua sendo o único meio ordinário de reconciliação com Deus e com a Igreja [...]. Aquele que quiser obter a reconciliação (...) deve confessar ao sacerdote todos os pecados graves que ainda não confessou e de que se lembra depois de examinar cuidadosamente a sua consciência». (<em>Catecismo<\/em> <em>da Igreja Católica<\/em>, nn. 1493 e 1497)."}, {"t": "p", "x": "«Todos os pecados graves». Em primeiro lugar, é preciso acusar de modo claro “cada um” dos pecados graves que a pessoa cometeu (por exemplo, “caluniei um superior, cometi adultério, subornei um funcionário público, faltei à Missa no domingo sem motivo justificado, assisti voluntariamente a um programa pornográfico da tv, deixei-me arrastar pela sensualidade até me masturbar, etc...”). Mas é preciso algo mais: dizer também o “número” de cada um desses pecados mortais, pelo menos o número aproximado (tantas vezes por semana, por mês, ou faltei à Missa durante tantos anos ou meses, ou aproximadamente dez vezes, etc.)."}, {"t": "p", "x": "Além disso, para fazermos a confissão “integral”, precisamos expor – se existem – as circunstâncias que tornam a falta mais grave (por ex., ter assistido a um programa pornográfico na tv estando presente um menor; ou ter agredido a própria mãe; ou ter mentido prejudicando seriamente outra pessoa, etc.)."}, {"t": "p", "x": "Em se tratando de pecados veniais, não é preciso dizer o número deles, nem acusá-los todos (a lista poderia ser interminável, e o cálculo angustiaria a alma). Mas é muito conveniente confessar-nos daqueles em que tropeçamos mais frequentemente, especialmente dos que prejudicam mais o relacionamento com os outros e o cumprimento responsável dos compromissos e deveres religiosos, familiares, profissionais e sociais."}, {"t": "p", "x": "Quer um bom conselho para fazer bem e aproveitar bastante cada confissão? Procure que, como recomendava São Josemaria, seja <em>clara, completa, concisa e concreta.<\/em> Boa coisa é lembrar-se desses quatro “cês”. A pessoa que se confessa com excesso de conversa, facilmente esquece que está vivendo um Sacramento, e perde o sentido sobrenatural."}, {"t": "p", "x": "Esteja convencido de que esvaziar o lixo da alma, mesmo que só se trate da “poeirinha” que se nos vai grudando, traz-nos uma paz e uma força que nenhum tratamento psiquiátrico nos poderia dar."}, {"t": "h", "x": "A penitência ou satisfação"}, {"t": "p", "x": "Em toda confissão, o sacerdote deve impor-nos uma penitência, que costuma consistir em algumas orações, algum sacrifício, alguma obra de caridade."}, {"t": "p", "x": "O seu significado é de “reparação” pelos pecados cometidos. É claro que as almas generosas costumam oferecer livremente, por decisão própria, além da penitência imposta pelo confessor, mais algumas orações e sacrifícios (por ex., aceitar sem queixas as dores físicas e o cansaço, um pequeno jejum, mais orações), com ânsias de reparar as ofensas feitas a Deus. Como costumava dizer São Josemaria, o amor a Deus move a «colocar amor lá onde se produziu um vazio»."}, {"t": "p", "x": "Lembre-se de que convém cumprir a penitência quanto antes. Ela faz parte do Sacramento (dos “atos do penitente”) e tem o valor especial do Sacramento. Assim, rezar uma Ave-Maria imposta pelo confessor como penitência é um ato com valor “sacramental” e, por isso, tem muito mais valor do de qualquer outra Ave-Maria rezada por iniciativa pessoal."}, {"t": "p", "x": "Na próxima meditação, veremos algumas dúvidas que nos podem tirar a paz, e o modo de não cair nas suas armadilhas."}], "footnote": null}, {"n": 31, "label": "Capítulo 31", "title": "A Confissão: «A minha paz vos dou»", "items": [{"t": "p", "x": "Ao despedir-se dos Apóstolos na Última Ceia, Jesus disse-lhes estas belas palavras, cuja primeira frase se recorda em todas as Missas: <em>A minha paz vos deixo, a minha paz vos dou.<\/em> (Jo 14,27)."}, {"t": "p", "x": "Jesus nasceu trazendo paz – <em>paz na terra aos homens de boa vontade <\/em>(Lc 2,14), proclamavam os anjos no Natal – e despediu-se dando paz: <em>A paz esteja convosco<\/em> (Jo 20,19)."}, {"t": "p", "x": "<em>Vai em paz!<\/em>, disse à mulher pecadora, depois de lhe perdoar os seus muitos pecados (Lc 7,50). É evidente que Ele quer que a Confissão seja uma fonte de paz para as almas. Portanto, não quer que nos aflijamos com dúvidas e confusões, que quase sempre são causadas por mal-entendidos (na realidade, por falta de formação ou de orientação moral)."}, {"t": "p", "x": "A reflexão de hoje vai versar sobre alguns desses mal-entendidos. Veremos apenas diversas dúvidas que são mais comuns."}, {"t": "h", "x": "Pecados duvidosos"}, {"t": "p", "x": "Não é raro ter dúvidas de dois tipos:"}, {"t": "p", "x": "• “Será que este pecado é grave, ou é só leve?”"}, {"t": "p", "x": "• “Será que cometi mesmo um pecado, que consenti, ou foi só uma tentação?”"}, {"t": "p", "x": "Nada como a doutrina para formar a consciência e esclarecer essas questões. Lembre-se sempre de que a Igreja ensina que, para que exista pecado grave, devem dar-se, simultaneamente, três condições: “matéria grave”, “plena advertência”, isto é, plena consciência do que se faz, e “consentimento deliberado” (Cf. <em>Catecismo da Igreja Católica<\/em> n. 1857)."}, {"t": "p", "x": "• Primeiro, “matéria grave”. Uma pessoa formada sabe que é grave ofender seriamente alguém, divulgar faltas graves do próximo que outros não conhecem, dizer mentiras que causem danos a outros, ter condutas injustas (não pagar o que é devido por justiça, trapacear nos negócios, eliminar o verdadeiro ganhador de um concurso ou concorrência por motivos escusos, praticar sexo fora do casamento, abortar, etc., etc.). Em caso de dúvida, deve consultar-se um bom confessor."}, {"t": "p", "x": "• Segundo, “consciência plena do que se faz”. Não pode ser grave um mau pensamento, sentimento ou ato que ocorreram durante o sono ou num estado de semi- -inconsciência. Também não costuma ser grave um rompante verbal de ira perante um estímulo forte e inesperado (o fato de não ser grave não significa que seja coisa boa, mas quer dizer que não faz perder o estado de graça e, portanto, não impede de comungar)."}, {"t": "p", "x": "• Terceiro, “consentimento pleno ou deliberado”. É bom recordar que uma coisa é “sentir” e outra “consentir”. A tentação pode-se sentir, até com violência (por exemplo, sentir com força – sem o querer nem o provocar – o desejo de agredir uma pessoa; ou um pensamento, fantasia, desejo ou movimento físico contrário à castidade). Mas, mesmo que a tentação seja insistente (que volte uma e outra vez, pegajosa como uma mutuca), não haverá pecado, pelo menos pecado grave, enquanto não for aceita, enquanto não se “quiser” deliberadamente (“quero mesmo fazer isso”, “esse desejo sexual, eu praticaria se pudesse”)."}, {"t": "p", "x": "Alguém dizia, de modo expressivo: “Primeiro você sentiu a tentação e, sem reparar, deteve-se um pouco nela, mas logo logo se acendeu na consciência o sinal vermelho: ‘Isto está errado, isto ofende a Deus’. Se, ao perceber o aviso da consciência, você repudia a tentação, reza e luta firmemente por afastá-la, esteja certo de que não pecou gravemente”."}, {"t": "p", "x": "Ainda sobre os pecados duvidosos, lembro-lhe que a Igreja ensina que não há obrigação de confessá-los, embora quase sempre seja bom mencioná-los na confissão para obter critério, mas – como ensinava São Pio X – «o certo deve ser confessado como certo e o duvidoso como duvidoso». Caso sofra do tormento da dúvida doentia, ou seja, dos escrúpulos de consciência, peça ajuda a Deus e siga fielmente as orientações do confessor. Quando for o caso – pois os escrúpulos angustiantes podem ser uma doença – consulte um médico de bom critério."}, {"t": "h", "x": "Confissões más e duvidosas"}, {"t": "p", "x": "Há certas confissões que infelizmente não são duvidosas, porque foram certamente mal feitas, inclusive sacrílegas. Lembre a esse respeito o que sempre nos ensinou a Igreja: A confissão é mal feita quando nela se oculta voluntariamente um pecado mortal ou quando não se tem arrependimento dos pecados. Quem, por vergonha ou medo, tivesse ocultado um pecado grave, ou mentido ao confessor em matéria grave, não alcançaria o perdão de nenhum dos pecado e a eles acrescentaria um sacrilégio. Por isso, deve-se repetir a confissão mal feita e todas as outras que se tiverem feito depois dela."}, {"t": "p", "x": "Uma coisa completamente diferente é o caso da pessoa que de repente se lembra de um pecado grave mais ou menos recente ou antigo, talvez da infância ou adolescência, e tem quase certeza de que – sem má vontade –não o confessou. A solução é simplicíssima: basta explicar o fato na próxima confissão, e acusar-se nela do pecado involuntariamente omitido, sem necessidade de repetir as confissões anteriores. Mas, antes de ter oportunidade de fazer essa confissão, pode continuar comungando."}, {"t": "p", "x": "O mesmo procedimento deve-se seguir quando uma pessoa bem preparada, logo depois de se confessar repara que se esqueceu involuntariamente de mencionar um pecado grave. A confissão fica sendo boa e válida. A pessoa pode comungar: só tem o dever de acusar o pecado esquecido na próxima confissão."}, {"t": "h", "x": "Sobre a penitência"}, {"t": "p", "x": "Não é raro que, em relação à penitência recebida, aconteça alguma dessas três coisas:"}, {"t": "p", "x": "• Esquecer-se na hora ou mais tarde, de qual foi a penitência que o confessor lhe impôs: “O que foi que me deu como penitência”?"}, {"t": "p", "x": "Neste caso, pode seguir uma das seguintes soluções: se for possível e houver tempo, pergunte ao próprio confessor qual foi a penitência que lhe deu; se não puder falar com ele, reze uma penitência parecida com a que o confessor lhe costuma dar em confissões semelhantes; ou então, fale disso na seguinte confissão, mesmo que o padre seja outro; ele lhe dará, normalmente, uma penitência pela confissão passada e outra pela atual, ou então uma penitência que abranja ambas as confissões."}, {"t": "p", "x": "• Outro caso. Imagine que o confessor, com a maior boa vontade, lhe deu uma penitência que, honestamente, você não pode cumprir sem graves inconvenientes. Diante disso, você tem duas soluções: uma é pedir a esse mesmo confessor o favor de trocá-la por outra equivalente, mas que seja viável; a outra é pedir isso mesmo a um outro confessor: qualquer confessor tem a faculdade de fazer essa troca, quando há motivo razoáveis e honestos."}, {"t": "p", "x": "• Imagine agora que não cumpriu, por distração, a penitência recebida na última confissão. Você, esquecido disso, vai à Missa e comunga. Uma semana depois, ao voltar de novo à Missa, recorda-se de que comungou sem cumprir a penitência, e diz: “Então não posso comungar”. Não é assim. Para a confissão ser válida (e estarmos, portanto, em condições de comungar), basta ter tido o “propósito” sincero (não revogado) de cumprir a penitência recebida. Tendo tido esse propósito e não havendo-o omitido por má vontade, comungue com paz e cumpra depois a penitência, mesmo que se tenham passado várias semanas ou meses."}, {"t": "h", "x": "Posso comungar e confessar-me depois?"}, {"t": "p", "x": "Se, infelizmente, tiver algum pecado mortal, não pode. Já vimos isso. A Igreja ensina-o claramente, e até em tempos antigos excomungava o padre que dissesse que proceder assim estava certo. O <em>Catecismo da Igreja Católica<\/em> – num texto já citado – recorda-o claramente: «Aquele que tem consciência de ter cometido um pecado mortal não deve receber a Sagrada Comunhão, mesmo que esteja profundamente contrito, sem receber previamente a absolvição sacramental, a menos que tenha um motivo grave para comungar e lhe seja impossível chegar ao confessor» (n. 1457)."}, {"t": "p", "x": "Além dos exemplos que dávamos em capítulos anteriores, ao falar da Missa e da Comunhão, outro «motivo grave para comungar» pode ser o do pai ou da mãe que, tendo-se preparado com carinho para acompanhar a Primeira Comunhão de um filho, no próprio dia da celebração, ou poucos dias antes, teve a desgraça de pecar mortalmente, e não conseguiu, por mais que procurasse, um padre que o atendesse em confissão antes dessa Missa tão especial. Também neste caso, a doutrina católica ensina que poderia comungar, pedindo antes, contrito, o perdão de Deus e estando firmemente decidido a se confessar quanto antes. Mas,evidentemente, se trata de uma exceção."}, {"t": "h", "x": "Basta a «confissão comunitária»?"}, {"t": "p", "x": "Neste tema, em que já houve e ainda há muita confusão, nada melhor do que ater-se fielmente à doutrina da Igreja Católica."}, {"t": "p", "x": "Há dois casos diferentes:"}, {"t": "p", "x": "• Uma coisa é a “celebração comunitária da penitência, prevista no Ritual dos Sacramentos (cf. <em>Catecismo<\/em>, n. 1482), que se processa assim: dentro de uma igreja ou capela, os fiéis reunidos escutam a leitura e o comentário de textos bíblicos sobre a penitência, e meditam sobre eles. Preparam-se espiritualmente para se confessarem, com uma pregação, orações, cânticos, etc. E pode ser lido um guia para facilitar que cada um faça interiormente o seu exame de consciência."}, {"t": "p", "x": "Terminada essa preparação, cada um dos fiéis vai confessar-se “individualmente” com algum dos sacerdotes presentes (sempre há vários) e recebe também individualmente a absolvição e a penitência. Terminadas todas as confissões individuais, de novo podem rezar em conjunto algumas orações e dar graças pelo perdão recebidoB) Completamente diferente é a “absolvição geral sem confissão individual”. Só é lícita em caso de “necessidade grave”. O <em>Catecismo<\/em> cita, como exemplo, o «perigo iminente de morte» (por ex., um avião em perigo, um naufrágio, um terremoto, um incêndio), ou situações extremas, como pode ser – caso isso aconteça – a de uma comunidade de fiéis que moram isolados na floresta amazônica, e só recebem a visita rápida de um padre uma vez por ano, sem terem tempo material de se confessar individualmente com ele."}, {"t": "p", "x": "Mas, fora desses casos de emergência, o <em>Catecismo <\/em>afirma que só o fato de se reunir «um grande concurso de fiéis por ocasião das grandes festas ou de peregrinação não constitui caso de tal necessidade grave» (n. 1483)."}, {"t": "p", "x": "Essa absolvição coletiva em caso de emergência, contudo, só será válida se a pessoa que a recebe está arrependida e, além disso, tem a decisão firme de completar a confissão – acusando-se de todos os pecados graves que não lhe foi possível confessar – na primeira oportunidade que tiver de recorrer individualmente a um confessor."}], "footnote": null}, {"n": 32, "label": "Capítulo 32", "title": "A direção espiritual", "items": [{"t": "h", "x": "Também a vida espiritual precisa de «técnico»"}, {"t": "p", "x": "Se você tem direção espiritual, já sabe da importância dessa orientação para manter em andamento a vida interior e, em geral, para progredir na vida cristã. Tanto se a tem como se não a tem, talvez o ajude pensar nas considerações que faremos a seguir."}, {"t": "p", "x": "É interessante lembrar que a Igreja sempre tem recomendado a direção espiritual a todos os que desejam amadurecer seriamente na vida cristã; de forma análoga a como um cardíaco procura a orientação de um cardiologista, e um jogador de futebol, de basquete ou de tênis têm um <em>coach<\/em>, um técnico – individual ou do time – que os prepara e orienta. Ninguém é bom técnico de si mesmo."}, {"t": "p", "x": "São Josemaria fala disso com uma imagem simples: «Convém que conheças esta doutrina segura: o espírito próprio é mau conselheiro, mau piloto, para dirigir a alma nas borrascas e tempestades, por entre os escolhos da vida interior. – Por isso, é vontade de Deus que a direção da nau esteja entregue a um Mestre, para que, com a sua luz e conhecimento, nos conduza a porto seguro» (<em>Caminho<\/em>, n. 59)."}, {"t": "h", "x": "O bom pastor"}, {"t": "p", "x": "O confessor e, em geral, a pessoa que atende a direção espiritual de outros, participa da missão do Bom Pastor. Como diz Jesus na parábola, o Bom Pastor conhece as suas ovelhas e elas o conhecem, vai indicando-lhes o caminho e as conduz a bons pastos, também as defende dos ladrões e do lobo (cf. Jo 10, 4-14), e procura as que se extraviaram pra ajudá-las a voltar (cf. Lc 15,4-7)."}, {"t": "p", "x": "O bom diretor espiritual deve ser um reflexo desse Bom Pastor, que é Jesus. Por isso, é importante pedir luzes ao Espírito Santo para escolher bem o diretor: sempre com plena liberdade, mas com o desejo sincero de avançar espiritualmente. Não adianta escolher um diretor espiritual que seja apenas um padre “amigão” para bater de vez em quando um papo superficial. E, menos ainda, procurar um confessor ou diretor que se limite a “compreender-nos” (ou seja, a desculpar-nos tudo!) e que não nos fale com clareza das nossas falhas, nem nos ajude, com afeto e firmeza, a lutar e a retificar os erros."}, {"t": "p", "x": "Para ter uma direção espiritual eficaz é importante que, depois de ter escolhido conscientemente um diretor, sejamos perseverantes e combinemos com ele conversas periódicas, por exemplo, mensais (não mais espaçadas do que isso). Não se pode chamar de direção espiritual o fato de ter um padre de confiança com quem se conversa só duas vezes por ano, ou com quem se consulta apenas alguma questão isolada."}, {"t": "p", "x": "Dizia que a escolha do orientador espiritual deve ser livre. Também deve ser livre a nossa decisão de praticar os conselhos que nos sugere. Mas a liberdade exige pensar e decidir responsavelmente. Peça, por isso, ao Espírito Santo – o verdadeiro Diretor divino das nossas almas –, que lhe conceda o dom de entendimento, para compreender o que Ele lhe quer dizer através do diretor espiritual, e o dom de fortaleza, para esforçar-se em cumpri-lo."}, {"t": "p", "x": "Creio que, após mais de cinquenta anos de experiência de direção espiritual, posso afirmar que só vi progredirem espiritualmente – e assim caminharem para a santidade, meta da vida cristã – os que praticam com perseverança um plano de vida espiritual e levam a sério, com constância, a direção espiritual."}, {"t": "h", "x": "Sugestões práticas"}, {"t": "p", "x": "Para viver com proveito a direção espiritual, além das sugestões que acabamos de ver, aconselho vivamente o seguinte:"}, {"t": "p", "x": "• Prepare bem cada conversa, fazendo um pouco de meditação a respeito e – se isso pode ajudá-lo – tomando umas notas por escrito: uma listinha dos temas de que quer falar; e, sobretudo, como lhe estou insistindo, pedindo muito a ajuda do Espírito Santo;"}, {"t": "p", "x": "• Não vá à direção para gastar o tempo com conversa mole, falando das notícias do jornal, do frio e do calor e de outras coisas que nada tem a ver. Em todo caso, só uns poucos minutos, como “prólogo” cordial para começo de conversa."}, {"t": "p", "x": "• Não se esqueça de começar informando como é que viveu os conselhos recebidos na última entrevista, as dificuldades com que deparou para cumpri-los, as fraquezas (preguiça, tentações,etc.) que o levaram talvez a abandoná-los, etc."}, {"t": "p", "x": "• Comente também as inspirações, os bons pensamentos que Deus despertou na sua alma para melhorar alguns defeitos, concretizar algumas iniciativas de vida espiritual ou de apostolado, fazer novas mortificações, etc."}, {"t": "p", "x": "É muito bom não ser “sujeito passivo”, que só escuta conselhos. Seja também “ativo”, ou seja, pense e apresente ao diretor novas propostas de luta espiritual (por exemplo:"}, {"t": "p", "x": "gostaria de ler tal livro; pensei em tais e tais penitências e temas de meditação para a Quaresma; gostaria de preparar o Natal assim; pensei que poderia ter tal conversa com um amigo afastado de Deus)."}, {"t": "p", "x": "• Os “temas” da direção espiritual, os assuntos que convém tocar nas conversas com o diretor, são muito variados, e é impossível falar de todos em uma só entrevista (tendo também em conta que, muitas vezes, só poderá contar com quinze minutos, meia hora ou pouco mais). Mas, como fizemos em outras reflexões, vou sugerir-lhe aqui alguns que julgo mais importantes:"}, {"t": "p", "x": "a. em primeiro lugar, fale claramente dos assuntos que – por vergonha, por medo de ficar mal e de desiludir o diretor – mais lhe custe falar: uma queda mais séria, uma infidelidade conjugal, uma reincidência na preguiça tola e nas omissões, etc. São Josemaria dizia que «quem oculta ao seu diretor uma tentação, tem um segredo a meias com o demônio» (<em>Sulco<\/em>, n. 323). E, em sentido positivo, acrescentava: «Acabaram-se as aflições... Descobriste que a sinceridade com o diretor conserta com uma facilidade admirável aquilo que se entortou» (<em>ibid.<\/em>, n. 335)."}, {"t": "p", "x": "b. depois, os problemas que estão exigindo mais esforço, mais oração e, às, vezes, mais conforto e até consolo: dramas familiares, filhos que se desencaminham, graves dificuldades no trabalho, doenças sérias. Tenha, porém, em conta que, se você só buscasse desabafo e consolo, não acharia solução. O melhor consolo é o “conforto”, ou seja, o conselho que fortalece a alma, que o ajuda a levar com garbo aquela cruz e a santificar-se com ela."}, {"t": "p", "x": "c. comente como foi o seu programa de vida espiritual: se o cumpriu, se foi constante e pontual, como fez a oração e o exame diário, como preparou as Comunhões, que empenho colocou em melhorar a presença de Deus no trabalho, como praticou as mortificações, que frutos ou dúvidas lhe suscitou a leitura do Evangelho e de algum livro espiritual, etc."}, {"t": "p", "x": "d. é preciso ir tratando das virtudes, em sucessivas conversas, especialmente daquela ou daquelas que mais falta nos fazem: humildade, paciência, castidade, ordem, intensidade e perfeição no trabalho, caridade, luta contra os defeitos do temperamento."}, {"t": "p", "x": "e. tendo em conta que não há verdadeiro amor a Deus sem amor ao próximo (cf. 1 Jo 4,20-21), falemos da nossa melhora no trato habitual com os que convivem e trabalham conosco (especialmente esposa, marido, filhos), e do apostolado que fazemos (primeiro, do apostolado pessoal com parentes, colegas, amigos; depois, da colaboração em iniciativas de apostolado)."}, {"t": "p", "x": "f. se estiver se sentindo incomodado por alguma dúvida de fé, alguma dificuldade para entender a doutrina da Igreja, algumas palavras ou atitudes do Papa que não entendeu, não deixe de apresentar essa dúvida ao diretor."}, {"t": "p", "x": "Depois de lhe dar essas sugestões, acho importante insistir – como fiz em outros temas – em que não se trata, em absoluto, de falar de “tudo” isso em cada conversa. Fale do que seja mais relevante, do que mexa mais com a sua alma, e especialmente do andamento das práticas espirituais. Em todo o caso, parece-me que essas sugestões não deixam de ser um roteiro útil para ir preparando e renovando, ao longo dos meses e dos anos, as conversas de direção espiritual e para avaliar se as está aproveitando bem."}], "footnote": null}, {"n": 33, "label": "Capítulo 33", "title": "A irradiação da vida interior", "items": [{"t": "h", "x": "A lareira e a seiva"}, {"t": "p", "x": "Você sabe que a vida interior não seria cristã se ficasse encapsulada no íntimo da alma, como num refúgio egoísta. A autêntica vida interior – de que tratamos em todas as reflexões anteriores – é como o fogo de uma lareira espiritual, que aquece e dá sentido divino à vida inteira: ao trabalho e à família, às alegrias e às penas, às tarefas e ao lazer, à vida do lar, e à generosidade que se prodigaliza em amor e serviço do próximo."}, {"t": "p", "x": "Cristo expressou claramente isso por meio da alegoria da «videira e os ramos»: <em>Eu sou a videira; vós, os ramos. Quem permanece em mim e eu nele, esse dá muito fruto... Se alguém não permanecer em mim..., secará... <\/em>(Jo 15, 5-6)."}, {"t": "p", "x": "E você sabe o que entende Jesus por «permanecer nele»? Ouçamos de novo palavras suas: <em>Como o Pai me ama, assim também eu vos amo. Permanecei no meu amor <\/em>(Jo 15,9)."}, {"t": "p", "x": "É disso que se trata. É para isso que queremos cultivar e levar a sério a nossa vida interior: para unirmo-nos a Cristo, a fim de nos impregnarmos da seiva do seu amor – do Amor que Jesus nos dá, derramando em nós a graça do Espírito Santo (cf. Rm 5,5) – e, assim, passarmos a viver uma “vida de amor”. Esse é o caminho da santidade, porque o amor é a essência da perfeição (cf. Col 3,14)."}, {"t": "p", "x": "«Tudo o que se faz por Amor – escreve São Josemaria – adquire formosura e se engrandece». E desvenda o panorama de uma vida «toda de amor»: «Fazei tudo por Amor.– Assim não há coisas pequenas: tudo é grande [...]. Queres de verdade ser santo? Cumpre o pequeno dever de cada momento; faze o que deves e está no que fazes [...]. Um pequeno ato, feito por amor, quanto não vale! ». (<em>Caminho<\/em>, nn. 429, 813-815)."}, {"t": "h", "x": "O ramo que dá fruto"}, {"t": "p", "x": "Se você tiver verdadeira vida interior (“verdadeira” significa sincera e esforçada, não “perfeita”), será um ramo que dará fruto, especialmente dará dois tipos de fruto:"}, {"t": "p", "x": "• O fruto das “virtudes”."}, {"t": "p", "x": "É impossível lutar para amar e unir-se a Deus se não se vai melhorando, crescendo continuamente, nas virtudes teologais (fé, esperança e caridade), e nas virtudes humanas (prudência, justiça, fortaleza e temperança, e as incontáveis virtudes que giram à volta delas)."}, {"t": "p", "x": "Por isso, São Paulo, quando fala dos frutos do Espírito Santo – que é o Amor divino substancial – enumera um série de virtudes: <em>O fruto do Espírito é: caridade, alegria, paz, paciência, afabilidade, bondade, fidelidade, mansidão, temperança<\/em> (Gál 5,22-23)."}, {"t": "p", "x": "A melhora nas virtudes é um primeiro teste de qualidade da nossa oração e, em geral, da nossa vida interior."}, {"t": "p", "x": "• O fruto dos “deveres”"}, {"t": "p", "x": "Ou seja, o melhoramento do conjunto de deveres que formam a tapeçaria do nosso dia-a-dia (deveres familiares, profissionais e sociais)."}, {"t": "p", "x": "Também nesse campo dos deveres, precisamos fazer o “teste” da verdadeira vida interior, formulando-nos algumas perguntas, que vou ilustrar com palavras de São Josemaria:"}, {"t": "p", "x": "a. Estou santificando a minha “vida familiar”?"}, {"t": "p", "x": "«Os casados – dizia São Josemaria – estão chamados a santificar o seu matrimônio e a santificar-se a si próprios nessa união; por isso, cometeriam um grave erro se edificassem a sua conduta espiritual de costas para o lar, à margem do lar. A vida familiar, as relações conjugais, o cuidado e a educação dos filhos, o esforço necessário para manter a família, para garantir o seu futuro e melhorar as suas condições de vida, o convívio com as outras pessoas que constituem a comunidade social, tudo isso são situações humanas, comuns, que os esposos cristãos devem sobrenaturalizar» (<em>É Cristo que passa<\/em>, n. 23)."}, {"t": "p", "x": "«Os casais têm graça de estado – a graça do Sacramento – para viverem todas as virtudes humanas e cristãs da convivência: a compreensão, o bom humor, a paciência; o perdão, a delicadeza no comportamento recíproco... Para tanto, o marido e a mulher devem crescer em vida interior e aprender da Sagrada Família a viver com delicadeza – por um motivo humano e sobrenatural ao mesmo tempo – as virtudes do lar cristão». (<em>Questões atuais do Cristianismo<\/em>, n. 108)."}, {"t": "p", "x": "b. Estou santificando o meu “trabalho”?"}, {"t": "p", "x": "«Na simplicidade do teu trabalho habitual – continuo a citar São Josemaria –, nos detalhes monótonos de cada dia, tens que descobrir o segredo – para tantos escondido – da grandeza e da novidade: o Amor» (<em>Sulco<\/em>, n. 489)."}, {"t": "p", "x": "«Não podemos oferecer ao Senhor uma coisa que, dentro das pobres limitações humanas, não seja perfeita, sem mancha, realizada com atenção até nos mínimos detalhes: Deus não aceita trabalhos “marretados”. Por isso o trabalho de cada qual – essa atividade que ocupa as nossas jornadas e energias – há de ser uma oferenda digna aos olhos do Criador; numa palavra, uma tarefa acabada, impecável» (<em>Amigos de Deus<\/em>, n. 55)."}, {"t": "p", "x": "«Deves manter – ao longo do dia – uma constante conversa com o Senhor, que se alimente também das próprias incidências da tua tarefa profissional»<em> <\/em>(<em>Forja<\/em>, n. 745). Como é importante a «presença de Deus» no trabalho!"}, {"t": "p", "x": "c. Estou santificando as minhas “relações sociais”?"}, {"t": "p", "x": "«Aí onde estão os nossos irmãos, os homens, aí onde estão as nossas aspirações, o nosso trabalho, os nossos amores, aí está o lugar do nosso encontro cotidiano com Cristo. Deus nos espera cada dia: no laboratório, na sala de operações de um hospital, no quartel, na cátedra universitária, na fábrica, na oficina, no campo, no seio do lar e em todo o imenso panorama do trabalho»<em> <\/em>(Homilia <em>Amar o mundo apaixonadamente<\/em>)<em>.<\/em>"}, {"t": "p", "x": "«O cristão [...], como Cristo, deve viver de rosto voltado para os outros homens, olhando com amor para todos e cada um dos que o rodeiam, para a humanidade inteira» (É Cristo que passa, n. 106)."}, {"t": "p", "x": "«Se deixarmos que Cristo reine na nossa alma..., seremos servidores de todos os homens» (É Cristo que passa, n. 182)."}, {"t": "p", "x": "E, falando especificamente do apostolado, São Josemaria acrescenta: «É preciso que sejas “homem de Deus”, homem de vida interior, homem de oração e de sacrifício. - O teu apostolado deve ser uma superabundância da tua vida “para dentro”» (<em>Caminho<\/em>, n. 961)."}, {"t": "p", "x": "Finalmente, tem palavras incisivas sobre a responsabilidade social dos cristãos, que nenhum pode esquecer: «Um homem e uma sociedade que não reajam perante as tribulações ou as injustiças, e não se esforcem por aliviá-las, não são nem homem nem sociedade à medida do amor do Coração de Cristo. Os cristãos – conservando sempre a mais ampla liberdade à hora de estudar e de aplicar as diversas soluções, e, portanto, com um lógico pluralismo – devem identificar-se no mesmo empenho em servir a humanidade. De outro modo, o seu cristianismo não será a Palavra e a Vida de Jesus: será um disfarce, um logro perante Deus e perante os homens» (É Cristo que passa, n. 167)."}, {"t": "p", "x": "Depois de passar os olhos pelos textos que acabo de transcrever, parece-me que você compreenderá melhor as palavras que São Paulo escreveu a Timóteo: <em>A piedade é útil para tudo, porque tem a promessa da vida presente e da futura <\/em>(1 Tim 4,8). Vale a pena, pois, esforçar-nos de verdade para adquirir uma vida interior séria, capaz de ser fecunda em todos os campos da vida e de dar muito fruto: <em>Nisto é glorificado meu Pai <\/em>– disse Jesus na Última Ceia –, <em>em que deis muito fruto <\/em>(Jo 15,8)."}], "footnote": null}, {"n": 34, "label": "Capítulo 34", "title": "Uma “garantia” importante: o plano de vida espiritual", "items": [{"t": "p", "x": "Ao terminar o Discurso da Montanha, que recolhe as linhas mestras do seu ensinamento (ver capítulos 5 a 7 do Evangelho de São Mateus), Jesus disse umas palavras que, depois do que meditamos nas páginas anteriores, convém muito escutar:"}, {"t": "p", "x": "«<em>Nem todo aquele que me diz: Senhor, Senhor, entrará no Reino dos Céus, mas sim aquele que faz a vontade de meu Pai que está nos céus<\/em>» (Mt 7,21). E acrescentou: «<em>Aquele que ouve estas minhas palavras e as põe em prática é semelhante a um homem prudente, que edificou a sua casa sobre a rocha<\/em>» (Mt 7,24)."}, {"t": "p", "x": "Ao longo dos diversos capítulos, consideramos os principais “meios” de vida interior. Dada a índole prática desta obra, ao tratar de cada um desses “meios”, procuramos oferecer sugestões que ajudassem a vivê-los com fruto, porque o que importa – acabamos de ouvir Jesus dizê-lo – é “<em>fazer<\/em> a vontade de Deus”, “pôr em <em>prática<\/em>” as suas palavras."}, {"t": "p", "x": "Pois bem, para assegurar de modo permanente a prática dos meios de vida interior, é necessária uma “garantia” eficaz: esta é o “plano de vida espiritual”. Assim como um cordão amarra um molho de flores, o plano “amarra” as práticas espirituais e impede que caiam e murchem."}, {"t": "h", "x": "O que é um “plano de vida espiritual”?"}, {"t": "p", "x": "O “plano de vida espiritual” consiste, simplesmente, em programar as práticas da vida interior (oração, comunhão, leituras, terço, etc.) de modo a garantir que sejam realizadas com <em>ordem e constância<\/em>. Esse “plano” inclui dois aspectos, já mencionados em várias ocasiões nas páginas deste livro:"}, {"t": "p", "x": "1º) A definição bem clara do “número” e do “tipo” de práticas espirituais que nos propomos realizar. Por exemplo: Vou começar fazendo um plano que inclua só três coisas: leitura do Evangelho, Terço e exame à noite. A direção espiritual pessoal poderá aconselhar-nos sobre esses dois pontos, ajudando-nos a determiná-los bem e a melhorá-los cada vez mais."}, {"t": "p", "x": "2º) O segundo aspecto consiste em definir, também claramente, a “hora” do dia em que cada prática será cumprida: um horário habitual para todos os dias de semana e outro para os feriados; ou então, se suas tarefas são muito variadas, um horário preparado especificamente para cada dia. Esse plano precisará ser ajustado conforme as mudanças e imprevistos que forem aparecendo (não conforme o nosso capricho e a nossa preguiça)."}, {"t": "h", "x": "Monotonia e amor"}, {"t": "p", "x": "«Sujeitar-se a um plano de vida, a um horário, é tão monótono!, disseste-me. – E eu te respondi: há monotonia porque falta Amor» (<em>Caminho<\/em>, n. 77)."}, {"t": "p", "x": "• Convença-se decididamente de que a “monotonia”, a “rotina”, não procedem da repetição das mesmas coisas, mas da fraqueza do amor. Talvez o entenda, tomando como referência um exemplo da vida:"}, {"t": "p", "x": "Uma boa senhora, durante uma celebração familiar, pediu-me para conversar um instante. Mal tinha começado a falar, e já chorava. Quando lhe perguntei por que, respondeu: “Durante vinte anos, meu marido, todos os dias, ao sair de casa para o trabalho, se despedia de mim com um beijo; desde faz dois meses, ele sai sem nem avisar”. Mal andava aquele amor. Tão mal, que o drama da separação veio pouco depois. Deu para entender? Enquanto temos “amor”, a repetição da mesma prática diária não é rotineira."}, {"t": "p", "x": "• Podemos não “sentir” amor e, no entanto, tê-lo... e bem grande. Quando uma mãe, morta de sono, levanta três, quatro vezes à noite para amamentar, trocar as fraldas, medicar ou acalmar o seu bebê, duvido que “sinta” uma grande satisfação e alegria, talvez até resmungue. Mas ela “ama” imensamente seu filho, e esse seu amor – quer o sinta na hora, quer não – torna bonitos e eficazes todos os seus atos."}, {"t": "p", "x": "• Se tiver oportunidade de ler alguma vida de Santa Teresa de Ávila, a mulher admirável, forte e empreendedora, que era ao mesmo tempo uma alma contemplativa de elevadíssima oração, verá como a santa relata que as horas de oração que lhe trouxeram mais proveito espiritual foram aquelas (muitas!), em que se sentia incapaz de pensar e de sentir, mas apesar da secura da alma perseverava na oração, lá na capela, <em>no horário certo<\/em>, entregando-se assim humildemente nas mãos de Deus..., que cumulava de graças essa sua fidelidade."}, {"t": "p", "x": "Esse exemplo pode servir-lhe, se alguma vez acha que comungar, rezar, ler, etc., não serve para nada porque você não muda, não melhora. Como podem servir-lhe também estas palavras de São Josemaria: «Quantos anos comungando diariamente! Qualquer outro seria santo – disseste- -me –, e eu, sempre na mesma! –Meu filho – respondi-te –, continua com a Comunhão diária e pensa: Que seria de mim se não tivesse comungado?» (<em>Caminho, <\/em>n. 534)."}, {"t": "h", "x": "Um fim ou um meio?"}, {"t": "p", "x": "• Pode acontecer que alguns, sem reparar, transformem o plano de vida num <em>fim<\/em>. Para eles, o importante é chegar à noite e poder dizer: “Cumpri tudo”. Se faltar alguma norma do plano, acharão que – para não sentir o mal estar da “inadimplência” – devem “cumpri-la” à noite, mesmo que seja atabalhoadamente e caindo de sono. Esse “cumprir” é “mentir”, porque não cumprem por amor a Deus, mas para se sentirem tranquilos, com a folha de serviços limpa. Desejam muito mais sentir-se “quites” do que agradar a Deus."}, {"t": "p", "x": "Também o fariseu da parábola do capítulo dezoito do Evangelho de São Lucas “cumpria” – <em>Jejuo duas vezes na semana e pago o dízimo de todos os meus lucros, etc. <\/em>(Luc 18,12) –, mas o fazia só para ficar “quites” com Deus. Por isso, Jesus diz que saiu do Templo reprovado."}, {"t": "h", "x": "À procura do amor"}, {"t": "p", "x": "Deve ficar muito claro para nós que o plano de vida é só um meio para amar a Deus e cumprir a sua vontade. É unicamente para alcançar essa meta que procuramos praticá-lo. O exemplo do amor humano pode mostrar-nos, por analogia, o valor desse plano. Com efeito, todo verdadeiro amor humano, requer:"}, {"t": "p", "x": "• Conhecer cada vez melhor a pessoa amada. Essa é, em grande parte – em relação a Deus –, a finalidade de várias “normas” do plano como a <em>leitura meditada da Bíblia <\/em>(especialmente do Evangelho)<em>; <\/em>a leitura <em>de livros de formação e de espiritualidade cristã; <\/em>a <em>meditação...<\/em>"}, {"t": "p", "x": "• O amor humano exige esforçar-se por não magoar ou ofender a pessoa querida e, se o fizemos, pedir-lhe perdão e reparar o mal feito. Aí está a razão dos <em>exames<\/em> de consciência, da <em>confissão<\/em> frequente, das <em>mortificações<\/em> que praticamos para vencer faltas e indelicadezas que ofendem a Deus."}, {"t": "p", "x": "• O amor humano exige dialogar (quantos amores não morrem por falta de diálogo!), conversar, saber escutar, abrir o coração... Isso é o que nos propomos com a <em>meditação<\/em>, a <em>oração mental<\/em>, a <em>visita ao Santíssimo Sacramento<\/em> e, em geral, com todo tipo de orações."}, {"t": "p", "x": "• Exige ainda ter, no dia a dia, muitos detalhes delicados. As práticas que cumprem essa finalidade são, entre outras, o <em>oferecimento do dia<\/em> a Deus, o <em>Anjo do Senhor,<\/em> as <em>jaculatórias<\/em> e outros pensamentos ou orações espalhadas, com o sal que dá sabor, ao longo do dia."}, {"t": "p", "x": "• Por fim, o máximo anseio dos que se amam é chegarem a ser um só coração, uma só vida, a terem uma união perfeita e feliz. Para nós, não há maior união com Deus – com Jesus – do que a <em>Eucaristia<\/em>: a <em>Santa Missa<\/em> e a <em>Comunhão<\/em>."}, {"t": "p", "x": "Você percebeu? Falando de “coisas de amor”, foram aparecendo, como atos naturais e muito convenientes, as diversas “normas” que compõem um plano de vida espiritual, e que fomos comentando – uma por uma – ao longo deste livro. Se procurarmos vivê-las com fidelidade, chegaremos, pouco a pouco, àquela meta que enche de sentido a vida e abre as portas da eternidade: a santidade."}], "footnote": null}];

<style>

<script>
var LIVRO = [{"n": 0, "label": "", "title": "Introdução", "items": [{"t": "p", "x": "Ao nos despedirmos de uma pessoa, muita vezes dizemos: «Vá com Deus, fique com Deus». É a melhor coisa que lhe poderíamos desejar, porque «estar com Deus» significa estar com a fonte de todo o bem e de toda a felicidade: com o Amor sem fim. <em>Deus é amor<\/em> – diz São João –, <em>e quem permanece no amor permanece em Deus e Deus nele <\/em>(1 Jo 4,16). Por isso, Santa Teresa de Ávila podia afirmar, com a força de uma experiência vivida: «<em>Quem a Deus tem, nada lhe falta<\/em>»."}, {"t": "p", "x": "Este livro foi escrito com a esperança de ajudar o leitor a «estar» com Deus, a «estar» habitualmente com Ele, realizando assim o desejo de Jesus: <em>Permanecei no meu amor <\/em>(Jo 9,9)."}, {"t": "p", "x": "Não se trata de uma coleção de aulas teóricas – embora tenham sempre presente a doutrina católica –, mas experiências, sugestões concretas para ir alcançando a «vida interior» (tão necessária a todos nós, excessivamente presos às coisas exteriores!), a fim de que, tendo Deus bem no íntimo da alma, possamos ser “portadores de Deus”, “outros Cristos” – assim se chamavam os primeiros cristãos –, e levar a luz, o calor e a paz de Deus ao próximo e à sociedade em que vivemos."}, {"t": "p", "x": "Esses conselhos práticos inspiram-se na grande tradição espiritual da Igreja, especialmente nos ensinamentos de São Josemaria Escrivá. Ele mostrou caminhos de vida interior e de santidade de vida ao alcance dos fiéis cristãos comuns, que vivem e trabalham no meio do mundo e aos quais se dirige principalmente este livro."}], "footnote": null}, {"n": 1, "label": "Capítulo 1", "title": "Deus sempre nos fala: como ouvi-lo?", "items": [{"t": "p", "x": "Vamos começar as nossas reflexões sobre a vida interior dedicando várias meditações à oração, que é a “respiração” da alma, o bater do coração cristão, uma necessidade vital para os filhos de Deus."}, {"t": "p", "x": "Para início de conversa, lembremos que fazer oração é “falar com Deus”. A Bíblia diz que Deus e Moisés conversavam <em>como um homem fala com seu amigo<\/em> (Ex 33,11). Jesus, que é Deus feito homem, conversava com os apóstolos, com Marta e Maria..., e os chamou de “amigos” (Jo 15,15)."}, {"t": "p", "x": "Você sabe que os <em>verdadeiros<\/em> amigos (que não são muitos) falam com confiança, de alma aberta. Sabem escutar um ao outro, contam-se o que trazem no coração, abrem-se com plena sinceridade. Assim deveria ser a nossa oração, ou seja, a nossa conversa com Deus."}, {"t": "p", "x": "Mas você talvez me diga: “Eu falo, eu digo coisas a Deus, melhor ou pior, mas falo. Falo –em voz alta ou mentalmente –sempre que rezo: <em>Pai nosso<\/em>! <em>Jesus, eu te amo<\/em>!, etc. Não digo que seja fácil rezar de verdade, mas o que não sei mesmo é como posso ouvir a Deus. Em que consiste ouvir a Deus?”."}, {"t": "p", "x": "Boa pergunta e, além disso, muito importante. Porque a oração deve ser “diálogo” e não monólogo: eu não converso com Deus se só eu fico falando e me escuto apenas a mim mesmo."}, {"t": "p", "x": "Sobre o modo de ouvir a Deus, sobre as condições do coração para ouvir a Deus, a maneira de ter certeza de que o escutamos a Ele, e não a nós mesmos, há muitas coisas interessantes a dizer, coisas que – se Deus quiser –, procuraremos comentar em outras páginas deste livro. Mas, para começo de conversa, vale a pena adiantar algumas dicas práticas:"}, {"t": "p", "x": "• Primeiro, pense que só escuta quem quer escutar, ou seja que a primeira condição é “desejar” que Deus nos fale ao coração; não há pior surdo que o que não quer ouvir."}, {"t": "p", "x": "• Em segundo lugar, veja claramente que não se trata de pedir milagres: não vamos pretender que Deus apareça e nos fale ao ouvido com palavras sonoras. Deus, como diz o profeta Oséias, <em>fala ao coração<\/em> (Os 2,14)."}, {"t": "p", "x": "• Mas, mesmo sem o som das palavras, Deus, que sempre nos vê, nos ouve e nos ama, tem muitos modos de nos falar ao coração. Lembraremos agora só alguns, tendo em conta que “esses” modos serviram a muitos santos para ouvir coisas decisivas para a vida, que Deus lhes comunicava:"}, {"t": "p", "x": "a. Como diz a Carta aos Hebreus, Deus que, ao longo da história, <em>falou<\/em> <em>muitas vezes e de muitos modos, pelos profetas, nestes dias <\/em>(que duram desde que Cristo nasceu até que o mundo acabe) <em>nos falou por meio do Filho<\/em>, Jesus (Hebr 1,1-2). Onde é que ouviremos o que Jesus nos diz, a você, a mim? Nas páginas dos quatro Evangelhos. Leia-os devagar, leia um pouco todos os dias, leia com toda a atenção, e pense: é uma “carta” íntima, confidencial, que Deus escreveu para mim; sempre me dirá alguma coisa;"}, {"t": "p", "x": "b. Deus diz-nos muitas coisas por meio dos bons livros espirituais cristãos. Sugiro, por exemplo, começar a ler, sem pressa, o livro <em>Caminho<\/em>, a conhecida obra de São Josemaria Escrivá, ou outro livro bom de espiritualidade cristã;"}, {"t": "p", "x": "c. Fala-nos ainda Deus, e de modo muito especial, por meio das inspirações do Espírito Santo: bons pensamentos que nos sugere, bons sentimentos, luzes espirituais que de repente mostram soluções para problemas, ou alertas interiores – como sinais vermelhos que se acendem – sobre os nossos caminhos errados, ou apelos para servir os outros e assumir tarefas de apostolado. São inspirações que captamos <em>claramente<\/em> e que, para serem autênticas, devem ter as <em>quatro<\/em> seguintes características:"}, {"t": "p", "x": "– que não sejam contrárias à santa Lei de Deus,"}, {"t": "p", "x": "– que sempre nos impulsionem a amar mais a Deus e aos outros,"}, {"t": "p", "x": "– que nos ajudem a cumprir com amor os deveres,"}, {"t": "p", "x": "– que deixem a alma cheia de paz."}, {"t": "p", "x": "d. Finalmente, Deus se utiliza, para nos falar, dos conselhos de pessoas boas, de bons cristãos bem formados, que têm doutrina e trato íntimo com Deus. Lá no fundo da alma, nós percebemos quando é que esses conselhos estão “na linha de Deus” e não na linha egoísta do que “nós gostaríamos de ouvir”. Especial destaque merecem os conselhos do diretor espiritual, se o tivermos."}, {"t": "p", "x": "Por ora, fiquemos com estas reflexões, que são apenas um esboço de muitas outras que, se Deus quiser, iremos fazendo mais amplamente nos próximos capítulos."}], "footnote": null}, {"n": 2, "label": "Capítulo 2", "title": "A oração mental", "items": [{"t": "p", "x": "Todos os cristãos costumamos falar com Deus: fazer oração."}, {"t": "p", "x": "Umas vezes utilizamos belas orações já existentes, como os Salmos, o Terço, as orações e os cânticos litúrgicos, outros hinos, poemas e cânticos religiosos: essa é a “oração vocal”."}, {"t": "p", "x": "Outras vezes, falamos com Deus em silêncio, só com os nossos pensamentos e com os sentimentos do nosso coração, sem nenhuma fórmula fixa: é a “oração mental”. Hoje, vamos refletir um pouco sobre ela."}, {"t": "p", "x": "Penso que todos nós gostaríamos de ter com frequência um diálogo espontâneo com Deus, em que falássemos com Ele sobre a nossa vida, os nossos trabalhos, os nossos anseios, os desejos de servir; ou os problemas, dúvidas, indecisões... Mas a verdade é que nem sempre conseguimos. Pode até ser que tenhamos desistido de tentar porque achamos que “para mim, não dá”."}, {"t": "p", "x": "Hoje gostaria de lhe dizer que vale a pena fazer um esforço. Porque a oração mental, quando aprendemos a fazê-la (coisa que pode demorar um pouco), é uma fonte maravilhosa de paz, de luz, de perspectivas, de alegrias. Tente! Para ajudá-lo, vou começar sugerindo-lhe algumas ideias básicas:"}, {"t": "p", "x": "• Primeiro, precisamos de uma hora e lugar certos. O <em>Catecismo da Igreja Católica<\/em> diz: «A escolha do tempo e da duração da oração mental depende de uma vontade determinada... Não fazemos oração quando temos tempo: reservamos um tempo...com a firme determinação de...não o tomarmos de volta» (n. 2710)."}, {"t": "p", "x": "Jesus disse: <em>entra no teu quarto, fecha a porta e ora a teu Pai em segredo<\/em> (Mt 6,6). O lugar pode ser o seu quarto, uma igreja ou uma capela sossegada, ou um jardim, ou uma montanha durante uma excursão...; o importante é que possa estar só e tranquilo para se concentrar (não a faça deitado na cama, porque vai cochilar!). E a duração, para começar, pode ser, por exemplo, de dez minutos diários; depois convirá aumentá-la."}, {"t": "p", "x": "Não esqueça, porém, de que uma oração mental íntima, de “linha direta” com Deus, pode surgir a qualquer momento e em qualquer lugar. Aproveite todas as inspirações do Espírito Santo."}, {"t": "p", "x": "• Continuemos tratando da oração habitual, em hora e lugar certos. Antes de falar nada, comece pensando no seu interlocutor, em Deus. Faça um ato de fé na presença dEle. Por exemplo: “Creio firmemente que estás aqui, que me vês, que me ouves”, “Senhor, que eu te veja com os olhos da fé!”"}, {"t": "p", "x": "• Inicie o diálogo com a maior simplicidade. Diga-lhe mentalmente, por exemplo: “Senhor, me ajude a falar consigo”, ou “Jesus, não sei o que dizer”, ou “Meu Deus, me desculpe, mas hoje vou começar pedindo uma coisa que muito desejo”. Se não lhe ocorre nada, faça então como aquele rapaz, distribuidor de leite em domicílio – conhecido de São Josemaria –, que abria a porta da igreja e só dizia: “Jesus, aqui está João o leiteiro!”."}, {"t": "p", "x": "«As palavras na oração – diz o <em>Catecismo da Igreja<\/em> – não são discursos, mas gravetos que alimentam o fogo do amor» (n. 2717)."}, {"t": "p", "x": "• Às vezes pense num assunto concreto, para falar dele com simplicidade, por exemplo, pergunte a Jesus: “Senhor, por que me irrito sempre com Fulano?” Peça-lhe luz e tente ser sincero diante dEle: “Será que eu não sou orgulhoso demais, e por isso não sei compreender essa pessoa?”."}, {"t": "p", "x": "• Leve sempre um livro de orações ou de reflexões espirituais. Quando se sentir “seco”, sem saber o que dizer, abra-o e leia um trechinho. Essa leitura breve poderá ser a “pista de decolagem” da oração mental e, às vezes, o levará a transformar a oração mental numa “meditação” mais reflexiva."}, {"t": "p", "x": "Uns vão precisar de mais pista para decolar – ler um trecho mais longo –, outros de menos. O importante é que, quando uma ideia da leitura nos “atinja”, façamos o esforço de refletir um pouco e tentar descobrir alguma aplicação prática: “Isso é o que eu deveria fazer!”. Se isso acontecer, peçamos a Deus forças para melhorar naquele ponto, e agradeçamos-lhe as inspirações que Ele despertou em nós."}, {"t": "p", "x": "Um exemplo de um texto brevíssimo que poderia ser “pista de decolagem” de uma boa oração mental, é o ponto n. 814 do livro <em>Caminho<\/em>: «Um pequeno ato, feito por Amor, quanto não vale!». Fale disso com Deus: “Senhor, quantos atos pequenos – como um sorriso, um detalhe de ordem material, uma pequena ajuda no trabalho – eu poderia ter feito hoje com amor, e não os fiz! Me ajude a enxergar essas coisas e a fazê-las."}, {"t": "p", "x": "Peça e proponha-se alguma dessas ações; por exemplo, dizer “bom dia” de modo mais cordial lá em casa, ou na escola, ou no escritório. Só isso já seria um bom fruto da oração mental."}], "footnote": null}, {"n": 3, "label": "Capítulo 3", "title": "A meditação", "items": [{"t": "p", "x": "Falemos agora um pouco sobre a “meditação”, que é uma forma de oração semelhante e, ao mesmo tempo, diferente da oração mental, ainda que as duas estejam tão interligadas que se “fundam” em muitos momentos numa só coisa."}, {"t": "p", "x": "Quando o <em>Catecismo da Igreja Católica<\/em> fala da “oração mental” (o nosso tema anterior) diz – citando Santa Teresa de Ávila – que é «um relacionamento íntimo de amizade em que conversamos... a sós com Deus», e a chama também «comunhão de amor» (nn. 2709-2719). Ou seja, é sobretudo –como já vimos – diálogo íntimo e espontâneo."}, {"t": "p", "x": "Por sua vez, o mesmo <em>Catecismo<\/em>, quando fala da “meditação” diz que «é sobretudo uma procura; o espírito procura compreender o <em>porquê<\/em> e o <em>como<\/em> da vida cristã, a fim de aderir e responder ao que o Senhor pede». E acrescenta: «Geralmente utiliza-se um livro» (n. 2705). E, assim, «<em>meditando no que lê<\/em>, o leitor se apropria do conteúdo lido, confrontando-o consigo mesmo” (n. 2706). Quer dizer que faz da leitura um espelho em cujo fundo, iluminado por Deus, a pessoa se contempla e se conhece a si mesma: percebe, assim, mais claramente as falhas, os deveres, os rumos que deve seguir, as melhoras que deve se propor, os ideais de vida fraterna e de apostolado que deve incorporar."}, {"t": "p", "x": "Tudo isso é algo que muitos também fazem na “oração mental”. Mas, ainda que frequentemente oração mental e meditação se fundam numa só coisa, não esqueça que há orações mentais sem meditação nenhuma ou quase nenhuma, como a da pessoa que, diante do Sacrário, passa o tempo só olhando com carinho e dizendo: “Jesus, eu te adoro”, “Jesus, eu te amo!”..."}, {"t": "p", "x": "É importante entender como é que a meditação pode ser vivida no dia a dia. Vejamos algumas sugestões:"}, {"t": "p", "x": "• Primeiro, um conselho prático já mencionado, em que voltarei a insistir a propósito de diversas práticas espirituais: reserve diariamente uns minutos para a meditação em um lugar e com uma duração fixos."}, {"t": "p", "x": "• A meditação tem como ponto de partida, normalmente, um “livro”. O <em>Catecismo da Igreja<\/em> refere-se a três tipos de livro: a) livros impressos (um trecho da Bíblia ou de um livro espiritual, escolhido por nós, ou que nos foi aconselhado); b) o livro da natureza (quando diante do mar, dos campos e vales, de um jardim florido, do céu estrelado, meditamos sobre a grandeza e a beleza de Deus Criador); c) o livro da nossa vida (como é que eu sou, o que é que acontece comigo, por que me sinto vazio, por que não consigo isso ou aquilo, como cumpro os meus deveres, que virtudes eu tenho e que outras me fazem falta, etc.) (Cf. nn. 2705 e 2706)."}, {"t": "p", "x": "• É preciso fazer o esforço de refletir. Não há mais remédio que vencer a preguiça mental. Mas não devemos meditar trabalhosamente como quem “estuda” para uma prova escolar, para um concurso público ou para preparar uma palestra. A oração sempre deve ser simples e cordial, sem perder de vista Deus, que está perto do nosso coração. Por isso, não é prático demorar-nos num texto difícil, em que encalhamos, fazendo um “braço de ferro” com ele para ver se conseguimos entendê-lo (é melhor anotar o trecho difícil para consultar depois a quem possa esclarecê-lo)."}, {"t": "p", "x": "Detenhamo-nos, pelo contrário, em textos sugestivos, que nos facilitem ver melhor as coisas de Deus e aquelas que Deus nos pede; que nos mostrem o exemplo de Jesus, de Maria, de algum santo; ou que ajudem a fazer exame sobre coisas pessoais que deveriam mudar."}, {"t": "p", "x": "Às vezes, basta ler, reler devagar e meditar uma única frase, “como quem chupa bala”, até que o “sabor” – a compreensão do que nos diz – penetre na alma."}, {"t": "p", "x": "• Pode ajudar muito, tomar algumas notas em um caderno ou agenda (de papel ou eletrônica): anotar frases que nos “tocaram”, ou “luzes” claras sobre assuntos concretos, ou soluções concretas que podemos levar à prática. E, sempre, no meio da reflexão, convém que vamos entremeando – como pequenas faíscas que aquecem o coração – frases breves do tipo: “Jesus, faz com que eu veja!”, “Senhor, se queres podes limpar-me!”..."}, {"t": "p", "x": "Como diz o <em>Catecismo<\/em>, temos que «passar dos pensamentos à realidade» (n. 2706), à vida real e prática, a conclusões que nos ajudem a mudar e melhorar."}, {"t": "p", "x": "• Nunca ache que a meditação é inútil. Se a cabeça, algum dia, está cansada ou obtusa, fique só lendo e relendo (“chupando bala”). O livro <em>Caminho<\/em> diz, com toda a razão: «Persevera na oração. – Persevera ainda que o teu esforço pareça estéril. – A oração é sempre fecunda» (n. 101)."}, {"t": "p", "x": "• Quer ver os frutos bons da oração, mesmo daquela que parece inútil?"}, {"t": "p", "x": "a. em primeiro lugar, são bons frutos as resoluções práticas, que nos incentivam a lutar para pensar melhor, trabalhar melhor, tratar melhor a Deus e aos outros, etc;"}, {"t": "p", "x": "b. outras vezes bastará – já será um bom fruto –que tenhamos captado uma “luz”, e fiquemos felizes com isso: “Agora entendo a maravilha da Eucaristia, ou o que é ser humilde! Agora compreendo que sou teimoso demais nas discussões, e que isso é orgulho” (cf. <em>Sulco<\/em>, n. 263)."}, {"t": "p", "x": "c. num dia em que não conseguirmos concretizar nada, já será um belo fruto sair da oração melhor dispostos, com mais paz na alma, com mais sede de louvar a Deus e de alegrar os outros..."}, {"t": "p", "x": "Todos esses são resultados ótimos. Peça a Deus, por intercessão de Nossa Senhora, que sempre brotem da sua meditação."}], "footnote": null}, {"n": 4, "label": "Capítulo 4", "title": "As condições da oração: o recolhimento", "items": [{"t": "p", "x": "Qualquer forma de oração – meditação, oração mental, oração vocal – precisa de umas condições favoráveis, da mesma maneira que uma planta só cresce numa terra adequada e com um clima propício."}, {"t": "p", "x": "• Em primeiro lugar, para orar bem precisamos das condições “exteriores” imprescindíveis: “recolhimento exterior”. Ninguém consegue conversar com paz no meio do barulho estridente de uma apresentação de rock, nem no meio dos gritos das torcidas exaltadas num estádio."}, {"t": "p", "x": "É verdade que se pode rezar bem na rua, no carro, no ônibus, num trem atulhado de gente, em meio ao barulho do trânsito, mas, para isso, é preciso possuir as condições de “recolhimento interior” de que falaremos depois."}, {"t": "p", "x": "Em todo o caso, não há dúvida de que deveríamos esforçar-nos por garantir um mínimo de condições “exteriores” de recolhimento. Concretamente – volto a insistir –, orar num local e ambiente que nos permita isolar-nos sem ser atrapalhados."}, {"t": "p", "x": "• Contudo, bem mais importantes do que as condições “exteriores” são as condições “interiores”, necessárias para fazer uma boa oração. Vamos começar, pois, pensando no “recolhimento interior”."}, {"t": "p", "x": "Nunca lhe aconteceu de estar sozinho, à noite, na cama ou em algum lugar isolado e silencioso, e perceber que não consegue se concentrar, porque há uma enorme confusão, uma agitação caótica dentro de você? Cruzam pela cabeça, como foguetes, ou ficam martelando, pensamentos variadíssimos: lembranças do dia que passou, preocupações e medos que ficaram entalados, ansiedade pelo que se esqueceu de fazer ou pelo que terá de fazer amanhã, “filminhos” em que você é o protagonista vencedor ou humilhado... E, assim, não consegue concentrar-se, nem rezar, nem meditar, nem falar em paz com Deus."}, {"t": "p", "x": "Ou será que tem medo de se enfrentar a sós com a sua alma, porque teme o vazio que nela vai descobrir? Você deve conhecer, como eu, pessoas que são incapazes de ficar dez minutos sós, em silêncio: sentem uma espécie de vertigem, experimentam o mal-estar de quem se acha pendurado sobre o abismo do nada, querem evitar a todo o custo ter que escutar a voz da consciência. Por isso, tratam de se esquivar à sinceridade, à verdade, com diversas “técnicas de fuga”: horas e horas de Internet à toa, de televisão, de som; de baladas, de bebida, ou simplesmente de cochilo e sono... A alma está vazia e precisam tapá-la."}, {"t": "p", "x": "Como vê, acabamos de descrever duas causas de falta de recolhimento interior muito comuns:"}, {"t": "p", "x": "- o descontrole da imaginação, da memória e das emoções"}, {"t": "p", "x": "- e o medo de ser sincero para se enfrentar consigo mesmo."}, {"t": "p", "x": "Hoje ficaremos apenas com a primeira dessas faltas de recolhimento interior, e tentaremos sugerir alguns meios para consegui-lo. Na próxima ocasião, refletiremos sobre a segunda."}, {"t": "p", "x": "Para conquistar o recolhimento interior e dominar aos poucos o caos da imaginação, da memória e dos sentimentos, há, principalmente, três meios:"}, {"t": "p", "x": "• Primeiro, um meio muito simples...e nada fácil! “A ordem”: tanto a ordem material como a ordem nos horários e tarefas."}, {"t": "p", "x": "Uma pessoa desorganizada vive com marimbondos na cabeça, que não lhe dão sossego: “Tenho muito que fazer..., mas o que faço primeiro?”, “Esqueci, não anotei, não previ... e vou chegar tarde, vou perder o prazo...”, “Por que não aproveitei a chance que tive de fazer uma ligação ou uma visita, e de resolver ou ao menos encaminhar esse problema que agora me aflige ou me deixa frustrado?”, “Passou-me o aniversário de Fulano!”, “Não previ bem, e agora não dá mais para estudar tudo o que precisaria para as provas”..."}, {"t": "p", "x": "Muito bem diz o livro <em>Caminho<\/em>: «Virtude sem ordem? – Estranha virtude» (n.79), e «Quando tiveres ordem, multiplicar-se-á o teu tempo...» (n. 80)."}, {"t": "p", "x": "Aconselho que, em um dia em que estiver afobado e sentir a agonia de um monte de coisas a fazer que se agitam por dentro, pare, detenha por cinco minutos a “correria”: sente-se, pegue num papel (melhor numa agenda) e anote os assuntos pendentes, colocando-os em coluna e recolocando-os a seguir pela ordem de precedência que julgar melhor."}, {"t": "p", "x": "Depois disso, verá duas coisas: os “marimbondos” não são “tantos” como a imaginação insinuava, e o tempo não é “tão curto” como parecia. Normalmente, dá para fazer tudo ou quase tudo (Como faz falta a agenda, e como é grande a preguiça de usá-la!)."}, {"t": "p", "x": "Se, ainda por cima, percebe que se demora demais em certas tarefas, telefonemas ou “papos-moles” e que poderia também ter aproveitado melhor alguns intervalos e tempos “mortos”, descobrirá que, com uma ordem bem planejada, o tempo rende bem mais do que imaginava. Então, com o dia assim preenchido e sem a ansiedade nas tarefas, chegará à noite ou acordará de manhã com mais paz, poderá sentar-se, recolher-se e estar em melhores condições de ler e de orar com serenidade e proveito."}, {"t": "p", "x": "• Segundo meio: vencer a curiosidade inútil ou má. Os olhos e os ouvidos são janelas..., e às vezes são bueiros de esgoto. Veja o que deixa entrar na alma por aí. Porque o que entra, fica, e depois pica (como os mosquitos e as cobras). É preciso lutar para evitar a curiosidade infantil ou sórdida, descontrolada, é preciso fazer a mortificação de vencer-se nesse defeito. Quando se vai conseguindo, nota- -se que a paz aumenta na alma."}, {"t": "p", "x": "• Terceiro meio, que também não é fácil, mas é possível e muito conveniente. Mal perceba que a imaginação e a memória se agitam com imagens e pensamentos inúteis ou nocivos, não se largue ao embalo deles, mas procure reagir. Poderá fazê-lo com um ato de vontade – “tenho que parar de pensar nisso, vou pensar em outra coisa” –, ou, melhor, pedindo ajuda a Deus, a Nossa Senhora, ao seu Anjo da Guarda. Também, por exemplo à noite, quando não conseguir adormecer, reze seguidamente orações brevíssimas (jaculatórias, como faziam os santos), ou os Pai-nossos e as Ave-marias do terço; ou, se a insônia for mais forte, pegue num livro bom. Alguém recomendava, com humor, um livro pesadão, que possa ter a função de “sonífero”."}, {"t": "p", "x": "Recolhimento! Já viu que, no fundo, consiste na conquista do silêncio exterior e interior."}, {"t": "p", "x": "Hoje, vou terminar esta meditação citando-lhe umas palavras da Madre Teresa de Calcutá: « O fruto do silêncio é a oração. O fruto da oração é a fé. O fruto da fé é o amor. O fruto do amor é o serviço – (a intimidade com Deus sempre leva a servir os outros!) –. O fruto do serviço é a paz»."}, {"t": "p", "x": "Não gostaria de ser alma de oração e seguir esse “itinerário da paz”?"}], "footnote": null}, {"n": 5, "label": "Capítulo 5", "title": "As condições da oração: a sinceridade", "items": [{"t": "p", "x": "Na reflexão anterior, meditávamos sobre a necessidade de conseguirmos condições favoráveis, externas e internas, para poder fazer uma boa oração: o recolhimento exterior e o recolhimento interior."}, {"t": "p", "x": "Mencionávamos também uma outra condição, sem entrara fundo nela: para orar, é preciso ter sinceridade, a coragem de enfrentar a verdade no íntimo do coração. Vamos refletir agora sobre isso."}, {"t": "p", "x": "É interessante verificar que o primeiro conselho de Cristo sobre a oração, que se encontra no Evangelho, fala de sinceridade: «Quando orardes – diz Jesus –, não façais como os hipócritas» (Mt 6,5)."}, {"t": "p", "x": "Que fazem os “hipócritas”? Vamos recordar o que Jesus nos diz acerca deles, e – ao vermos as máscaras que Cristo lhes arranca da alma – enxergaremos melhor a sinceridade que nos pede."}, {"t": "p", "x": "• Primeira máscara: No meio da parábola do semeador, nosso Senhor faz uma citação do profeta Isaías: <em>O coração deste povo se endureceu: taparam seus ouvidos e fecharam os seus olhos, para que seus olhos não vejam e seus ouvidos não ouçam, nem seu coração compreenda; para que não se convertam e eu os sare<\/em> (Mt 13,15)."}, {"t": "p", "x": "Como são claras e fortes essas palavras! O segredo está no final da frase: não querem se “converter”, ou seja, não estão dispostos a aceitar a graça de Deus, que os curaria dos seus erros passados e os levaria a mudar. Isso faz com que seu coração se “endureça”; e essa dureza de coração se manifesta na má vontade, que leva a não querer ouvir nem ver (tapar os ouvidos e fechar os olhos)."}, {"t": "p", "x": "Que Deus nos livre dessa dureza de coração! Mas..., será que não temos um pouco disso? Às vezes, custa-nos abrir o coração com plena sinceridade diante de Deus, expor sem medo a nossa vida à luz das exigências do Evangelho, dispor-nos a acolher os conselhos de um bom confessor..., simplesmente porque não queremos mudar. “Não quero me complicar!”. O coração deixou de ser manso e flexível, e ganhou a dureza da pedra. Agir assim é a mesma coisa que expulsar Deus da alma, e dizer-lhe: “Não me toques, não mexas comigo, não me perturbes, fica longe de mim!”."}, {"t": "p", "x": "Como é bela a sinceridade de uma alma que, quando vai orar, abre de par em par o coração, disposta a aceitar todas as luzes, inspirações, repreensões e exigências que Deus lhe quiser manifestar. Só ora bem uma alma transparente, uma alma corajosa, disposta a mudar."}, {"t": "p", "x": "• Segunda máscara: a do fariseu da parábola. Sobe ao templo, e ora no seu interior desta forma: <em>Graças te dou, ó Deus, porque não sou como os outros homens: ladrões, injustos e adúlteros; nem como o publicano que está ali. Jejuo duas vezes na semana e pago o dízimo de todos os meus lucros<\/em> (Lc 18, 9-14)."}, {"t": "p", "x": "É a máscara do orgulho, do convencimento, da falsa bondade. Aparentando piedade, o fariseu, na realidade, se defende. Ele, no fundo, diz a Deus: “Veja, Deus, eu sou bom: não tenho pecado. Não falho nas minhas obrigações religiosas, e não me misturo com pecadores como esse publicano aí... Portanto, estamos quites, o Senhor não tem nada que reclamar de mim, pode me deixar em paz”."}, {"t": "p", "x": "Nunca conheceu cristãos assim? Dizem: “Não faço pecados, não preciso me confessar; eu cumpro as minhas obrigações; rezo; vou à Missa sempre que posso”. Com essa mentalidade, é impossível falar com Deus e ouvi-lo."}, {"t": "p", "x": "«O orgulho cega tremendamente», dizia São Josemaria Escrivá. Cuidado! Porque esse orgulho que nos leva a justificar-nos, vai nos congelando, cristalizando no erro, no mal, na mediocridade. É natural que o Espírito Santo, quando encontra o nosso coração endurecido, nos recorde o que Jesus comentava acerca do fariseu: <em>Não saiu do templo justificado<\/em>. Por quê? Porque <em>Deus resiste aos soberbos e só dá a sua graça aos humildes<\/em> (1 Pedr 5,5)."}, {"t": "p", "x": "Entende-se assim o que diz o <em>Catecismo da Igreja Católica<\/em>: «O pedido de perdão é o primeiro movimento da oração...» (n. 2631), e que cite como exemplo a oração do publicano, ouvida e aceita por Deus: <em>Tem piedade de mim, pecador<\/em> (Lc 18,13)."}, {"t": "p", "x": "• Terceira máscara: Essa máscara é também Jesus quem a arranca da alma de alguns hipócritas, quando afirma: <em>Nem todo aquele que me diz “Senhor, Senhor!”, entrará no Reino dos céus, mas sim aquele que faz a vontade de meu Pai que está nos céus<\/em> (Mt 7,21)."}, {"t": "p", "x": "Glosando estas palavras, São Josemaria falava da «oração dos filhos de Deus», em contraste com o palavreado dos hipócritas: «Que o nosso clamar – Senhor! – se una ao desejo eficaz de converter em realidade essas moções interiores que o Espírito Santo desperta na alma» (<em>Amigos de Deus<\/em>, n. 243)."}, {"t": "p", "x": "A oração do egoísta sentimental, que gosta de rezar, que chora ao cantar na Igreja, que se emociona com um bom sermão..., mas que não procura captar nem realizar a Vontade de Deus, é a “oração dos hipócritas”, que têm duas vidas separadas: a vida “espiritual” e a vida prática, real."}, {"t": "p", "x": "• Quarta máscara: É a que nos mostra, com palavras brevíssimas, esta frase de Cristo: <em>Quando vos puserdes de pé para orar, perdoai, se tiverdes algum ressentimento contra alguém, para que também o vosso Pai que está nos céus vos perdoe os vossos pecados<\/em> (Mc 11,25)."}, {"t": "p", "x": "Se – como acabamos de lembrar – o pedido de perdão é «o primeiro movimento da oração» (<em>Catecismo<\/em>,<em> <\/em>n. 2631), com que sinceridade pode falar com Deus aquele que pede perdão, mas não perdoa. Poucas coisas existem que sujem tanto a alma como o ressentimento. É uma barricada entre o Deus da misericórdia e o pecador que somos nós. É lógico que, entre interlocutores tão díspares, não possa haver diálogo."}], "footnote": null}, {"n": 6, "label": "Capítulo 6", "title": "As condições da oração: detestar o que ofende a Deus", "items": [{"t": "h", "x": "Amar e ofender?"}, {"t": "p", "x": "«Orar é falar com Deus», é um diálogo com Deus. Esta é uma verdade básica que procuramos não perder de vista nas anteriores reflexões. Mas, para a oração ser um bom diálogo com Deus – como víamos –, tem que ser uma conversa de amor,. Na realidade, toda a oração cristã deveria ser sempre uma procura muito sincera do Amor de Deus, um “intercâmbio de amor” entre Ele e nós."}, {"t": "p", "x": "Para isso, como acabamos de ver, precisamos da sinceridade."}, {"t": "p", "x": "Ora – pense bem nisso – como é possível dizer a Deus sinceramente que o amamos, se não nos importamos com aquilo que, na nossa vida, o ofende, nem que seja de leve? Seria como se, ao mesmo tempo que lhe dizemos “Senhor, eu te amo”, continuássemos friamente a espetar-lhe os pregos e a coroa de espinhos das nossas faltas e pecados."}, {"t": "p", "x": "Quanta razão não tem São Josemaria Escrivá quando diz que, para fazer a oração dos filhos de Deus, «temos que esforçar-nos para que não haja em nós a menor sombra de duplicidade. O primeiro requisito para desterrar este mal, que o Senhor condena duramente (cf. Mt 7,21-23), é procurar comportar-nos com a disposição clara, habitual e atual, de aversão ao pecado. Energicamente, com sinceridade, devemos sentir, no coração e na cabeça, horror ao pecado grave. E, numa atitude profundamente arraigada, temos que detestar também o pecado venial deliberado, essas claudicações que, embora não nos privem da graça divina, debilitam os canais por onde ela nos chega» (<em>Amigos de Deus<\/em>, n. 243)."}, {"t": "h", "x": "Inconformismo santo"}, {"t": "p", "x": "Todos nós temos um monte de pecados veniais (é só deles que vamos falar nesta meditação), que já aderiram à nossa alma como musgo, como bolor, como plantas parasitas que roubam a “seiva” da alma, enfraquecem-na e, sobretudo, ferem o amor a Deus. Temos..., mas ficamos sem fazer nada ou quase nada para vencê-los."}, {"t": "p", "x": "Pecados veniais? A lista seria interminável. Bastem uns poucos exemplos corriqueiros: irritações e impaciências em casa e no trabalho, que se repetem de modo habitual; palavras e olhares que magoam; muitas concessões à preguiça, que nos levam a fazer mal o trabalho, a adiar os deveres que custam, a dedicar menos tempo que o devido a Deus e aos outros; caprichos da gula que não se justificam; curiosidade mórbida, que nos põe em perigo de pecar contra a castidade; pequenas maledicências, etc."}, {"t": "p", "x": "Tentamos justificar-nos dizendo que “ninguém é perfeito”, o que é uma grande verdade, mas é uma verdade que interpretamos mal, pois confundimos as fraquezas e limitações inevitáveis (que sempre existem, até nos santos), com as faltas que são evitáveis e deveriam ser evitadas, verdadeiros “pecados” veniais que, se quiséssemos e pedíssemos ajuda a Deus, poderíamos evitar. Temos que ser santamente “inconformistas” com eles."}, {"t": "p", "x": "Jesus nos lembra repetidas vezes que o primeiro mandamento é <em>amar a Deus com todo o coração, com toda alma, com toda a mente e com todas as forças<\/em> (Mc 12,30), e por isso, no livro do Apocalipse, revela a São João a “mágoa” que lhe produzem os cristãos que se conformam com um amor medíocre, contaminado pelo pecado venial consentido: <em>Tenho contra ti que arrefeceste o teu primeiro amor... Não achei as tuas obras perfeitas diante de meu Deus<\/em>“ (Apoc 2,4 e 3,2)."}, {"t": "p", "x": "Convençamo-nos de que «os pecados veniais fazem muito mal à alma» (<em>Caminho<\/em>, n. 329). Não nos esqueçamos nunca de que não é compatível falar carinhosamente com Deus, enquanto “guardamos” dentro da alma hábitos e pecados veniais, que são “parentes” daquelas cusparadas, tapas, chicotadas e espinhos que caíram sobre Cristo na Paixão, quando sofria pelos nossos pecados (ver 1 Cor 15,3)."}, {"t": "h", "x": "Meios a empregar"}, {"t": "p", "x": "Então, o que havemos de fazer? Dizer a Deus, “sim, eu te amo”, e, ao mesmo tempo, empregarmos toda a força do nosso amor – robustecido pela graça de Deus – numa luta diária por vencer esses hábitos e pecados."}, {"t": "p", "x": "Meios para isso? Vários deles iremos comentá-los nos próximos capítulos. Mas, para já, podemos enunciar os principais: confissão frequente, com verdadeira dor dos pecados e com o desejo de nos corrigirmos e de reparar; exame de consciência todas as noites; pedir ao confessor conselhos e leituras que nos orientem nas nossas lutas concretas; e sermos mais mortificados (este será o próximo tema destas nossas reflexões)."}, {"t": "p", "x": "Talvez você pergunte: – Empregando esses meios, será fácil vencer o pecado venial?"}, {"t": "p", "x": "Será possível, ainda que não seja fácil, sobretudo se esses pecados são hábitos que já têm raízes fortes. Mas será possível mesmo, porque Deus está conosco e quer “lutar conosco”, como dizia Pascal."}, {"t": "p", "x": "Pede-nos, porém, a humildade de não desanimar e sempre recomeçar a luta, mesmo que tornemos a cair nas mesmas faltas por fraqueza (o desânimo, aí, seria orgulho, vaidade de querer ver-nos a nós mesmos perfeitos); pede- -nos reforçar a oração e frequentar mais a comunhão para obtermos mais graça; e, especialmente, pede-nos levantar- -nos logo das quedas, retificando rapidamente e confessando-nos, quando for o caso."}, {"t": "p", "x": "Por ser muito animador, quero terminar citando mais um trecho do livro <em>Caminho<\/em>: «Sei que te portaste bem..., apesar de teres caído tão fundo. – Sei que te portaste bem, porque te humilhaste, porque retificaste, porque te encheste de esperança e a esperança te trouxe de novo ao Amor. – Não faças essa cara boba de surpresa; de fato, te portaste bem! Já te levantaste do chão... Agora, ao trabalho!» (n. 264)."}], "footnote": null}, {"n": 7, "label": "Capítulo 7", "title": "As condições da oração: a mortificação", "items": [{"t": "p", "x": "«Se não te mortificas, nunca serás alma de oração» (<em>Caminho<\/em>, n. 172)."}, {"t": "p", "x": "Por quê? Porque dentro de nós há, como diz São Paulo, duas forças opostas em contínua luta: o “homem velho” e o “homem novo” (ver Ef 4,22-24). O homem velho tem um nome: “egoísmo”, fruto do pecado original e dos pecados pessoais. O homem novo também tem um nome: “amor”, fruto da presença do Espírito Santo na alma e da nossa correspondência."}, {"t": "p", "x": "Os dois “homens” são como brigões que puxam de uma corda, cada um por um extremo, em sentido contrário. Se o “velho” levar a melhor, arrasta-nos para longe de Cristo. Mas toda vez que o “novo” vence – “mortificando” o egoísmo com a força do amor –, aproxima-nos de Deus, da amizade com Cristo, da união com Ele. Que acha? Não é justamente isso o que procuramos com a oração? Sim, é a intimidade com Deus, a sintonia com Deus, a amizade que tudo compartilha com o Amigo (ver Jo 15,15)."}, {"t": "p", "x": "Por isso, entende-se bem que Jesus diga: <em>Se alguém quiser vir comigo, negue-se a si mesmo <\/em>[negue o “eu” egoísta]<em>, tome a sua cruz e siga-me<\/em> (Mt 16,24)."}, {"t": "p", "x": "A mortificação voluntária é a negação dos puxões do “eu egoísta”: é um sacrifício que consiste em dizer não aos maus desejos e inclinações, para poder dizer sim ao que o amor pede. Por isso, a mortificação bem entendida deveria chamar-se, melhor, “vivificação”, pois ela é fonte de vida e não de morte."}, {"t": "p", "x": "Agora perguntemo-nos: Que tipos de mortificação são necessários para podermos ser “almas de oração”? Penso que se podem resumir em cinco:"}, {"t": "p", "x": "• A mortificação externa: a da ordem e pontualidade na oração. «É preciso vencer – diz São Josemaria – a poltronaria, o falso critério de que a oração pode esperar. Não adiemos nunca essa fonte de graças para amanhã. O tempo oportuno é agora» (<em>Amigos de Deus<\/em>, n. 246); e também a da preguiça e sonolência na oração."}, {"t": "p", "x": "• A mortificação da gula. Não faça essa cara de estranheza. Sim, gula e oração têm muito a ver, como ensinavam os mestres cristãos dos primeiros séculos. Comer demais, além de fazer mal ao corpo, enfraquece a alma e torna-a “pesada”. No século V, o abade João Cassiano, excelente mestre da oração, escrevia: «O primeiro combate que devemos empreender é contra o espírito de gula. A abstinência corporal não tem outra razão de ser senão conduzir-nos à pureza do coração»."}, {"t": "p", "x": "Doze séculos mais tarde, o famoso padre Manuel Bernardes perguntava: «Sendo certo que o primeiro passo da vida espiritual é sair-se da cozinha e despensa, que progressos espirituais suporemos ter feito quem tiver o coração na cozinha e despensa?»."}, {"t": "p", "x": "• A mortificação da imaginação. Já nos referimos a ela ao tratar do recolhimento interior. Não podemos ter a imaginação à solta, ao longo do dia. Dizem que Santa Teresa de Ávila a chamava a “louca da casa”, o que é uma grande verdade; quem não se acostuma a mortificar devaneios à toa, verá a sua oração estragada por um bombardeio: a imaginação soltará as suas “bombas de fumaça” e não nos deixará fixar a alma em Deus."}, {"t": "p", "x": "• A mortificação que purifica. São Josemaria compara a nossa alma a um «pássaro que ainda tem as asas empastadas de lama», e comenta que são necessários «muito calor do Céu [graça de Deus] e esforços pessoais pequenos e constantes [mortificações], para arrancar esse barro pegajoso das asas» (<em>Caminho<\/em>, n.991)."}, {"t": "p", "x": "Purificam-nos as mortificações que vão vencendo, pouco a pouco, a lama dos defeitos: a sensualidade, a impaciência, a preguiça, a irritabilidade, a vontade de ficar mais tempo na televisão ou na cama, a desordem, a bagunça material, o mau humor, a passividade perante os problemas dos outros... «Urge que os cristãos – diz o mesmo santo – se convençam desta realidade: não caminhamos junto do Senhor quando não sabemos privar-nos espontaneamente de tantas coisas que o capricho, a vaidade, a vida cômoda, o interesse nos reclamam» (<em>Amigos de Deus<\/em>, n. 129)."}, {"t": "p", "x": "E também os sacrifícios que oferecemos a Deus como penitência, para reparar pelos nossos pecados: mais um tempo de oração de joelhos, um pequeno jejum, a visita a uma igreja em dia de semana...; e as dores e doenças físicas, os padecimentos morais, as frustrações que nos fazem sofrer... “Tudo isso para ti, Senhor, unido à tua Cruz, para purificar a minha alma pecadora”."}, {"t": "p", "x": "• Finalmente, as mortificações necessárias para cumprir a Vontade de Deus. A própria oração nos faz ver, quase sempre, o que Deus quer de nós. Para lhe dizer “sim”, teremos que dizer “não” a algum gosto, plano ou comodismo pessoal."}, {"t": "p", "x": "Por exemplo: para não deixar de ir à Missa aos domingos; ou para participar de um apostolado ou de um trabalho social em favor dos necessitados; ou para ficar em casa à disposição dos que precisam do nosso serviço, renunciando a outros planos mais “gostosos”. São coisas que Deus nos pede e as mortificações que elas exigem são as pontes por onde passa o amor."}], "footnote": null}, {"n": 8, "label": "Capítulo 8", "title": "A oração vocal", "items": [{"t": "h", "x": "Oração mental e oração vocal"}, {"t": "p", "x": "Quando você pensa em Deus e lhe diz coisas íntimas, só com o pensamento e os sentimentos do coração, está fazendo “oração mental”, como já sabe."}, {"t": "p", "x": "Quando você, na Missa, reza as orações litúrgicas (“Confesso a Deus todo-poderoso...”, “Glória a Deus nas alturas...”, “Cordeiro de Deus...”); quando reza o Terço; quando reza o Pai-nosso e a Ave Maria, está fazendo “oração vocal”, mesmo que a faça em silêncio."}, {"t": "p", "x": "Jesus amava e praticava esses dois tipos de oração, e nos ensinou a amá-los e a praticá-los. Basta lembrar o seguinte:"}, {"t": "p", "x": "• Com muita frequência, Jesus passava horas – às vezes a noite inteira – conversando a sós com Deus Pai (Lc 6,12), fazendo “oração mental”."}, {"t": "p", "x": "2) Mas fazia também “oração vocal”: rezava os salmos e as orações tradicionais judaicas, quando participava no culto da sinagoga (Mc 6,2) ou nas festas no Templo (Jo 7,1 ss.); e seguia todo o cerimonial litúrgico e as preces e cânticos prescritos, na celebração da Páscoa judaica (Mt 26, 30)."}, {"t": "p", "x": "A nós, pede-nos que, como Ele, façamos “oração mental”: «Quando orares, entra no teu quarto, fecha a porta e ora a teu Pai em segredo» (Mt 6,6)."}, {"t": "p", "x": "E, ao mesmo tempo, pede-nos que estimemos muito a “oração vocal”. Ele próprio ensinou-nos a mais alta “oração vocal” que existe, o Pai-nosso (Mt 6,9-13), que milhões de cristãos vêm repetindo ao longo dos milênios. E já os primeiros cristãos aprenderam a amar a recitação dos Salmos (At 2,46 e 4,25-26), e a utilizar em suas orações trechos do Evangelho (cântico de Zacarias, Magnificat da Virgem, cântico de Simeão, etc.) e de outros livros da Bíblia."}, {"t": "h", "x": "Oração espontânea ou “fórmulas”?"}, {"t": "p", "x": "Nunca ouviu alguém dizer: “Eu não gosto de recitar fórmulas, eu gosto é de rezar espontaneamente, os pensamentos e os sentimentos devem sair do coração”?."}, {"t": "p", "x": "Há muitos que pensam assim. Mas, infelizmente, se esquecem de uma coisa. Do nosso coração sai só o que há realmente dentro dele (não o que não há), e nele ha coisas boas e coisas ruins. Pode até ser um coração extremamente “pobre”, vazio de luz e calor divinos e cheio de egoísmo gelado. E então, o que é que vai “sair” daí?"}, {"t": "p", "x": "Ora, as orações vocais enriquecem, porque “oferecem”, “colocam” dentro de nós tesouros de pensamentos, de verdades, de palavras, de sentimentos e desejos, que o nosso coração sozinho não possui nem saberia inventar. Bem rezadas, as orações vocais vão metendo tesouros na alma."}, {"t": "p", "x": "Santo Agostinho, por exemplo, recebeu um impulso decisivo para a sua conversão no dia em que se comoveu até as lágrimas, ao participar na basílica de Milão – onde era bispo Santo Ambrósio –, do canto dos Salmos e de hinos litúrgicos compostos por esse santo bispo, que o povo todo sabia de cor. As “orações vocais” fizeram com que a sua alma – alma de um homem extraordinariamente culto e inteligente – ficasse mais cheia de luzes espirituais; despertaram nele, com o auxílio de Deus, sentimentos, perspectivas, alegrias e esperanças que ele, sozinho, não teria sido capaz de conseguir."}, {"t": "p", "x": "Santa Teresa de Ávila conta de uma freira muito santa, que a vida inteira alimentou a sua conversa com Deus quase que exclusivamente com o Pai-nosso; e ela própria, Santa Teresa, escreveu um belo livro (<em>Caminho de perfeição<\/em>) em que dedica muitas páginas a comentar as essa oração vocal que o Senhor nos ensinou."}, {"t": "h", "x": "Dois perigos"}, {"t": "p", "x": "Como rezar bem as orações vocais? Há dois perigos que sempre nos ameaçam e que podem “acabar” com as nossas orações vocais:"}, {"t": "p", "x": "• O primeiro é o “perfeccionismo”, ou seja, a ideia de que, se não conseguimos colocar toda a consciência, atenção e sentimento em cada palavra, é melhor não rezar, seria como fazer “oração de papagaio”."}, {"t": "p", "x": "Os que pensam assim se esquecem de uma coisa importante: Jesus afirmou que, se não nos tornarmos simples como crianças, não entraremos no Reino de Deus (ver Mt 18,3). Ora, ninguém pede a uma criança uma atenção total nem uma perfeição de “doutor” na conversa. O que se lhe pede é carinho, amor, e esse existe mesmo que a criança se distraia – não o faz por mal –, e se esqueça de coisas que acabam de lhe dizer."}, {"t": "p", "x": "Como é bonito o que dizia São Josemaria Escrivá: «Sei que te distrais na oração. – Procura evitar as distrações, mas não te preocupes se, apesar de tudo, continuas distraído. – Não vês como, na vida natural, até as crianças mais sossegadas se entretêm e divertem com o que as rodeia, sem atender muitas vezes às palavras de seu pai? – Isso não implica falta de amor nem de respeito; é a miséria e a pequenez própria do filho. – Pois olha: tu és uma criança diante de Deus» (<em>Caminho<\/em>, n. 890)."}, {"t": "p", "x": "• O segundo perigo é o contrário: é a frieza, a rotina, o “calo” da alma. É isso o que fazem os que rezam mecanicamente, sem se esforçarem por prestar atenção ao que dizem, nem terem o desejo de melhorar. Esses, como dizia Santa Teresa de Ávila, não fazem oração, «por muito que mexam os lábios». «Esse falar às pressas, sem lugar para a reflexão – diz, citando-a, São Josemaria – é ruído, chacoalhar de latas» (<em>Caminho<\/em>, n. 85)."}, {"t": "h", "x": "O valor da boa vontade"}, {"t": "p", "x": "Acabamos de ver que o modo certo de praticar a oração vocal evita tanto o perfeccionismo como a rotina mecânica. Então, o que é que Deus nos pede?"}, {"t": "p", "x": "• Primeiro, <em>amor<\/em>: que saibamos esquecer-nos do nosso egoísmo, que se expressa em frases como as seguintes: “gosto, não gosto de rezar agora”; “tenho vontade, não tenho vontade”; “isso de rezar quando estou cansado é um fardo, não é comigo”."}, {"t": "p", "x": "Santa Teresinha, mesmo em períodos de grave cansaço e dores de cabeça, não se dispensava do esforço por colocar amor na oração vocal: «Algumas vezes – dizia –, quando o meu espírito se encontra numa secura tão grande que me é impossível formar um só pensamento para unir-me a Deus, rezo muito devagar o Pai-nosso e depois a Ave-Maria. Assim rezadas, estas orações encantam-me e alimentam a minha alma...»;"}, {"t": "p", "x": "• Segundo, <em>boa vontade<\/em>: rezar do melhor modo possível naquele momento, ainda que esse “melhor modo” seja bastante imperfeito. Pense que Deus não precisa das nossas obras “perfeitas” – pois Ele pode dar-se a Si mesmo infinitas obras perfeitas–, mas do nosso amor, desse amor (o “teu” e o “meu”), que só nós lhe podemos dar."}, {"t": "p", "x": "Façamos, portanto, o propósito de valorizar mais as orações vocais: as orações litúrgicas (Missa; para alguns, a Liturgia das Horas); as orações da manhã e da noite; as orações às refeições; o Terço; o Anjo do Senhor; outras devoções sérias aprovadas pela Igreja (ao Coração de Jesus, ao Espírito Santo; à Virgem, nossa Mãe, e aos anjos e santos, nossos intercessores diante do Senhor...)."}, {"t": "p", "x": "E não esqueça o que dizia Santo Afonso Maria de Ligório, e que eu vou repetir outras vezes, nestas reflexões: «Quem reza certamente se salva, quem não reza certamente se condena». O <em>Catecismo da Igreja Católica<\/em> assume essa afirmação no n. 2744."}], "footnote": null}, {"n": 9, "label": "Capítulo 9", "title": "A oração de súplica: pedir, por quê?", "items": [{"t": "h", "x": "Sabemos que precisamos pedir"}, {"t": "p", "x": "Você, como todos os cristãos, pede coisas a Deus, para si e para outros. Faz bem. Mais ainda, quando pede está fazendo uma coisa que Cristo deseja. Não lembra quantas vezes Ele nos mandou, de maneira até insistente, que fizéssemos oração de petição?"}, {"t": "p", "x": "Baste recordar, neste sentido, o Pai-nosso, com toda a sua sequência de pedidos (o pão de cada dia, o perdão das nossas ofensas, o socorro na tentação, a libertação do mal); e também as afirmações categóricas do Senhor sobre a importância de pedir, como: <em>Eu vos digo: pedi, e vos será dado; buscai, e achareis; batei, e vos abrirão<\/em> (Lc 11,9). <em>Pedi e recebereis, para que a vossa alegria seja completa <\/em>(Jo 16,24)."}, {"t": "p", "x": "Nós pedimos, e achamos lógico fazer assim, porque temos consciência de que precisamos da graça, das bênçãos e dos dons de Deus. Sobre isso não há a menor dúvida, pois <em>toda dádiva boa e todo dom perfeito<\/em> – como escreve São Tiago – vêm de cima: descem do Pai das luzes, no qual não há mudança nem mesmo aparência de instabilidade (Tg 1,17)."}, {"t": "h", "x": "Objeções à oração de petição"}, {"t": "p", "x": "Mas você sabe que, não poucas vezes, alguns bons cristãos dizem que não entendem por que devemos pedir. Todos cremos – comentam – que Deus é um Pai que nos ama e que, como diz Jesus, <em>sabe o que vos é necessário, antes mesmo que vós o peçais?<\/em> (Mt 6,8). Então, por que pedir – perguntam –, se Ele já sabe de antemão o que precisamos, e é bom, e é todo-poderoso e quer o nosso bem...?"}, {"t": "p", "x": "Além disso, acrescentam: Se, como diz São Tiago, em Deus <em>não há mudança nem instabilidade<\/em>, não será pretensão nossa esperar que “mude”, por causa da nossa oração, e nos conceda o que nós – e não Ele – desejamos? Não seria mais perfeito dizer simplesmente <em>Seja feita a vossa vontade<\/em>? E alguns concluem, então: Por isso eu não peço nada, só agradeço e me abandono em Deus? (atitude que, seja dito de passagem, também adotaram grandes santos, <em>durante algumas temporadas<\/em> – inspirados por Deus –, e só depois de terem feito e de fazerem depois uma intensa e contínua oração de petição)."}, {"t": "p", "x": "Tudo o que essas pessoas dizem sobre a bondade, o poder e a ciência de Deus é verdade, mas as conclusões que tiram não estão certas. Em todo o caso, não há duvida de que estão colocando um problema difícil: Como combinar essas verdades sobre a bondade e a ciência de Deus com o fato de que o próprio Deus mande pedir, e pedir sem cansaço: É necessário rezar sempre, sem esmorecer (Lc 18,1)?"}, {"t": "p", "x": "Seria absurdo achar que fomos nós, agora, os que “descobrimos” essa aparente contradição. Já foi descoberta faz muitos séculos pelos antigos cristãos, e os dois maiores teólogos católicos, Santo Agostinho e Santo Tomás de Aquino, estudaram a questão amplamente e chegaram a idênticas conclusões."}, {"t": "p", "x": "Como eles dizem (e eu apenas vou resumir), é verdade que nós não precisamos de rezar para “informar” Deus sobre as nossas necessidades, porque Ele já as conhece muito bem; e também é verdade que seria absurdo pretender “dobrar” Deus, fazendo com que mude” a sua vontade, e se deixe “dominar” pela nossa Então, por que devemos pedir? A resposta a isso é dupla, e cheia de sentido para quem tiver a perspectiva da fé., para a nossa vida prática, a fim de compreendermos que nunca devemos relegar a oração de petição para um segundo plano, antes devemos considerá-la sempre um necessidade espiritual básica, uma parte essencial da vida interior do cristão."}, {"t": "h", "x": "A dupla resposta"}, {"t": "p", "x": "• Por que devemos pedir?"}, {"t": "p", "x": "Seria suficiente esclarecer que devemos pedir porque Deus assim o manda. Lendo a Bíblia, não há dúvida de que Ele assim o quer."}, {"t": "p", "x": "Mas é lógico que nos perguntemos: Por que o quer? Pense numa coisa: Deus, doador de todas as graças, sabe infinitamente melhor do que nós qual é a melhor maneira de nos fazer chegar com proveito os seus dons. Por isso, a sabedoria divina – que muitas vezes não alcançamos a compreender – determinou que um dos grandes canais que deviam trazer-nos as graças do Céu fosse a oração de súplica (os outros canais são os Sacramentos e o mérito sobrenatural das obras boas, praticadas no amor de Deus)."}, {"t": "p", "x": "• Embora isso seja claro, pode vir à mente outra pergunta: Por que Deus escolheu precisamente esse canal da oração de súplica? Poderíamos responder: “Ele sabe das coisas muito melhor do que nós”. Está certo. Mas a Sagrada Escritura, através da qual Deus nos fala, traz luzes a esse respeito, que os santos souberam enxergar e que nós podemos também, pelo menos, vislumbrar."}, {"t": "p", "x": "Santo Tomás no seu <em>Compêndio de Teologia<\/em> (Liv. II, cap. 2) explica que, ao orar pedindo a Deus os seus dons, estamos reconhecendo com <em>humildade<\/em> as nossas limitações, as nossas necessidades e insuficiências, e nos voltamos para Deus, rezando <em>cheios de fé<\/em>, colocando só nEle a nossa esperança. Assim – diz o santo –, ao pedir, cultivamos as condições imprescindíveis para podermos alcançar os dons de Deus: a <em>humildade<\/em> e a <em>fé<\/em>. Esta é uma resposta baseada na Bíblia, na Palavra de Deus, pois ela nos ensina, constantemente, que só as virtudes da humildade e da fé deixam a alma preparada para receber os benefícios divinos. A humildade e a fé são como dois batentes necessários para que a porta do nosso coração se abra a Deus."}, {"t": "p", "x": "Só a título de amostra, vou lembrar-lhe alguns ensinamentos da Sagrada Escritura a esse respeito. São Pedro e São Tiago, por exemplo, citam uma frase do Antigo Testamento, do livro dos Provérbios (Prov 3,34), que querem gravar profundamente na alma dos primeiros cristãos: <em>Deus resiste aos orgulhosos, mas dá a sua graça aos humildes<\/em> (1Pedr 5,5; Tg 4,6). A necessidade da humildade, para receber a graça, fica claríssima. Pois bem, pedir é próprio dos humildes, só sendo humildes pediremos de coração."}, {"t": "p", "x": "Quanto à necessidade da fé, bastaria citar os inúmeros trechos dos Evangelhos em que Cristo faz depender da fé a concessão das graças: Ó mulher, grande é a tua fé! Seja-te feito como desejas, diz a uma pagã que pede insistentemente a cura da filha (Mt 15,28); e igualmente ao Centurião romano, que pede a cura de seu servo: <em>Vai, seja-te feito conforme a tua fé<\/em> (Mt 8,13). Pelo contrário, aos seus conterrâneos de Nazaré recrimina-lhes a falta de fé que os tornava fechados aos dons de Deus: <em>Por causa da falta de fé deles, operou ali poucos milagres<\/em> (Mt 13,58)."}, {"t": "p", "x": "Os primeiros cristãos acolhiam essas verdades sem a mínima dúvida. Neste sentido, é significativo que o texto mais antigo do Novo Testamento, a primeira Carta de São Paulo aos Tessalonicenses, termine dizendo, como algo óbvio e necessário: <em>Vivei sempre contentes. Orai sem cessar! <\/em>(1 Tes 5,16-17)."}, {"t": "p", "x": "Que conclusão vamos tirar, então, desta nossa reflexão? Penso que será a de rezar mais. Faz-nos muita falta. Mas é preciso pedir bem. É disso que vamos tratar com mais detalhe na próxima meditação."}], "footnote": null}, {"n": 10, "label": "Capítulo 10", "title": "A oração de súplica: o que devemos pedir?", "items": [{"t": "h", "x": "Saber pedir bem"}, {"t": "p", "x": "Quero repisar o que dizia na introdução: estas reflexões não são aulas de doutrina, mas conselhos práticos, embora procuremos que a doutrina esteja na base de tudo o que dizemos."}, {"t": "p", "x": "Digo-lhe isto porque não vamos meditar sobre todos os aspectos da oração de petição. Além do que já foi dito na palestra anterior, quero recordar-lhe apenas algumas qualidades que fazem com que oração de súplica seja boa..., pois poderia ser má."}, {"t": "p", "x": "São Tiago diz que, de fato, podemos pedir mal: <em>Não alcançais, porque não pedis. Pedis e não recebeis, porque pedis mal, com o fim de satisfazerdes as vossas paixões <\/em>(Tg 4, 2-3)."}, {"t": "h", "x": "O coração de todos os pedidos"}, {"t": "p", "x": "São Tiago afirma que reza mal quem pede a Deus que lhe satisfaça os desejos e ambições egoístas, que satisfaça as suas <em>paixões<\/em> (orgulho, avareza, inveja, ânsia de sucesso e glória, soluções cômodas, bênçãos para negócios pouco limpos, sensualidade, etc.). Não é cristão usar Deus como «ajudante», como «criado» a nosso serviço, pedindo- -lhe que nos conceda o que as nossas paixões egoístas almejam e que não é santo."}, {"t": "p", "x": "Jesus, quando fala da oração de petição, diz que, assim como um pai não vai dar uma pedra ao filho que lhe pede pão, nem uma cobra ao que lhe pede peixe, da mesma forma o <em>nosso Pai celeste dará coisas boas aos que lhe pedirem<\/em> (Mt 7,11)."}, {"t": "p", "x": "Que quer dizer com essa expressão, <em>coisas boas<\/em>? Ele mesmo o esclarece em outro lugar paralelo: <em>Se vós, sendo maus, sabeis dar boas coisas aos vossos filhos, quanto mais o vosso Pai celestial dará o Espírito Santo aos que lhe pedirem<\/em> (Lc 11,13)."}, {"t": "p", "x": "Quer dizer que o coração da nossa oração de petição, aquilo que “sempre” deve ser pedido a Deus (mesmo quando Lhe pedimos coisas materiais) é a graça do Espírito Santo, que nos santifica e nos faz capazes de viver e amar como filhos de Deus."}, {"t": "p", "x": "Para que foi que Cristo enviou o Espírito Santo, fruto da sua morte redentora na Cruz? Para nos tornar filhos de Deus, capazes de amar a Deus e ao próximo, com a força desse Amor em pessoa que é o Espírito Santo. O amor que <em>o Espírito Santo derrama nos nossos corações<\/em> (cf. Rm 5,5) – ensina São Paulo – é a essência da perfeição (Col 3,14).<em> <\/em>E é também o Espírito Santo quem nos leva<em> à verdade completa<\/em> sobre Deus, os homens, o mundo e seus problemas (Jo 16,13)."}, {"t": "h", "x": "Seja feita a vossa vontade"}, {"t": "p", "x": "Podemos, pois, pedir tudo o que seja honesto e bom, desde que esteja subordinado ao maior bem, que é a nossa santificação e a dos nossos irmãos."}, {"t": "p", "x": "Por isso, na entranha de toda a súplica dirigida a Deus, você – e eu, todos – deve colocar o pedido primordial: <em>Seja feita a vossa vontade, assim na terra como no Céu <\/em>(Mt 6,10). Muitos bons cristãos, pedem, e pedem muito – e, nisso, fazem muitíssimo bem –, mas sempre acrescentam: “Se isto for, Senhor, da vossa vontade”. Rezar assim é ótimo. Essa foi a oração de Cristo no Horto, a mais perfeita de todas as orações: <em>Abá (Pai!), afasta de mim este cálice; contudo, não se faça o que eu quero, mas o que tu queres <\/em>(Mc 14,38)."}, {"t": "p", "x": "Na realidade, como diz São Paulo, nós <em>não sabemos o que devemos pedir..., mas o Espírito mesmo intercede por nós com gemidos inefáveis<\/em> (Rm 8, 26). É uma maravilha! Podemos pedir a Deus, com simplicidade, tudo o que for honesto e bom: saúde física e espiritual; forças para enfrentar um problema determinado, e – se possível – que Deus afaste esse problema; o pão material, recursos para o sustento próprio e da família; o Pão espiritual; o bem da Igreja; a paz do mundo; o bem comum do país..."}, {"t": "p", "x": "Se fizermos esses pedidos como bons filhos de Deus, enquanto nós rezamos, o Espírito Santo, dentro do nosso coração, vai <em>intercedendo por nós<\/em>, fazendo com que o nosso pedido obtenha o resultado que mais nos convém (mesmo que, às vezes, seja o contrário do que pedimos explicitamente, como os pais que amam os filhos têm que recusar-lhes com frequência o que pedem, porque lhes faria mal)."}, {"t": "p", "x": "Não se esqueça, porém, de que, mesmo que Deus demore a responder de um ou outro jeito, mesmo que pareça que não nos escuta, há muitas graças divinas que estão vinculadas à nossa oração. Quem reza, sempre recebe! (<em>Pedi e recebereis<\/em>). Ai de nós, se não rezamos! Aquele que não reza, pode frustrar o plano de Deus a seu respeito (cf. Lc 7,30). Mais uma vez convirá lembrar a frase famosa de Santo Afonso: «Quem reza certamente se salva, quem não reza certamente se condena»."}, {"t": "h", "x": "Rezar uns pelos outros"}, {"t": "p", "x": "Nesta reflexão, queria ainda lembrar-lhe, mesmo que seja brevemente, a grande importância que tem a oração de petição pelos outros. O Senhor nos vê como filhos que constituem a <em>família de Deus<\/em> (Ef 2,19), família que deve estar unida e solidária como o estavam entre si os primeiros cristãos, de quem dizem os Atos dos Apóstolos: <em>Unidos de coração, frequentavam todos os dias o templo... Perseveravam...na oração<\/em> (cf. At 2,42.46)."}, {"t": "p", "x": "Espiritualmente, mais ainda do que materialmente, uns dependemos dos outros. Formamos um só corpo, o Corpo Místico de Cristo; e, como diz ainda São Paulo, <em>o olho não pode dizer à mão: eu não preciso de ti<\/em> (1 Cor, 12,21). Todos precisamos de todos. Todos temos que apoiar-nos na oração dos outros. Os outros devem poder apoiar-se na nossa oração. A Igreja viveu isso intensamente desde o começo."}, {"t": "p", "x": "Após a primeira prisão de Pedro, por exemplo, todos os “irmãos” rezavam unanimemente: <em>Agora, Senhor, olhai para as suas ameaças e concedei aos vossos servos que, com todo desassombro, anunciem a vossa Palavra<\/em> (At 4,29). Da mesma forma, São Paulo, que em todas as suas cartas pede orações, escrevia aos romanos: <em>Combatei comigo, dirigindo vossas orações a Deus por mim<\/em> (Rm 15,30)."}, {"t": "p", "x": "Mais ainda, além de rezarmos pelos outros cristãos, membros do Corpo Místico de Cristo, é preciso rezar muito também pelos que não conhecem ou conhecem mal a Deus, pelos que o combatem ( cf. At 7,60; Rm 12,14, etc.), e até mesmo pelos que se empenham em ser os nossos “inimigos”, nos odeiam e nos perseguem (Mt 5,44)."}, {"t": "p", "x": "Para terminar, queria lembrar-lhe uma consideração que fazia São Josemaria. Dizia que muitas coisas no mundo não andam bem «porque poucos rezam; e os que rezam, rezam pouco». Deus faça que nós não estejamos entre esses “rezadores anêmicos”."}], "footnote": null}, {"n": 11, "label": "Capítulo 11", "title": "Como meditar o Evangelho: a lectio divina", "items": [{"t": "h", "x": "Beber das fontes de Cristo"}, {"t": "p", "x": "Um dia em que Jesus se encontrava em Jerusalém, participando da grande festa dos Tabernáculos, <em>estando de pé, exclamou: “Se alguém tiver sede, venha a mim e beba. Quem crê em mim..., do seu interior jorrarão rios de água viva”<\/em> (Jo 7, 37-38)."}, {"t": "p", "x": "São palavras que lembram uma antiga profecia de Isaías: <em>tirareis água com alegria das fontes da salvação <\/em>(Is 12,3)."}, {"t": "p", "x": "O próprio Evangelho explica que essas “águas” significam o Espírito Santo <em>que haviam de receber os que cressem nele<\/em> (Jo 7,39). O Espírito Santo, que inundava a alma de Cristo, é a luz, o amor, a força que Jesus envia aos corações dos fiéis."}, {"t": "p", "x": "Há muitas “fontes de água viva” (cf. Jo 4,10) que brotam da Redenção realizada por Jesus: os sete Sacramentos, a oração cristã, a união com Deus pelos atos de amor, de caridade... Hoje, na nossa reflexão, vamos olhar apenas uma delas: a <em>lectio divina<\/em>, a meditação da Bíblia, e concretamente a meditação do Santo Evangelho, cume e síntese de toda a Palavra de Deus."}, {"t": "h", "x": "As quatro fontes"}, {"t": "p", "x": "Você conhece bem o rio de águas vivas que é o Evangelho? Um único rio formado por quatro fontes: os Evangelhos escritos por São Mateus, São Marcos, São Lucas e São João. Encontra-os facilmente em qualquer boa edição da Bíblia completa, ou do Novo Testamento, que é a parte cristã da Bíblia."}, {"t": "p", "x": "E que águas vivas encontramos nos Evangelhos? Eles narram – de modo simples e tocante – a vida de Jesus, o Filho de Deus feito Homem, e nos transmitem a riqueza inesgotável dos seus exemplos e das suas palavras, dos seus ensinamentos (ver Jo 21,25)."}, {"t": "p", "x": "Os apóstolos chamavam a Jesus “mestre” (<em>rabí<\/em>), mas ele não é apenas um grande mestre, o maior mestre humano. Jesus é Deus, é o Verbo (a Palavra), o Filho de Deus, a segunda pessoa da Santíssima Trindade, que se fez homem no seio da Virgem Maria."}, {"t": "p", "x": "Lembremos o que nos diz São João: <em>O Verbo era Deus... Nele havia a vida, e a vida é a luz dos homens... O Verbo se fez carne e habitou entre nós...<\/em> (cf. Jo 1, 1 ss.). <em>Era a verdadeira luz que, vindo ao mundo, ilumina todo homem <\/em>(Jo 1,9)."}, {"t": "p", "x": "Esta “luz” e esta “vida” são os tesouros as que nós encontramos nos quatro Evangelhos (e em todo o Novo Testamento, que é, todo ele, uma irradiação da luz do Evangelho). Como achamos esses tesouros?"}, {"t": "p", "x": "• “Vendo” neles Jesus, pois os Evangelhos nos mostram um “retrato” de Cristo. Ao apóstolo Filipe, que na Última Ceia pediu a Cristo que lhes mostrasse Deus Pai, o Senhor respondeu: <em>Há tanto tempo que estou convosco, e ainda não me conheces? Aquele que me viu, viu também o Pai<\/em> (Jo 15,9)."}, {"t": "p", "x": "Será que Jesus não nos poderia dizer a mesma coisa? Você já procurou “enxergar” no Evangelho a Cristo, Deus feito homem, que é a imagem visível de Deus invisível e que, por isso, nos dá a luz divina para todas as coisas da vida? (Cf. Jo 1, 14; Jo 8,12 e Col 1,15)."}, {"t": "p", "x": "• “Ouvindo” (isto é, lendo e meditando) os “ensinamentos” de Jesus no Evangelho. Ao ler o Evangelho escutamos o próprio Cristo: palavras que, saindo dos seus lábios, Ele dirige pessoalmente a cada um de nós. <em>As minhas palavras são vida<\/em> (Jo 6,64). Se as “ouvirmos”, se as acolhermos, a nossa vida mudará."}, {"t": "p", "x": "Num momento de crise, em que muitos abandonaram Cristo, Jesus perguntou aos Apóstolos: <em>Quereis vós também retirar-vos<\/em>? Pedro tomou a palavra e disse o que o nosso coração deveria estar dizendo continuamente a Jesus: <em>Senhor, a quem iríamos nós? Só tu tens palavras de vida eterna!<\/em> (Jo 6, 67-68)."}, {"t": "h", "x": "A vida que nasce das fontes"}, {"t": "p", "x": "Convença-se de que a nossa vida precisa, mais do que do ar que respiramos, das palavras de Jesus (e de seus exemplos, que são também “palavras”). Só elas nos fazem viver de verdade, só elas nos ajudam a transformar em “vida autêntica”, eterna, cada instante da nossa existência:"}, {"t": "p", "x": "• Se tivermos dúvidas sobre o que fazer, sobre as soluções a adotar na vida, Jesus nos dirá: <em>Eu sou o Caminho <\/em>(Jo 14,6). E, aprendendo a meditar o Evangelho, não demoraremos muito a ganhar facilidade para captar – com a ajuda do Espírito Santo – a resposta que Jesus nos quer dar para aquele caso concreto: “Segue este caminho, faze isso e não aquilo”."}, {"t": "p", "x": "• Se duvidarmos sobre a verdade, neste mundo de ideias confusas e interpretações conflitantes, Jesus nos dirá: <em>Eu sou a Verdade<\/em> (Id.), e, ao meditarmos sobre o Evangelho, fará brilhar na nossa alma a luz nítida da Verdade que Ele transmitiu à sua Igreja e que, através dela, faz brilhar sobre cada um de nós."}, {"t": "p", "x": "• Se sentirmos a vida vazia, se perdermos o sentido da nossa existência, se acharmos que tudo nos desencanta, que tudo se desgasta, que tudo murcha, Jesus nos dirá: <em>Eu sou a Vida<\/em> (Id.), e, ao meditarmos o Evangelho, Ele nos fará ver panoramas de renovação de vida, ideais novos, possibilidades belíssimas até então insuspeitadas. E saborearemos a promessa de Jesus: <em>Eu vim para que tenham vida, e atenham em abundância<\/em> (Cf. Jo 10,10)."}, {"t": "p", "x": "Terminemos aqui estas considerações introdutórias, que são uma primeira reflexão sobre “como meditar o Evangelho”."}], "footnote": null}, {"n": 12, "label": "Capítulo 12", "title": "Como meditar o Evangelho: os primeiros passos", "items": [{"t": "p", "x": "Como início do comentário sobre maneiras práticas de aproveitar a leitura do Evangelho, será bom lembrar que as pessoas que estão dando os primeiros passos – iniciando-se na vida espiritual –, podem encontrar-se em duas situações:"}, {"t": "p", "x": "• Serem pessoas que, mesmo tendo sido batizadas, nunca leram os Evangelhos (a não ser de modo muito esporádico e fragmentário) e não conhecem quase nada da vida de Jesus: não saberiam contá-la aos outros (por exemplo, aos filhos);"}, {"t": "p", "x": "• Pessoas que conhecem a vida de Cristo e já leram os quatro Evangelhos ou boa parte deles – talvez na escola, ou na preparação para a primeira Comunhão e para a Crisma –, mas que depois abandonaram a prática cristã ou passaram a vivê-la por mero hábito e rotina e, por isso, esqueceram-se de muitas coisas, e bem pouco aprofundaram."}, {"t": "h", "x": "Os primeiros passos"}, {"t": "p", "x": "Se você se encontra no primeiro caso, ou seja, se tem de partir quase (ou sem quase) da estaca zero, penso que podem ser úteis os seguintes conselhos:"}, {"t": "p", "x": "• Em primeiro lugar, compre (se não o tem) um exemplar de uma edição correta da Bíblia ou do Novo Testamento (aconselhando-se antes), de preferência uma edição que contenha introduções a cada Evangelho e notas explicativas. Essas notas, em geral, costumam ser breves, mas quase sempre ajudam: por exemplo, as das edições da Bíblia da CNBB, da editora Ave Maria, da Bíblia de Jerusalém (Ed. Paulinas), da Bíblia de Aparecida, da Difusora Bíblica portuguesa, da Liga dos Estudos Bíblicos (Ed. Loyola)."}, {"t": "p", "x": "Se desejar explicações e notas extensas de grande valor, você poderá encontrá-las no volume “Os Evangelhos” da Bíblia de Navarra, traduzida ao português e publicado pelas Edições Theologica de Braga (Portugal)."}, {"t": "p", "x": "• Em segundo lugar, como já lhe recomendava ao falar da meditação em geral, reserve todos os dias um horário e um lugar bem definidos, e dedique, pelo menos, uns cinco ou dez minutos à leitura pausada e meditada do Evangelho."}, {"t": "p", "x": "• Em terceiro lugar (em bastantes casos, isto deveria estar “em primeiro lugar”), procure adquirir e ler uma boa “Vida de Cristo”, que muitas vezes precisará ser o “primeiro passo” necessário para você entender melhor os Evangelhos. Eu costumo recomendar a “Vida de Jesus” de Justo Pérez de Urbel, publicada no Brasil pela Ed. Quadrante. Parece-me muito adequada, pela sua clareza, pelo estilo ameno e pelo caráter didático, mas isso é apenas uma sugestão pessoal: em matéria de preferências, só lhe posso dizer “eu gostei, para mim foi útil”."}, {"t": "p", "x": "• Em quarto lugar (embora essa ordem não seja matematicamente rigorosa!), leia completos, em sequência, do começo ao fim, cada um dos Evangelhos – não abrindo-os ao acaso nem dando só “bicadinhas”–, e siga a ordem em que eles se encontram na Bíblia: Mateus, Marcos, Lucas e João. E, uma vez terminado o ciclo completo, repita-o várias vezes, do primeiro capítulo de Mateus ao último de João (isso pode levar anos, o que é bom; muitos seguem com proveito esse sistema a vida inteira). Embora não esteja falando dos outros livros do Novo Testamento (Atos dos Apóstolos, Cartas de São Paulo, etc.), quase tudo quanto aqui dizemos pode aplicar-se também à leitura desses outros livros sagrados."}, {"t": "p", "x": "• Em quinto lugar, procure ler tendo uma agenda ou caderninho ao lado, e vá anotando aí a referência aos trechos que quer gravar melhor, e aos que não compreendeu, para meditá-los outro dia ou para poder consultar a alguém competente que possa esclarecê-lo."}, {"t": "p", "x": "Como provavelmente já sabe, os livros da Bíblia publicam-se divididos em “capítulos” e “versículos” e, para anotá-los e citá-los, utilizam-se abreviações, que as próprias edições da Bíblia explicam; assim, por exemplo, a citação Mc 7,24 significa: Evangelho de São Marcos, capítulo 7, versículo 24; e a referência Jo 6,66-71 significa: Evangelho de São João, capítulo 6, versículos 66 a 71."}, {"t": "p", "x": "• Em sexto lugar, não se obrigue a ler uma quantidade determinada de páginas ou de frases, de versículos, por dia. O importante é ler devagar, assimilar e tirar proveito. Assim, um dia pode ficar dez minutos lendo, relendo e meditando só dois versículos (veja, por ex., Jo, 13,34-35), e outro dia pode precisar de ler várias páginas (por ex., Lc 2,1-20)."}, {"t": "p", "x": "• Em sétimo lugar, não “encalhe” nos trechos difíceis ou “desconcertantes”, não fique gastando tempo tentando decifrá-los, mas passe para os seguintes (anote os difíceis, como dizia acima, e peça esclarecimentos a quem conheça melhor a Bíblia). Pelo contrário, pare, medite, releia e saboreie com vagar os trechos que mais lhe atinjam a inteligência e o coração, aqueles que lhe fazem pensar: “Como é claro, agora entendo!”, “Que maravilha”!..;"}, {"t": "p", "x": "• Com a leitura bem feita, e pedindo luz ao Espírito Santo, pouco a pouco perceberá que se acende em você o amor a Cristo, um amor que chegará a ser entusiasmo. Depois, esse amor despertará a uma grande fome de conhecê-lo melhor, e soprará sobre a chamazinha inicial, que se tornará cada vez maior."}, {"t": "p", "x": "Com o Evangelho acontece como com uma magnífica paisagem que amanheceu coberta de neblina; primeiro, nada se enxerga; aos poucos, o sol vai dissipando a cerração: começam a ver-se alguns perfis de árvores, casas e montanhas, ainda sob uma luz confusa; mas, horas depois, tudo vai ficando claro, até que, a pleno sol, a paisagem se mostra com um deslumbramento de beleza e esplendor."}], "footnote": null}, {"n": 13, "label": "Capítulo 13", "title": "Como meditar o Evangelho: os segundos passos", "items": [{"t": "h", "x": "Os “segundos passos”"}, {"t": "p", "x": "A maior parte dos conselhos do capítulo anterior sobre os “primeiros passos” também podem ser úteis para os que querem dar os “segundos passos”, ou seja, para os que já conhecem os Evangelhos, mas nunca se aprofundaram neles."}, {"t": "p", "x": "Como é que se nota que já estamos dando os “segundos passos”? Eu diria que se percebe em duas coisas: no “espelho” e no “farol”. Bem. Isso precisa de uma explicação, que vamos ver a seguir."}, {"t": "h", "x": "O “espelho”"}, {"t": "p", "x": "Tudo vai bem quando meditamos o Evangelho com tanto interesse e atenção, que –com a ajuda do Espírito Santo – começamos a ver-nos retratados nele, como num espelho (Lembra-se que já usamos antes essa imagem?). O que Jesus diz e faz é como o fundo de um espelho, que nos ajuda a enxergar claramente, por contraste, as nossas falhas e o que nós deveríamos fazer."}, {"t": "p", "x": "Assim, por exemplo, quando lemos as seguintes palavras: «Não julgueis e não sereis julgados; não condeneis e não sereis condenados; perdoai e sereis perdoados», percebemos duas coisas:"}, {"t": "p", "x": "• Jesus vivia assim: não julgava nem condenava, mas compreendia, ajudava, corrigia com carinho e perdoava (leia, por ex. Lc 7,36-50; Jo 8,1-11; Mt 9, 10-13; Lc 15,1-32)."}, {"t": "p", "x": "• E eu? Eu sei compreender os outros? Faço facilmente maus juízos? Caio logo na crítica interior e na suspeita? Procuro perdoar quanto antes os que me ofendem?"}, {"t": "p", "x": "As conclusões vêm facilmente ao coração e à cabeça: “Jesus, perdoa-me tantos maus juízos e críticas! Jesus, ajuda-me a ver primeiro, como Tu, o lado bom das pessoas!”"}, {"t": "p", "x": "Outro exemplo. Imagine que lemos estas palavras de Jesus: «Guardai-vos de fazer as vossas boas obras diante dos homens, para serdes vistos por eles» (Mt 6,1), e logo percebemos que:"}, {"t": "p", "x": "• Jesus fazia assim, não era vaidoso. Tudo fazia pelo bem dos outros, e detestava o exibicionismo. Por isso, mesmo depois de ter feito milagres, pedia: <em>Vê que não o digas a ninguém<\/em> (Mc 1,44). E, na Paixão não andou proclamando que Ele era Deus, nem que sofria horrivelmente. Aceitou ser ignorado e desprezado."}, {"t": "p", "x": "• E nós? Agimos da mesma forma quando estamos a sós ou apenas com a família que quando estamos na vida social, ou seja, quando outros nos veem e queremos ficar bem, fazer boa figura a seus olhos? Sabemos fazer o que é certo porque Deus assim o quer, mesmo que os outros nem reparem, nem fiquem sabendo nunca e, portanto, não possam agradecer-nos?"}, {"t": "p", "x": "Com isso percebemos que há muita vaidade na nossa vida, excessiva preocupação com a nossa imagem. E então pedimos: “Jesus, perdoa a minha falta de humildade. Ajuda-me a ter intenção reta e a fazer as coisas bem feitas só porque são certas, porque são as coisas que Tu me pedes e a minha consciência me indica que são o meu dever”."}, {"t": "h", "x": "O “farol”"}, {"t": "p", "x": "Outro sinal de que estamos já nestes “segundos passos” acende-se quando a meditação do Evangelho, além de ser um espelho que ressalta as nossas falhas, é um farol que nos mostra os caminhos do amor cristão e nos incentiva a segui-los, com o desejo de progredir cada vez mais."}, {"t": "p", "x": "Você lê, por exemplo, a cena do lava-pés na Última Ceia (Jo 13, 2-17), e vê Jesus humilde, aos pés dos Apóstolos, prestando-lhes um serviço próprio de escravos, e dizendo-lhes depois: <em>Eu vos dei exemplo para que, assim como eu vos fiz, assim façais vós também. Se compreenderdes essas coisas, sereis felizes se as praticardes<\/em>."}, {"t": "p", "x": "Pode ser que, ao lermos essa cena do lava-pés, nos venha à memória aquele trecho paralelo do Evangelho em que Jesus nos pede: <em>O que quiser ser entre vós o primeiro, faça-se vosso servidor<\/em>, e em que declara ao mesmo tempo que Ele <em>veio ao mundo não para ser servido, mas para servir e dar a sua vida para redenção de muitos<\/em> (Mt 20,27-28)."}, {"t": "p", "x": "Por pouco que meditemos isso

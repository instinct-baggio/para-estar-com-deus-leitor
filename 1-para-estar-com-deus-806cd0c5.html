 tudo, o nosso coração, primeiro, se envergonhará e, depois, arderá em desejos de ter mais generosidade: “Meu Deus, como fui egoísta até agora! Tenho estado quase sempre voltado para mim, para os meus interesses, para os meus gostos, para o que quero quer os outros me deem... Eu te peço, por favor, que me dês um coração como o de teu Filho Jesus, generoso, aberto aos demais, pronto para ajudar, disposto a ser útil, material e espiritualmente, aos demais”."}, {"t": "h", "x": "Como num filme"}, {"t": "p", "x": "São Josemaria Escrivá, que ensinou inúmeras almas a amar e meditar o Evangelho, dizia: «Não basta ter uma ideia geral do espírito de Jesus, mas é preciso aprender dEle pormenores e atitudes»."}, {"t": "p", "x": "E, para isso, dava o seguinte conselho: «Quando amamos uma pessoa, desejamos conhecer até os menores detalhes da sua existência. É por isso que temos que meditar a história de Cristo, porque é preciso que a conheçamos bem, que a tenhamos toda inteira na cabeça e no coração, de modo que, em qualquer momento, sem necessidade de livro algum, fechando os olhos, possamos contemplá-la como num filme, de forma que, nas mais diversas situações da nossa existência, acudam à memória as palavras e os atos do Senhor» (É Cristo que passa, n. 107)."}, {"t": "p", "x": "Isso é possível? Sim! Desde que nos decidamos a ler e meditar diariamente os Santos Evangelhos, e peçamos luz ao Espírito Santo para compreendê-los."}], "footnote": null}, {"n": 14, "label": "Capítulo 14", "title": "Como meditar o Evangelho: o terceiro passo", "items": [{"t": "h", "x": "O “terceiro passo”"}, {"t": "p", "x": "Quem já achou no Evangelho o “espelho” do exemplo de Jesus, e achou também o “farol” que ilumina os caminhos da vida, não fica satisfeito com isso, tem fome de aprofundar cada vez mais no conhecimento e no amor de Jesus. E é aí que sente a necessidade de dar um “terceiro passo”."}, {"t": "p", "x": "Em que consiste esse novo passo? Consiste na “contemplação” de Jesus Cristo, que tem, entre outras, estas manifestações:"}, {"t": "p", "x": "• Ânsia cada vez maior de olhar sem cansaço e de aprofundar com amor cada vez maior na figura, no coração de Jesus. Isso era o que fazia, lá na sua casa de Betânia, Maria, a irmã de Marta, sentada aos pés de Nosso Senhor, sem se cansar de olhá-lo e de ouvi-lo (Lc 10,38-42)."}, {"t": "p", "x": "• Desejo de meditar as passagens do Evangelho, “vivendo-as”, não como coisa do passado, mas como realidades atuais. “Viver”, por exemplo, o nascimento de Cristo, a sua pregação e os seus milagres, o carinho de seus Apóstolos e amigos, a Paixão e a Morte, a alegria da Ressurreição..."}, {"t": "p", "x": "Veja o que diz a esse respeito o <em>Catecismo da Igreja Católica<\/em>: «A contemplação é o “olhar” de fé fito em Jesus, “Eu olho para Ele e Ele olha para mim”, dizia o camponês de Ars, em oração diante do Sacrário» (n. 2715). «Tudo o que Cristo é, tudo o que fez e sofreu por todos os homens participa da eternidade divina, e por isso abraça todos os tempos e em todos se torna “presente”» (n. 1085)."}, {"t": "p", "x": "Quer dizer que, de uma maneira não visível mas real, Jesus nasce “agora”, vive “agora”, dá a vida por mim “agora”..., uma vez que todos os mistérios da sua vida estão ligados para sempre à sua presença real na Eucaristia: à Santa Missa de cada dia e ao sacrário."}, {"t": "p", "x": "• Fome de falar com Jesus vivo, de lhe dizer que o amamos, de agradecer-lhe tudo, de desabafar e chorar reclinados no seu Coração, de pedir-Lhe coisas com confiança, de “consolá-lo”, de tê-lo como companheiro, tal como os discípulos de Emaús (Lc 24, 13 ss.)."}, {"t": "h", "x": "Como mais um personagem"}, {"t": "p", "x": "Todos os santos “contemplaram” assim o Evangelho. Nos nossos dias, um guia experiente para essa contemplação é São Josemaria Escrivá. Veja como nos ensina a ser contemplativos (falo apenas do que ele comenta sobre a leitura e meditação do Evangelho, pois também ensinava a ser contemplativos durante o dia inteiro)."}, {"t": "p", "x": "«Misturai-vos com frequência – dizia – entre os personagens do Novo Testamento. Saboreai aquelas cenas comoventes em que o Mestre, Jesus, atua com gestos divinos e humanos, ou relata com modos de dizer humanos e divinos a história sublime do perdão, do Amor ininterrupto que tem pelos seus filhos» (<em>Amigos de Deus<\/em>, n. 216)."}, {"t": "p", "x": "«O meu conselho – acrescentava – é que, na oração, cada um intervenha nas passagens do Evangelho como mais um personagem. Primeiro, imaginamos a cena ou mistério, que servirá para nos recolhermos e meditar. Depois empregamos o entendimento para considerar este ou aquele traço da vida do Mestre: seu Coração enternecido, sua humildade, sua pureza, seu cumprimento da Vontade do Pai. Depois, contamos-lhe o que nos costuma acontecer nessas matérias, o que sentimos, o que nos está acontecendo. É preciso permanecermos atentos, porque talvez Ele nos queira indicar alguma coisa: e surgirão essas moções interiores, o cair em si, essas reconvenções» (<em>Ibidem<\/em>, n. 253)."}, {"t": "h", "x": "Exemplos vivos"}, {"t": "p", "x": "Quer ver alguns exemplos vivos da forma em que São Josemaria praticava essa contemplação? Vou dar-lhe apenas três:"}, {"t": "p", "x": "• Meditação do Natal. Metia-se na gruta de Belém e contemplava, pasmado, Jesus recém-nascido, com Maria e José. Então fazia-se criança e “introduzia-se” dentro da cena. Aproximava-se de José, puxava-lhe da manga e lhe pedia que o deixasse pegar nos braços o Menino Jesus: «Que bom é José! Trata-me como um pai a seu filho. Até me perdoa, se tomo o Menino em meus braços e fico, horas e horas, dizendo-lhe coisas doces e ardentes! E beijo-O, e O embalo, e canto para Ele, e lhe chamo Rei, Amor, meu Deus, meu único, meu Tudo! (<em>Santo Rosário<\/em>, 3º mistério de Gozo)»."}, {"t": "p", "x": "• A Paixão de Jesus. Acompanhava Jesus, passo a passo, pela Via dolorosa, bem pertinho de Maria e de João. E, quando via, por exemplo, Jesus cair pela terceira vez sob o peso da Cruz, rasgava o coração: «Meu Deus! Que eu odeie o pecado e me una a Ti, abraçando-me à Santa Cruz para cumprir por minha vez a tua Vontade amabilíssima...» (<em>Via Sacra<\/em>, 9ª Estação)."}, {"t": "p", "x": "• A Ressurreição. Imaginava-se criança e unia-se à alegria de Nossa Senhora, dos Apóstolos, das Santas mulheres, quando Jesus lhes apareceu ressuscitado. E incentivava os que o ouviam ou liam seus escritos a participar da cena juntamente com ele, com palavras como estas: «Apareceu a sua Mãe Santíssima. Apareceu a Maria de Magdala, que está louca de amor. E a Pedro e aos demais Apóstolos. E a ti e a mim, que somos seus discípulos e mais loucos que Madalena. Que coisas lhe dissemos! Que nunca morramos pelo pecado; que seja eterna a nossa ressurreição espiritual. E, antes de terminar..., beijaste as chagas dos seus pés..., e eu, mais atrevido – por ser mais criança –, pus os meus lábios no seu lado aberto (<em>Santo Rosário<\/em>, 1º mistério de Glória)»."}, {"t": "h", "x": "Umas palavras de Bento XVI"}, {"t": "p", "x": "Esses conselhos e experiências de São Josemaria estão em sintonia plena com a grande Tradição da Igreja sobre a <em>lectio divina<\/em>, que vem dos primeiros séculos e chega ininterruptamente até hoje."}, {"t": "p", "x": "Podemos verificá-lo lendo a Exortação Apostólica <em>Verbum Domini<\/em>, de 2010, onde o Papa Bento XVI faz um apelo aos fiéis católicos para que pratiquem hoje a <em>lectio divina<\/em>, ao mesmo tempo que a explica com estas palavras:"}, {"t": "p", "x": "«Começa com a leitura (<em>lectio<\/em>) do texto, que suscita a interrogação sobre um autêntico conhecimento do seu conteúdo: <em>o que diz o texto bíblico em si<\/em>?"}, {"t": "p", "x": "»Segue-se depois a meditação (<em>meditatio<\/em>), durante a qual nos perguntamos: <em>que nos diz o texto bíblico<\/em>? Aqui cada um, pessoalmente mas também como realidade comunitária, deve deixar-se sensibilizar e pôr em questão, porque não se trata de considerar palavras pronunciadas no passado, mas no presente."}, {"t": "p", "x": "»Sucessivamente chega-se ao momento da oração (<em>oratio<\/em>), que supõe a pergunta: <em>que dizemos ao Senhor, em resposta à sua Palavra<\/em>? A oração enquanto pedido, intercessão, ação de graças e louvor é o primeiro modo como a Palavra nos transforma."}, {"t": "p", "x": "»Finalmente, a <em>lectio divina<\/em> conclui-se com a contemplação (<em>contemplatio<\/em>), durante a qual assumimos como dom de Deus o seu próprio olhar, ao julgar a realidade, e interrogamo-nos: <em>qual é a conversão da mente, do coração e da vida que o Senhor nos pede<\/em>?"}, {"t": "p", "x": "»Há que recordar ainda que a <em>lectio divina<\/em> não está concluída, na sua dinâmica, enquanto não chegar à ação (<em>actio<\/em>), que impele a existência do fiel a doar-se aos outros na caridade» (Cf. <em>Verbum Domini<\/em>, n. 87)."}, {"t": "p", "x": "Ao chegarmos a este ponto, talvez sintamos que nos falta muito para dar esse “terceiro passo”. Não desanimemos. Aproximemo-nos de Nossa Senhora e peçamos-lhe que, como boa Mãe, nos ensine a contemplar e a viver com Ela as maravilhas da vida de seu Filho."}], "footnote": null}, {"n": 15, "label": "Capítulo 15", "title": "O exame de consciência", "items": [{"t": "h", "x": "Vigiar e orar"}, {"t": "p", "x": "Você se lembra de que, no Horto da Oliveiras, quando Jesus fez um intervalo na sua oração e foi ver se os Apóstolos o acompanhavam, achou-os dormindo. Com pena, disse a Pedro: <em>Não pudeste vigiar uma hora comigo? <\/em>E a todos: <em>Vigiai e orai, para não entrardes em tentação<\/em> (Mt 26,40-41)?"}, {"t": "p", "x": "Uma das melhores maneiras de “vigiar”, como Jesus nos pede, é fazer todos os dias o <em>exame de consciência<\/em>: um balanço do nosso dia diante de Deus, cheio de sinceridade, que se pode resumir nas três perguntas que São Josemaria às vezes aconselhava: «O que fiz bem? O que fiz mal? O que poderia fazer melhor amanhã?»."}, {"t": "p", "x": "Talvez você me diga: “Eu já tentei fazer esse exame, mas é complicado. Não sei por onde começar e, além disso, à noite estou cansado e não consigo pensar”."}, {"t": "p", "x": "Tem razão. Não é fácil. Por isso, talvez possam ajudá- -lo algumas sugestões práticas. Vamos ver."}, {"t": "h", "x": "Algumas sugestões"}, {"t": "p", "x": "• Para começar, três ideias claras. Primeira: o exame deve ser simples e breve (podem bastar três ou quatro minutos), nunca complicado. Segunda: o exame será bom se nos ajudar a enxergar algumas falhas daquele dia e a pedir perdão a Deus por elas, e a ver também como perseveramos nas resoluções boas. Terceira: o exame será completo se terminar com alguma resolução, muito prática, de melhorarmos em algum ponto no dia seguinte (por exemplo, sermos mais pontuais no trabalho, ou falar mais com a família)."}, {"t": "p", "x": "• É importante ter em conta que – embora seja aconselhável – não é “obrigatório” fazer o exame à noite, à última hora do dia, se estamos caindo de sono. Convém fazê- -lo num momento em que a cabeça esteja ainda lúcida: por exemplo, antes do jantar, em lugar isolado (e antes de mergulhar na tv!); ou antes de nos deitarmos, mas estando ainda em pé, sentados numa poltrona; ou no local de trabalho, concentrando-nos um momento antes de encerrar o expediente; ou até mesmo no início do dia seguinte, fazendo – junto com as orações da manhã –, um breve balanço do dia anterior. Cada qual tem que achar seu “bom momento” para o exame."}, {"t": "p", "x": "• O que se deve evitar é fazer o exame na cama, já deitado. Esse mesmo conselho – lembra? – dávamos ao falar da oração mental. Quem tiver suficiente autocontrole da sonolência ou padecer de falta de sono, pode-se arriscar a ler, a orar mentalmente, a rezar o terço, a fazer o exame na cama... Mas não se engane. Você já se conhece. Se tiver o cochilo fácil, sabe muito bem o que acontecerá: vai adormecer sem fazer nada."}, {"t": "p", "x": "• Ainda uma sugestão dirigida às pessoas que quiserem fazer o exame com o máximo proveito: não faça o exame sem ter à mão uma agenda (ou um caderninho) e a caneta. Daqui a pouco veremos o que é bom anotar (e desculpe as repetidas recomendações que faço sobre a agenda; não é mania, é experiência)."}, {"t": "h", "x": "Em que assuntos nos convém pensar?"}, {"t": "p", "x": "Antes de responder a essa pergunta, quero deixar muito clara uma ideia: não pretendo sugerir nenhum “método rígido” de exame. É uma matéria em que deve haver muita liberdade e cada qual tem que a achar o seu modo de fazer um bom exame. Portanto, tudo o que disser a seguir são apenas sugestões, meras sugestões que têm sido úteis para outras pessoas. Vamos a elas."}, {"t": "p", "x": "• Comece pedindo luz ao Espírito Santo, para fazer um bom exame: “Vinde, Espírito Santo!”, “Que eu veja!”."}, {"t": "p", "x": "• Pode ser útil, inicialmente, dar uma olhada rápida ao dia, procurando lembrar alguma coisa negativa que cutuque na consciência: “Tive uma briga feia em casa”, “Tive preguiça de cumprir tal dever”, “Deixei-me dominar pela ira naquele momento”, “Abusei da comida ao jantar”, “Falei palavras ofensivas a tal colega”, “Cedi à imoralidade na Internet”... São faltas fáceis de lembrar, sem necessidade de uma análise demorada. Uma vez recordadas, peça sinceramente perdão a Deus: “Senhor Jesus, Filho de Deus, tem piedade de mim, que sou um pecador”. E proponha-se lutar."}, {"t": "p", "x": "• Mas e bom não reduzirmos o exame diário a uma espécie de preparação para uma confissão (ainda que o exame diário facilite preparar boas confissões). Muitas vezes, além de nos determos brevemente nas “faltas”, será bom determo-nos mais nas “coisas boas”."}, {"t": "p", "x": "Concretamente, todos deveríamos ter um pequeno <em>programa das melhoras<\/em> que desejaríamos alcançar (de preferência listadas na agenda). Por exemplo: a) um plano de vida diário de orações, de recitação do terço, de leituras espirituais, com seus horários previstos; b) duas ou três mortificações (sacrifícios), que nos ajudem a ter, por exemplo, mais ordem, ou a segurar a língua, ou a controlar a gula de chocolate ou de cerveja, etc.; c) um pequeno programa de ajuda aos outros, também de ajuda espiritual e apoio moral: “Vou conversar mais com Fulano”, “Procurarei ajudar essa outra pessoas nisso ou naquilo”..."}, {"t": "p", "x": "• Se revisarmos diariamente essas listas, veremos os pontos positivos que houve e aqueles em que estivemos mais falhos, e poderemos então fazer um ou dois propósitos de luta para o dia seguinte. O ideal seria abrir uma folha na agenda, ou uma página no computador, para nela ir listando esses propósitos. Por exemplo:"}, {"t": "p", "x": "- 3 de maio: amanhã, ser mais otimista nos comentários quando estiver à mesa lá em casa, no jantar;"}, {"t": "p", "x": "- 4 de maio: amanhã, levantar na hora certa, sem ceder nem cinco minutos à preguiça, e fazer com calma a oração;"}, {"t": "p", "x": "- 5 maio: amanhã, não deixar de dedicar, a tal hora, pelo menos 10 minutos à leitura do Evangelho ou de outro bom livro;"}, {"t": "p", "x": "- 6 de maio: amanhã, ligar para esse parente que tem a esposa doente, e marcar uma visita ou, pelo menos, mostrar-lhe que estou interessado e rezando."}, {"t": "p", "x": "Como dizia acima, são apenas algumas sugestões. Veja você qual seria, no seu caso, a melhor maneira de fazer esse breve exame, de modo que o ajude a retificar as falhas e a ir subindo, dia após dia, pela escada do amor e da perfeição cristã."}], "footnote": null}, {"n": 16, "label": "Capítulo 16", "title": "A leitura espiritual", "items": [{"t": "h", "x": "O que é a “leitura espiritual”?"}, {"t": "p", "x": "Há muitos tipos de leitura religiosa, mas não vou falar agora de todos nem sequer de vários deles. Apenas falarei de um: daquele que, na linguagem clássica cristã, se chama “leitura espiritual” em sentido estrito, e que costuma fazer parte do programa diário das pessoas que querem levar a sério a sua vida interior."}, {"t": "p", "x": "Consiste na leitura atenta e bem assimilada de um livro que trate de assuntos de “vida espiritual”, vida cristã, com boa doutrina e piedade: esclarecimentos sobre as verdades da fé, comentários aos Sacramentos, orientações sobre a prática das virtudes, das devoções, etc."}, {"t": "p", "x": "Lembro que, como dizia na Introdução, dentro do conceito de “vida espiritual” não entram só os temas de vida interior, mas também as virtudes e o modo de melhorá-las (a fé, a caridade, a paciência, a firmeza, a temperança, a constância, etc.), bem como os defeitos (a vaidade, a preguiça, a ira, a inveja, a desordem sensual, etc.) e o modo de vencê-los; e ainda o esforço por santificar a família, por achar Deus no trabalho, por levar Deus a outras pessoas, por trabalhar para que a sociedade seja mais cristã e mais justa, etc. Em suma, entra tudo quanto nos ajuda a procurar a santidade e o apostolado nas circunstâncias em que nos encontramos. Pois bem, a leitura espiritual tem como finalidade orientar-nos em todos esses campos."}, {"t": "h", "x": "Como fazer a leitura espiritual?"}, {"t": "p", "x": "• Antes de mais nada, é preciso convencer-se da sua necessidade e tomar a decisão de fazê-la, sempre que possível, diariamente."}, {"t": "p", "x": "• Ao tomar essa decisão deverá ter em conta:"}, {"t": "p", "x": "a. Primeiro: como em todas as práticas espirituais, é importante escolher o momento do dia mais favorável. Antes do café da manhã? No escritório, antes de começar o trabalho? No começo da tarde (hora que pode ser útil para estudantes, para algumas mães de família...)? Ao visitar uma igreja, antes de voltar para casa? No ônibus ou no metrô, desde que possa sentar-se? Reflita e defina."}, {"t": "p", "x": "b. Será mais fácil definir o horário se leva em conta que a leitura não precisa ser longa: ordinariamente bastam dez ou quinze minutos para tirar bom proveito dessa prática espiritual. Vivendo-a com constância, em pouco tempo terá lido e aproveitado mais bons livros do que imagina."}, {"t": "p", "x": "c. Mais um conselho prático: se você definir, por exemplo, dez minutos de leitura, faça sempre dez minutos como “norma”, nunca menos. Caso queira esticar essa leitura por mais tempo, ou deseje ler mais em outra hora, não há problema nenhum, mas considere esse acréscimo como “leitura extra”. É só em relação ao seu programa diário, aos seus dez ou quinze minutos bem definidos, que deve se sentir fielmente comprometido, com exigência responsável."}, {"t": "p", "x": "d. Escolha bem, em cada momento, o livro de leitura espiritual mais adequado. Para isso, é muito útil pedir conselho a uma pessoa de critério que conheça a sua alma e as lutas da sua vida. Em todo o caso, sempre que possível, procure ler um livro que vá ao encontro das suas necessidades espirituais e formativas, não um livro que satisfaça apenas a sua curiosidade."}, {"t": "p", "x": "e. Uma vez escolhido o livro, leia-o devagar, pausadamente, em sequência, e do começo ao fim (lendo, relendo, refletindo, rezando). Quem borboleteia nas leituras, “debicando” por curiosidade pedacinhos de vários livros ao mesmo tempo, sem completar nenhum, tira pouco proveito e permanece superficial na sua vida interior."}, {"t": "p", "x": "f. Não importa quanto tempo demorar a terminar um livro, mesmo que seja breve. Também não importa, antes pelo contrário, reler vários dias em seguida os mesmos trechos do livro, se a sua intenção é a de gravá-los melhor, para tirar deles mais fruto. Um livro bom pode ser relido todos os anos (por exemplo, um clássico sobre a Paixão de Cristo, no tempo da Quaresma; ou um bom livro sobre Nossa Senhora, em Maio, mês de Maria)."}, {"t": "p", "x": "g. Depois da leitura diária, ao fechar o livro, pergunte- -se: O que foi que eu compreendi, o que me ficou mais gravado?"}, {"t": "p", "x": "• É muito bom ter o desejo de conhecer (e de ler) as obras clássicas de espiritualidade, que têm ajudado inúmeras pessoas a se aproximarem de Deus. Como diz São Josemaria: «A leitura tem feito muitos santos» (<em>Caminho<\/em>, n. 116). Para ter ideia do tipo de livros de que estou falando, vou citar alguns, uns poucos dentre os universalmente mais conhecidos:"}, {"t": "p", "x": "- Tomás de Kempis: <em>A imitação de Cristo<\/em>"}, {"t": "p", "x": "- São Francisco de Sales: <em>Introdução à vida devota <\/em>(também chamado <em>Filoteia<\/em>), <em>Tratado do Amor de Deus <\/em>(mais “teológico”)"}, {"t": "p", "x": "- Santo Afonso Maria de Ligório: <em>A oração<\/em>, <em>A prática do amor a Jesus Cristo<\/em>, <em>As glórias de Maria<\/em>"}, {"t": "p", "x": "- Santa Teresa de Lisieux (Santa Teresinha): <em>História de uma alma<\/em> (também chamada <em>Manuscritos autobiográficos<\/em>)"}, {"t": "p", "x": "- Santa Teresa de Ávila: <em>O livro da vida<\/em>, <em>Caminho de perfeição<\/em>"}, {"t": "p", "x": "- Santa Catarina de Sena: <em>O diálogo<\/em>"}, {"t": "p", "x": "- São Josemaria Escrivá: <em>É Cristo que passa, Amigos de Deus<\/em>"}, {"t": "p", "x": "Há muitos outros livros de santos, que agora seria impossível citar, além de numerosas obras excelentes de autores antigos e contemporâneos, que podem fazer um bem imenso à nossa alma. Pesquise, pergunte, consulte a quem lhe possa dar um bom conselho. Acredite na leitura espiritual."}, {"t": "p", "x": "• Antes de encerrar estes conselhos, queria dar ainda dois esclarecimentos:"}, {"t": "p", "x": "• Não confunda a “leitura espiritual” com a “oração mental” (ou a “meditação”). É muito frequente o engano de pessoas que utilizam determinados livros para fazer a sua oração mental (ou a sua meditação), e acham que nisso consiste a leitura espiritual. Sem reparar, confundem dois conceitos diferentes."}, {"t": "p", "x": "Para a oração mental (que, como víamos, quase sempre vai unida à meditação), você pode escolher cada dia textos de livros diferentes, os que achar que lhe podem servir de apoio para “falar com Deus” naquele dia; pode variar muito. A “leitura espiritual” é coisa diferente: trata-se de ler em sequência, quase que de “estudar” um livro<em> <\/em>inteiro, completo, que garanta o aprofundamento da sua formação. Não esqueça essa distinção."}, {"t": "p", "x": "• Há outras leituras, que também nos fazem muito bem; mais ainda, que nos fazem muita falta: as que nos proporcionam <em>formação doutrinal<\/em>. Entre elas, podem-se destacar os catecismos: desde o <em>Primeiro Catecismo da doutrina cristã<\/em> ou o <em>Compêndio do Catecismo da Igreja Católica<\/em>, até o próprio <em>Catecismo da Igreja Católica<\/em>, amplo, profundo, excelente, por mais que exija certo preparo doutrinário para entendê-lo bem. Um bom livro de teologia para leigos, que não hesito em recomendar, é a obra do americano Leo Trese, <em>A fé explicada:<\/em> excelente, pedagógico e claro. Em bastantes casos, essas obras podem ser usadas também como “leitura espiritual”. Hoje, num mundo de ideias confusas, o estudo da doutrina é uma necessidade vital."}], "footnote": null}, {"n": 17, "label": "Capítulo 17", "title": "A presença de Deus: sob o sol de Deus", "items": [{"t": "h", "x": "O pardal, a despedida e a promessa"}, {"t": "p", "x": "Pouco tempo antes de falecer, São Josemaria Escrivá dizia a alguns dos que estavam perto dele: «Rezem por mim para que seja bom, isto é, para que tenha presença de Deus e seja mortificado»."}, {"t": "p", "x": "Pode parecer pouca coisa. No entanto, a Bíblia dá-nos como sinal da santidade precisamente <em>caminhar na presença de Deus<\/em> (cf. Gen 17,4; Salm 56,14 e 116,9, etc.)."}, {"t": "p", "x": "Ter presença de Deus é, antes de mais nada, tomar consciência de que Deus vive e está sempre perto de nós: que nos vê, que nos ouve, que nos acompanha com amor e se interessa como Pai até pelas menores coisas da nossa vida."}, {"t": "p", "x": "Creio que nos pode ajudar a perceber o sentido desta realidade recordar três passagens do Evangelho:"}, {"t": "p", "x": "• Você se lembra do pardal? Sim, do passarinho... <em>Olhai os pássaros do Céu... <\/em>– diz Jesus –<em>, vosso Pai celeste os alimenta. Será que vós não valeis mais do que eles? <\/em>(Mt 6,26). E também: <em>Não se vendem dois pardais por uma moedinha? No entanto, nenhum deles cai no chão sem o consentimento do vosso Pai. Não tenhais medo! Vós valeis mais do que muitos pardais<\/em> (Mt 10, 29.31). Presença de Deus Pai;"}, {"t": "p", "x": "• Você se lembra da última despedida de Jesus? <em>Eis que estou convosco todos os dias, até o fim dos tempos<\/em> (Mt 28,29). Presença de Deus Filho, de Cristo, principalmente na Eucaristia;"}, {"t": "p", "x": "• Você se lembra da grande promessa de Jesus na Última Ceia? <em>Eu pedirei ao Pai, e ele vos dará outro Consolador <\/em>[o Espírito Santo], <em>que ficará para sempre convosco: o Espírito da Verdade..., que permanece junto de vós e está em vós<\/em> (Jo 14,16-17). Presença de Deus Espírito Santo."}, {"t": "p", "x": "O Pai, o Filho e o Espírito Santo, a Santíssima Trindade está conosco, convive conosco, voltada amorosamente para nós. Mais ainda, se estamos em graça de Deus, mora em nossa alma, como nos lembra São Paulo: <em>Acaso não sabeis que sois templo de Deus e que o Espírito de Deus habita em vós?<\/em> (1 Cor 3,16). <em>Nós somos<\/em> – insiste – <em>o templo de Deus vivo<\/em> (2 Cor 6,16-18)."}, {"t": "h", "x": "O poço e o túnel"}, {"t": "p", "x": "O teólogo belga Jacques Leclecq, usa uma comparação sugestiva. Diz que muitos são como um homem que vive agachado no fundo de um poço, estreito, escuro e cheio de lama. Não é um poço alto. Bastaria que fizesse o esforço de ficar em pé, de apoiar as mãos na borda do poço, retesar os músculos e erguer-se até colocar a cabeça para fora. Veria, então, um panorama maravilhoso: campos verdejantes, caminhos, riachos, montanhas ao longe, cidades... Uma paisagem que poderia ser para ele um mundo novo, um mundo maravilhoso, se se decidisse a sair do poço."}, {"t": "p", "x": "Quando alguém começa a ter presença de Deus, sai do poço; ou então, sai de dentro de um túnel, como dizia, de modo muito expressivo, São Josemaria, mostrando, além disso, em que consiste o “mundo novo”: «Alguns passam pela vida como por um túnel, e não compreendem o esplendor e a segurança e o calor do sol da fé» (<em>Caminho,<\/em> n. 575)."}, {"t": "p", "x": "É preciso sair do nosso “túnel” carente da perspectiva de Deus, esse túnel que só nos permite enxergar o mundo ao nível do chão, nas suas dimensões mais planas e rasteiras, e passar a contemplar a vida sob o sol da fé, que dá luz e sentido novo, divino, a tudo. Ter presença de Deus é, simplesmente, manter abertos os olhos da alma. Então Deus faz com que compreendamos:"}, {"t": "p", "x": "• O “esplendor” do sol da fé. Com a luz de Deus, as pessoas, as coisas e os acontecimentos ganham uma dimensão nova, muito mais profunda, bonita e alegre. Até mesmo o sofrimento pode ganhar o brilho e as cores do amor e da alegria."}, {"t": "p", "x": "• A “segurança” do sol da fé. Com essa luz de Deus, alma se enche de confiança, de segurança. Aconteça o que acontecer, podemos afirmar com convicção o que dizia São Paulo: <em>Se Deus é por nós, quem será contra nós... Quem nos separará do amor de Cristo?... Tudo contribui para o bem daqueles que amam a Deus<\/em> (Rom 8, 28.31.35)."}, {"t": "p", "x": "• O “calor” do sol da fé. Com a fé na presença de Deus, podemos sentir aquele aconchego que, mesmo na proximidade de sua Paixão e Morte, Jesus sentia: «<em>O Pai que me enviou está comigo. Ele não me deixa sozinho, porque eu sempre faço o que é do seu agrado<\/em>» (Jo 8,29). É o calor do carinho de Deus, nosso Pai, que a fé nos faz experimentar. Entendemos então o “mandamento da alegria” que dava São Paulo: <em>Alegrai-vos sempre no Senhor! Repito, alegrai- -vos... O Senhor está próximo. Não vos preocupeis com coisa alguma...<\/em> (Fil 4,4-6)."}, {"t": "p", "x": "A presença de Deus, como vemos, leva a viver todos os instantes da nossa vida com espírito cristão, esperança e alegria. Aprofundaremos um pouco mais nisso nos próximos capítulos."}], "footnote": null}, {"n": 18, "label": "Capítulo 18", "title": "A presença de Deus: como consegui-la?", "items": [{"t": "h", "x": "A respiração da alma"}, {"t": "p", "x": "Muitas vezes, «vivemos como se o Senhor estivesse lá longe, onde brilham as estrelas, e não consideramos que também está sempre ao nosso lado. E está como um Pai amoroso... Necessário é que nos embebamos, que nos saturemos de que Pai e muito Pai nosso é o Senhor que está junto de nós e nos céus» (<em>Caminho<\/em>, n. 267)."}, {"t": "p", "x": "Como conseguir “embeber-nos” dessa realidade, na prática?"}, {"t": "p", "x": "Penso que nos pode ajudar uma imagem expressiva: a dos mergulhadores. Muitos séculos antes de que fossem inventados os equipamentos de mergulho, com suprimento de oxigênio e outros acessórios, já havia mergulhadores em todos os continentes. Por exemplo, os pescadores de pérolas do Mar Vermelho. Ficavam dentro da água durante um tempo que a nós pode parecer muito longo, mas que se conta apenas por minutos. Necessariamente tinham que sair à tona com uma frequência determinada para respirar, sob pena de morrerem afogados."}, {"t": "p", "x": "Nós, que passamos os dias mergulhados em mil coisas, no imediatismo das urgências diárias, muitas vezes nos esquecemos de “emergir para o ar de Deus”, com o perigo de ficar espiritualmente asfixiados. Precisamos muito de “subir” constantemente para “respirar” o ar de Deus."}, {"t": "p", "x": "Como conseguimos isso? sempre que lutamos por lembrar-nos dEle mediante “atos explícitos de presença de Deus” (e também de Nossa Senhora, dos Santos, dos Anjos). Consistem em breves pensamentos, desejos, aspirações e orações, impregnados de fé e de amor, que servem como “elevadores” da alma para Deus."}, {"t": "h", "x": "Uma condição prévia"}, {"t": "p", "x": "Os atos de presença de Deus pressupõem uma condição: não estar submergidos de tal maneira no mundo, que a pressão das águas nos esmague a alma. É o que acontece quando vivemos o dia a dia de costas para Deus, sepultados sob uma massa imensa de preocupações e ocupações pessoais, de sonhos, imaginações, projetos e satisfações, que estão concebidos e vividos totalmente à margem de Nosso Senhor."}, {"t": "p", "x": "É justamente para evitar esse perigo que os santos nos incentivam vivamente a esforçar-nos por viver na presença de Deus."}, {"t": "p", "x": "Para consegui-lo, a primeira condição é levar a sério as práticas espirituais diárias ou periódicas que já comentamos até aqui. Elas deixam a alma “aquecida” – como se “aquecem” os atletas antes de competir –, pronta, desperta, disposta a dar com leveza o “salto” para Deus no meio das tarefas e da agitação do dia."}, {"t": "p", "x": "Ajudados por essa disposição da alma, será mais fácil que consigamos empregar os meios – tradicionais na espiritualidade católica– que servem para manter, aumentar e melhorar a presença de Deus durante o dia."}, {"t": "h", "x": "Meios para alcançar a presença de Deus"}, {"t": "p", "x": "Existem diversos meios para nos lembrarmos de Deus, cuja eficácia foi comprovada pelos santos durante dois milênios. Vou lembrar alguns deles, fazendo antes, porém, duas ressalvas importantes:"}, {"t": "p", "x": "a. Esses meios têm o papel, por assim dizer, de “muletas”. Devem escolher-se e usar-se com sensatez e liberdade de espírito, na medida em que nos ajudem “mesmo” a lembrar-nos de Deus durante o dia. Se não nos ajudam, vamos deixá-los de lado, como se faz com as muletas desnecessárias. O que não se pode fazer – se queremos viver com Deus – é não usar nenhum;"}, {"t": "p", "x": "b. Não nos esqueçamos de que quem guia a nossa alma é o Espírito Santo, que <em>sopra onde quer<\/em> (Jo 3,8 e Rom 8,14). Por isso, o primeiríssimo meio é deixar-nos guiar docilmente pelas inspirações do Espírito Santo, que não faltam quando a alma tem boa vontade e é alma de oração."}, {"t": "p", "x": "E agora vamos às sugestões:"}, {"t": "p", "x": "• Eu sinto muita alegria quando um amigo ou conhecido me fala do filho recém-nascido, ou da esposa, ou da família inteira e me mostra, sorridente, a foto digital deles no celular ou na agenda eletrônica. O carinho faz-lhe sentir a necessidade desses lembretes para “tê-los presentes”. Todo coração precisa da “presença” de seus amores. O nosso coração, quando quer amar a Deus, precisa da mesma coisa. Por isso, um bom meio de alimentar a presença de Deus é, entre outras coisas:"}, {"t": "p", "x": "a) colocar nesses aparelhos eletrônicos de uso diário, e no computador de trabalho, alguma imagem de Cristo, de Maria Santíssima, de santos, etc. Na Internet achamos um estoque grande. Depois de inseri-los, bastará um olhar de carinho para esse ícone, e estaremos fazendo um ato de presença de Deus."}, {"t": "p", "x": "Também será um ato de presença dirigir-lhes uma invocação, uma oração breve, um pedido para as necessidades daquela hora; ou um oferecimento concreto: oferecer a Deus o trabalho daquele momento, a resolução de sermos mais delicados com os outros, de aproveitar melhor um intervalo ocioso nas tarefas..."}, {"t": "p", "x": "b. A mesma finalidade pode-se alcançar por meio de um crucifixo ou de uma imagem de Nossa Senhora, ou de um santo da nossa devoção, colocados discretamente como elementos decorativos do escritório, consultório, etc., que possamos ver enquanto trabalhamos; e colocados também em lugar nobre da casa, no quarto, na cozinha; mas, insisto, de maneira discreta e se possível artística, evitando transformar a casa num convento!"}, {"t": "p", "x": "Também é ótimo utilizar como “despertador-lembrete”, uma estampa de Nossa Senhora, ou outra diferente, colocada na carteira, ou uma medalha..., mas tudo com naturalidade e discrição. Ter presença de Deus não é “exibir” a religiosidade à toa nem fazer o papel de católico “público”. A melhor maneira de mostrar a nossa fé aos outros é a nossa vida cristã autêntica."}, {"t": "p", "x": "c. Eu gostaria ainda de lhe recomendar vivamente que carregue sempre consigo – no bolso, na bolsa – um pequeno crucifixo (além do seu terço ou tercinho de anel), de modo que possa colocá-lo perto dos papéis, objetos de trabalho, livros de estudo; ou numa gaveta que abra e feche com frequência; e também na mesinha de cabeceira, para beijá-lo antes de dormir e logo ao acordar."}, {"t": "p", "x": "• Falamos de “lembrar” e já mostramos que se trata de lembrar para falar, para fazer breves orações, que vão impregnando o dia do calor de Deus. Essas orações breves são as “jaculatórias”. Vamos tratar delas no próximo capítulo."}], "footnote": null}, {"n": 19, "label": "Capítulo 19", "title": "A presença de Deus: as orações jaculatórias", "items": [{"t": "h", "x": "Onde achar jaculatórias?"}, {"t": "p", "x": "Interrompemos a anterior reflexão mencionando as “jaculatórias”. São orações brevíssimas, lançadas como um dardo cheio de carinho (<em>jaculum<\/em>, em latim, quer dizer dardo), dirigidas a Deus, aos Anjos ou aos Santos."}, {"t": "p", "x": "Pois bem, vamos perguntar-nos agora: Que jaculatórias posso rezar? Quais são as mais adequadas, as mais úteis? Onde encontrar inspiração para aprender boas jaculatórias?"}, {"t": "p", "x": "• A primeira resposta é: Procure achá-las dentro do seu coração. Rezar não pode ser nunca uma coisa mecânica. Portanto, as jaculatórias devem expressar aspirações e sentimentos sinceros do coração: adoração, amor, gratidão, arrependimento, petições por necessidades ou pessoas, oferecimentos, aceitações, expressões da nossa alegria ou da nossa dor..., enfim, aquilo que, espontaneamente diz a Deus um coração que tem fé e amor, quando sabe que o tem junto de si."}, {"t": "p", "x": "Na realidade, quase todos dizemos jaculatórias espontâneas quase sem reparar. Por exemplo: “Obrigado, meu Deus!” (quando recebemos uma alegria ou escapamos de um perigo); “Meu Deus, me ajude! (quando nos sentimos incapazes de resolver um problema, ou estamos aflitos ou em situação de risco); “Perdão, Senhor”, ou “Jesus, tem piedade de mim” (quando reconhecemos uma falta e nos arrependemos); “Minha Mãe, não me abandone” (quando estamos precisados do aconchego da Mãe de Deus e nossa); “Minha Nossa Senhora!” (quando levamos um susto); “Meu Anjo da guarda, me acompanhe e me proteja” (quando saímos à rua); “São José, meu Pai e Senhor, interceda por mim” (por diversas necessidades ou desejos), etc;"}, {"t": "p", "x": "• Outra fonte de jaculatórias, inesgotável, é a Bíblia. Colocar exemplos seria interminável, desde versículos dos Salmos (“Senhor, sois Vós quem eu procuro”, “Tende piedade de mim, segundo a vossa grande misericórdia”, “Meu coração está pronto, ó Deus, meu coração está pronto!”...), até as frases que os personagens do Evangelho dirigiam a Jesus: “Senhor, se queres, podes limpar-me”, “Senhor, que eu veja!”, “Senhor, eu creio, mas ajuda a minha incredulidade”, “Pai, pequei contra o Céu e contra Ti”, “Ó Deus, tem piedade de mim, que sou um pecador!”, “Senhor, tu sabes tudo, tu sabes que eu te amo”, “Meu Senhor e meu Deus!”...)."}, {"t": "p", "x": "• E ainda podemos encontrar um tesouro de jaculatórias na “tradição” da devoção cristã (bastaria pensar, por exemplo, nas numerosas jaculatórias que compõem a Ladainha que se costuma rezar depois do Terço)."}, {"t": "p", "x": "Podemos resumir essas jaculatórias “tradicionais” em dois grupos: aquelas que nós escolhemos dos textos litúrgicos da Igreja («Senhor, tende piedade de nós», «Nós vos damos graças por vossa imensa glória»...), e as que aprendemos da piedade dos santos, dos bons autores espirituais antigos ou modernos e das nossas famílias (Deus abençoe as avós!). Por exemplo:"}, {"t": "p", "x": "- “Jesus, manso e humilde de coração, fazei o meu coração semelhante ao vosso”"}, {"t": "p", "x": "- “Sagrado Coração de Jesus, em vós confio”"}, {"t": "p", "x": "- “Sagrado Coração de Jesus, dai-nos a paz”"}, {"t": "p", "x": "- “Vinde, Espírito Santo!”"}, {"t": "p", "x": "- “Doce Coração de Jesus, sede o meu amor. Doce Coração de Maria, sede a minha salvação”"}, {"t": "p", "x": "- “Jesus, José e Maria, dou-vos o coração e a alma minha”."}, {"t": "p", "x": "- “Senhor, eu me abandono em Vós, confio em Vós, descanso em Vós”"}, {"t": "p", "x": "- “Senhor, o que Tu quiseres, eu o amo”"}, {"t": "p", "x": "- “Jesus, dá-me o amor com que queres que eu te ame”"}, {"t": "p", "x": "- “Meu Deus, eu te amo, mas ensina-me a amar”"}, {"t": "h", "x": "Mais algumas sugestões práticas"}, {"t": "p", "x": "• É muito útil associar habitualmente alguma jaculatória a um determinado ato ou objeto. Por exemplo, ao começar o trabalho: “Ofereço-te este trabalho, Senhor”; ou, ao sair de casa, “Jesus, Maria e José, guardai os meus filhos”; ou, ao entrar na Igreja e fazer genuflexão diante do sacrário, “Eu te adoro com devoção, Deus escondido”; ou na elevação da hóstia e do cálice na Missa, “Meu Senhor e meu Deus!”."}, {"t": "p", "x": "• Muitas pessoas usam uma “senha” espiritual todos os dias. Neste nosso mundo da informática, todo o mundo sabe o que é uma senha: algo breve que dá “entrada” (ao computador, a um arquivo, ao caixa eletrônico, ao uso do cartão de crédito, etc.). Refiro-me a pessoas que escolhem uma jaculatória para cada dia, como “senha”, como o “lema” daquele dia, pensando que, além de rezá-la bastantes vezes, aquela jaculatória os possa ajudar a ter presente uma virtude que precisam praticar melhor: por exemplo, é o que faz a pessoa que está irritada, quando escolhe como senha para andar com paciência a jaculatória “Rainha da paz, rogai por mim”."}, {"t": "p", "x": "• Também pensando na “senha”, acho que vale a pena lembrar-lhe que algumas pessoas escolhem a jaculatória diária de acordo com o que, tradicionalmente, eram as devoções próprias de cada dia da semana. Com algumas variações, essas devoções são as seguintes: Segunda-feira, as almas do Purgatório; Terça, os Anjos da Guarda; Quarta, São José; Quinta, a Eucaristia; Sexta, a Paixão e a Cruz; Sábado, Nossa Senhora e Domingo, a Santíssima Trindade. É uma tradição que a antiga Liturgia das “Missas votivas” recolhia inclusive oficialmente."}, {"t": "p", "x": "• Finalmente, se você é pessoa que gosta de acompanhar os “tempos litúrgicos” e as devoções gerais da Igreja (Quaresma, Páscoa, mês de Maria, novena do Espírito Santo, etc.), sugiro-lhe que escolha como “senha”, nesses tempos, jaculatórias relacionadas com eles (na Quaresma, atos de dor dos pecados e de reparação; na Páscoa, louvores e atos de fé em Jesus ressuscitado; no Mês de Maio e na Novena da Imaculada Conceição, jaculatórias dedicadas a Nossa Senhora, etc.)."}, {"t": "p", "x": "Naturalmente, as “senhas” de que estamos falando, mesmo sendo muito úteis, não precisam ser exclusivas."}, {"t": "p", "x": "Por fim, um último conselho. Ainda que você decida escolher uma jaculatória para cada dia, reze outras que preferir com liberdade de coração. Faça tudo o que vimos neste capítulo com simplicidade. A sugestão de possíveis jaculatórias é para ajudar, não para complicar. Não se confunda, aja com liberdade. Se você me disser que prefere rezar só duas ou três jaculatórias durante todos os dias do ano, vou lhe responder que acho ótimo, se é isso o que lhe ajuda a ter presença de Deus."}], "footnote": null}, {"n": 20, "label": "Capítulo 20", "title": "O Rosário: alguns esclarecimentos", "items": [{"t": "h", "x": "Uma oração que Nossa Senhora ama"}, {"t": "p", "x": "Você reza o Terço? Já viu imagens de Nossa Senhora, representando-a tal como apareceu em Lourdes e em Fátima? Maria está com o rosário na mão. Ela acompanhou silenciosamente, passando as contas, o Terço que a menina Bernadete rezava na gruta de Lourdes. E, em Fátima, ela também com o terço na mão, pediu aos três pastorzinhos que o rezassem todos os dias."}, {"t": "p", "x": "Tomara que algum dia você possa dizer, como o Papa João Paulo II: «O Rosário é a minha oração predileta. Oração maravilhosa! Maravilhosa na simplicidade e na profundidade!»."}, {"t": "p", "x": "Mas, para isso, será preciso que comece a rezá-lo e, se já o reza com frequência, que aprenda a rezá-lo cada dia melhor. Vamos ver como podemos fazer isso."}, {"t": "h", "x": "Primeiro, vencer as dificuldades"}, {"t": "p", "x": "• Uma primeira dificuldade: “Não sei rezar o Terço”, “Não conheço, ou não sei de cor, os vinte ‘mistérios’ (ou seja, os cinco correspondentes a cada um dos quatro “Terços” que compõem atualmente o Rosário)”. Solução: comprar logo, ou pedir a alguma pessoa amiga, algum folheto ou livrinho de orações (há muitos!) que traga a explicação do Terço: como rezá-lo, quais são os mistérios, que mistérios devem rezar-se nos diferentes dias da semana... É fácil. Pessoas muitíssimo simples aprenderam tudo isso em pouco tempo. Se você “quer”, não lhes ficará atrás."}, {"t": "p", "x": "Um esclarecimento: a pessoa que reza o Terço sem conhecer ou lembrar os “mistérios” faz, mesmo assim, uma oração válida, ainda que, naturalmente, o Terço fique incompleto (mas é melhor rezá-lo incompleto do que não rezá-lo)."}, {"t": "p", "x": "• Segunda dificuldade: “Não tenho terço” (o instru-1 mento, o terço material, com as contas, a cruzinha, etc.; ou então o terço em forma de anel, que se usa girando no dedo). Compre-o, que é baratíssimo, e, enquanto não o tiver, conte pelos dedos. Mas tenha em conta que vale a pena usar o terço material: se o seu terço (de contas ou de anel) foi bento, ao usá-lo você ganha indulgências (Por sinal, você sabia que pode ganhar nada menos que Indulgência Plenária – com as devidas condições –, quando reza o Terço em família, ou comunitariamente, num grupo?)."}, {"t": "p", "x": "• Terceira dificuldade: “Não tenho tempo de rezar o Terço”. Essa desculpa “não gruda”. O Terço pode ser rezado, se for preciso, andando pela rua, fazendo exercício físico, corrida ou ginástica, indo de ônibus, metrô ou trem, guiando carro (melhor do que se irritar com o trânsito), na sala de espera do médico ou do laboratório, em casa, etc. E pode rezá-lo sentado, andando, de joelhos e até deitado (se estiver doente, ou em repouso forçado)."}, {"t": "p", "x": "Por sinal, não sei se sabe que, nas livrarias católicas, vendem CDs e outros recursos “áudio” mais modernos para ouvir e acompanhar a recitação do Rosário. Pode achá-los também na Internet. Basta, então, ouvir e ir respondendo às orações que escuta."}, {"t": "p", "x": "• Por último, a dificuldade mais comum é a aparente monotonia. “Dizemos sempre a mesma coisa”. “A repetição de tantas Ave-Marias acaba ficando mecânica, cansativa, sem sentido”. “Que adianta fazer uma oração tão repetitiva, que fica rotineira, parece oração de papagaio...”? Já falamos disso a propósito das “orações vocais”. Lembre o que dizíamos lá."}, {"t": "p", "x": "Os comentários que faremos a seguir espero que sejam também resposta a essas dúvidas e objeções. Deus faça que, após tê-las lido e, sobretudo, depois de tentar aplicá-las, você dê a razão às palavras de São Josemaria: «Há monotonia porque falta Amor» (<em>Santo Rosário<\/em>, Introdução)."}], "footnote": "Nestas meditações, usaremos Terço (com maiúscula) para referir-nos à oração, à devoção do Rosário; e terço (com minúscula), para referir-nos ao tercinho material que se utiliza para contar as Ave-Marias, etc."}, {"n": 21, "label": "Capítulo 21", "title": "O Rosário: o seu profundo sentido", "items": [{"t": "h", "x": "Oração contemplativa"}, {"t": "p", "x": "João Paulo II, na sua Carta sobre «O Rosário da Virgem Maria», diz que «recitar o Rosário nada mais é do que <em>contemplar com Maria o rosto de Cristo<\/em>». Já tinha pensado nisso? São palavras que parecem difíceis mas que, explicadas, se tornam fáceis."}, {"t": "p", "x": "Todos os que rezam o Terço, depois de fazerem o sinal da Cruz e algumas breves orações iniciais (que se encontram nos folhetos ou livros de orações antes mencionados), costumam começá-lo, dizendo, por exemplo: “Os mistérios que hoje vamos <em>contemplar<\/em> são os Mistérios da Dor”, e, logo a seguir: “Primeiro mistério: A oração de Jesus no Horto das Oliveiras”. (Só depois disso é que se reza o Pai-nosso, as dez Ave-Marias e o Glória ao Pai). “Vamos contemplar”, dizemos. Como?"}, {"t": "p", "x": "• Uma possível maneira: Após enunciar, por exemplo, o primeiro Mistério de Dor (a oração de Jesus no Horto) e antes de começar o Pai-nosso, faça uma “paradinha”, nem que seja de poucos segundos, em que fique imaginando Jesus no Horto, sofrendo agoniado e dizendo ao Pai: <em>Não se faça a minha vontade e sim a tua<\/em> (cf. Mc 14,36). Pense então, como num <em>flash<\/em>, no exemplo de Jesus e pergunte-se: “Eu sei aceitar a Vontade de Deus?”. É uma boa maneira de contemplar."}, {"t": "p", "x": "• Outra maneira: Há pessoas que “entram” na cena como mais um personagem. No caso citado, ficam imaginando-se a si mesmas ao lado de Jesus no Horto, e ali – sem sair daquele lugar, pegados a Jesus – vão rezando as Ave-Marias enquanto olham para Cristo sofredor, banhado no suor de sangue. Pensam, por exemplo: “Como são pequenas as minhas penas, comparadas com as de Jesus”, e pedem então a Maria que os ajude a aceitá-las com mais fé e amor. Se, naquele dia, estão abatidos por uma dor, rezam esses Mistérios do Rosário com o desejo de achar conforto junto de Jesus que sofre."}, {"t": "p", "x": "• São Josemaria fazia assim. Por exemplo, meditando – como explica no seu precioso livro <em>Santo Rosário–<\/em> o quinto Mistério de Gozo (Jesus perdido e achado no Templo) imaginava-se acompanhando com lágrimas a Maria e José na sua procura ansiosa pelo Menino, sentia pena «pelas vezes em que o perdi por minha culpa e não clamei», e suplicava: «Jesus! Que eu nunca mais te perca». De modo semelhante, “acompanhando”, no terceiro Mistério de Dor, Jesus coroado de espinhos, perguntava-se: «Tu e eu não teremos voltado a coroá-lo de espinhos»? E exclamava: «Nunca mais, Jesus, nunca mais...»."}, {"t": "p", "x": "• Quero mencionar ainda outro meio de facilitar essa breve contemplação. Existem livrinhos, folhetos, que trazem todos os Mistérios, e, em cada um deles, além da reprodução de um quadro ou gravura da cena do Mistério, colocam uma frase da Sagrada Escritura e um breve comentário espiritual. É uma leitura que se pode fazer em dez ou quinze segundos."}, {"t": "p", "x": "• Talvez você diga: “Contemplar assim, não vai distrair a atenção das palavras da Ave-Maria?”. Pode ser, mas, então, bendita distração. Nossa Senhora nada quer tanto como levar-nos até Jesus. Neste caso, as Ave-Marias ficarão sendo como uma música de fundo,que, mesmo rezadas meio-distraídos, agradarão muito à nossa Mãe."}, {"t": "p", "x": "São Josemaria usava uma comparação muito bonita para explicar isso. Evocava aquelas épocas antigas, românticas, em que os namorados ficavam fazendo serenata, com a viola ou o bandolim, em baixo da janela da namorada. Cantavam, repetiam as canções, e mesmo que por um tempo longo se distraíssem do sentido das palavras que pronunciavam, a sua serenata continuava sendo um ato de carinho sincero, que a namorada agradecia comovida. Assim podemos fazer com o Terço."}, {"t": "p", "x": "Evidentemente, também é interessante aprender a rezar com atenção as Ave-Marias. Mas vamos deixar essa explicação para a meditação a seguir."}], "footnote": null}, {"n": 22, "label": "Capítulo 22", "title": "O Rosário: diálogo com Nossa Senhora", "items": [{"t": "h", "x": "Como rezar bem as Ave-Marias?"}, {"t": "p", "x": "Em várias das anteriores meditações, recordamos que “orar é falar com Deus”. Rezar o Rosário, então, é “falar com Deus e Maria”, ou melhor, “orar a Deus juntamente com Maria”: “Santa Maria, mãe de Deus, <em>rogai por nós<\/em>, pecadores...”"}, {"t": "p", "x": "Como podemos fazer das Ave-Marias um verdadeiro diálogo filial com a Mãe?"}, {"t": "p", "x": "• Acabamos de comentar que, quando nos concentramos especialmente na “contemplação” dos Mistérios, pode acontecer que as Ave-Marias saiam um pouco distraídas. E dizíamos que não importa: na realidade elas ficam sendo uma bela música de fundo em honra da Nossa Senhora."}, {"t": "p", "x": "• Há, contudo, outras ocasiões em que, depois da breve contemplação do Mistério, podemos concentrar-nos totalmente nas Ave-Marias (e também no Pai-nosso e no Glória), prestando a maior atenção possível às palavras que recitamos, sem por isso fazer do Terço uma oração lenta, interminável. Há várias maneiras de consegui-lo. Vou sugerir-lhe algumas (sempre ressalvando que cada qual deve agir com toda a liberdade e fazendo o que Deus lhe inspirar):"}, {"t": "p", "x": "a. Ajuda muito escolher uma ou duas palavras da oração, e rezá-las dando-lhes interiormente uma ênfase especial; até mesmo pronunciando-as em voz mais alta, se estivermos sozinhos. Por exemplo:"}, {"t": "p", "x": "- «Ave Maria, <em>cheia de graça<\/em>, <em>o Senhor é convosco<\/em>». A São Josemaria, essa frase lembrava-lhe que a alma de Maria estava cheia do Espírito Santo, que “estava com Ela”."}, {"t": "p", "x": "- Ou: «Bendito o fruto do vosso ventre <em>Jesus<\/em>». João Paulo II diz que o nome de Jesus é «o baricentro da Ave- -Maria», e comenta: «Ora, é precisamente pela acentuação dada ao nome de Jesus e ao seu mistério que se caracteriza a recitação expressiva e frutuosa do Rosário»."}, {"t": "p", "x": "- Ou: «Santa Maria, <em>Mãe<\/em>»... Carregar a ênfase na palavra “Mãe” pode ajudar-nos a manter a atenção e a ter o coração desperto."}, {"t": "p", "x": "- Ou: «Rogai por nós <em>pecadores<\/em>». Frisar especialmente a palavra “pecadores” ajuda-nos a ser humildes e a sentir mais a necessidade do amparo da Mãe."}, {"t": "p", "x": "b. Por outro lado, o Rosário é «arma poderosa» <em>para pedir<\/em>, para «suplicar a Cristo com Maria», que é «onipotente por graça» (João Paulo II). Vejamos possíveis maneiras de viver o Terço com esse espírito de súplica:"}, {"t": "p", "x": "- Oferecer o <em>Terço inteiro<\/em> por uma intenção (por exemplo, por um familiar, pela alma de um parente falecido, pela próxima viagem pastoral do Papa, por um recém- -nascido, para dar graças pelos benefícios recebidos, etc.);"}, {"t": "p", "x": "- Oferecer <em>cada Mistério<\/em> por uma intenção: Por exemplo: Primeiro Mistério da Luz - “Pela saúde de tal filho”. Segundo Mistério da Luz: “Pelo sucesso do meu irmão num concurso”. Terceiro Mistério da Luz: “Pela conversão de Tal pessoa”... Podemos fazer isso em cada Mistério, quer mantendo intenções fixas, habituais, quer intenções que vão variando dia a dia conforme as necessidades."}, {"t": "p", "x": "- O fato de colocar intenções ajuda a prestar mais atenção à Ave-Maria, especialmente às palavras «rogai por nós». Pode-se inclusive ir mais longe neste sentido, e até mesmo colocar intenções explícitas em <em>cada Ave-Maria. <\/em>Nada impede “ampliar” um pouco a Ave-Maria e rezar assim: «Santa Maria, Mãe de Deus, <em>rogai por<\/em>... (Fulano, pela paz, por minha mãe, etc.) <em>e por nós pecadores<\/em>, agora e na hora da nossa morte. Amém.»."}, {"t": "p", "x": "c. Embora, em geral, não seja costume entre nós, há certos países ou regiões em que – como lembram Paulo VI e João Paulo II –, é frequente acrescentarem ao nome de Jesus, em cada Ave-Maria, uma alusão ao Mistério concreto que se contempla (inclusive em voz alta, quando rezam vários). Por exemplo: «... o fruto do vosso ventre, Jesus, que deu a vida por nós na Cruz » (quinto Mistério da Dor); ou «...do vosso ventre, Jesus, que ressuscitou e vive junto de nós» (primeiro mistério de Glória), etc."}, {"t": "p", "x": "Concluindo: O Rosário é um “tesouro escondido”. Vale a pena que você o “descubra” e se entusiasme cada vez mais com ele. E, para isso, convirá que se empenhe:"}, {"t": "p", "x": "• Em rezar o Terço, se possível, todos os dias. Pelo menos, comece a rezá-lo uma vez por semana, de preferência aos sábados, dia dedicado a Nossa Senhora;"}, {"t": "p", "x": "• Em aproveitar a riqueza de delicadezas e meios práticos – os que comentamos aqui, e outros que Deus lhe fará descobrir –, que fazem da recitação do Terço uma oração viva, saborosa e eficaz, muito grata a Maria Santíssima."}], "footnote": null}, {"n": 23, "label": "Capítulo 23", "title": "Amor à Missa: como preparar-se?", "items": [{"t": "h", "x": "Como participar melhor na Missa"}, {"t": "p", "x": "Vamos começar uma série de reflexões sobre um assunto que tem uma importância capital na vida interior: Como amar e viver cada dia melhor a Santa Missa?"}, {"t": "p", "x": "Com certeza, você tem esse desejo: quer participar da Missa com mais fé, com mais amor, com mais fruto. Pois bem, para isso precisamos perguntar-nos muito sinceramente: Como é que eu vejo a Missa? O que é a Missa para mim?"}, {"t": "p", "x": "Talvez nos ajude a achar a resposta imaginarmos agora que já foi descoberta a “máquina do tempo”, sobre a qual fantasiam tantos romances e filmes. Ajudado pela máquina, você consegue recuar mais de dois mil anos, e de repente se encontra em Jerusalém, no ano 33 da nossa era."}, {"t": "p", "x": "Com imensa emoção, nota que está ocupando um lugar à mesa no Cenáculo, na sala onde Jesus está nesse momento instituindo a Sagrada Eucaristia, e ouve as suas palavras: <em>Isto é o meu corpo, que será entregue por vós; este é o cálice do meu sangue, que será derramado por vós...<\/em>». Simultaneamente, você se acha no Calvário ao pé da Cruz, junto de Nossa Senhora e de São João, e escuta como Jesus diz, pouco antes de morrer: <em>Tudo está consumado!<\/em> E ainda, sem nenhum intervalo de tempo, você está de novo no Cenáculo e vibra com os onze Apóstolos (Judas já se foi), radiantes de alegria porque acaba de se apresentar ali Jesus vivo, ressuscitado, e lhes mostra – a você também – as chagas das mãos e dos pés, enquanto lhes diz: <em>Não tenhais medo, sou eu mesmo!<\/em>"}, {"t": "p", "x": "Visto num filme, lido num grande romance, isso seria fantástico. Acontece, porém, que não estou falando nem de filme, nem de romance, nem de ficção científica. Falo de uma <em>realidade<\/em>, de uma tremenda e total realidade, que talvez você viveu muitas vezes sem reparar, com os olhos da alma tapados pelo desconhecimento ou pela fraqueza da fé. Porque isso, tudo o que acabo de dizer, acontece <em>de verdade<\/em>, todas as vezes que você assiste à Santa Missa."}, {"t": "h", "x": "Para quê me preparo?"}, {"t": "p", "x": "Sei que agora não é o momento de lhe dar uma aula sobre a Missa. Mas, uma vez que tratamos da preparação prática para a Missa, é necessário perguntar-nos: <em>para quê <\/em>me preparo? Como é lógico, você e eu nos prepararíamos de maneira diferente se fôssemos visitar um colega de trabalho, ou se fôssemos ter uma entrevista particular com o Papa."}, {"t": "p", "x": "Pois bem, a Missa, como diz um grande teólogo (Guardini), «é uma Pessoa». É Jesus, verdadeiro Deus e verdadeiro homem, no ato máximo do seu amor: naqueles momentos em que, como diz São Paulo, <em>se entregou – <\/em>morreu<em> – pelos nossos pecados, e ressuscitou para a nossa santificação <\/em>(cf. Rm 4,25 e 1 Cor 11,26)."}, {"t": "p", "x": "Não acha que será útil rever agora brevemente pontos básicos da nossa fé sobre a Missa, a fim de compreender como devemos prepará-la?"}, {"t": "p", "x": "Leio no <em>Compêndio <\/em>do Catecismo da Igreja Católica que a Eucaristia «é o próprio sacrifício do Corpo e Sangue do Senhor Jesus, que ele instituiu para perpetuar pelos séculos o sacrifício da cruz, confiando assim à sua Igreja o memorial da sua morte e ressurreição» (n. 271)."}, {"t": "p", "x": "“Memorial”, no caso, não quer dizer “lembrança”, mas “re-apresentação” atual de fatos que aconteceram em outro tempo, e que Deus quer eternizar. Como ensina a Igreja, «tudo o que Cristo fez e sofreu por todos os homens, participa da eternidade divina, e assim transcende todos os tempos e em todos se torna presente» (<em>Catecismo da Igreja<\/em>, n. 1085). Por isso, «quando a Igreja celebra a Eucaristia [a Santa Missa], memorial da morte e ressurreição do seu Senhor, este acontecimento central de salvação torna- -se <em>realmente presente<\/em>» (João Paulo II, <em>Encíclica sobre a Eucaristia<\/em>, n. 11)."}, {"t": "p", "x": "Sendo assim, é natural que a Igreja proclame que a Eucaristia é «fonte e ápice de toda a vida cristã», e que «ela encerra todo o bem espiritual da Igreja: o mesmo Cristo» (<em>Compêndio<\/em>, n. 274)."}, {"t": "p", "x": "Você vai à Missa? Então vai ter um encontro pessoal – atual! – com Jesus, no momento em que, como diz São João, levou seu amor por nós <em>até o fim<\/em> (Jo 13,1); está indo ao encontro de Jesus, vivo, que o espera entregando- -se <em>agora <\/em>na cruz por você, dando-se <em>agora <\/em>a você como alimento de Vida, esperando <em>agora <\/em>por você com o coração cheio da maior loucura de amor que se possa imaginar."}, {"t": "p", "x": "Grandes verdades que João Paulo II resume assim: «O sacrifício eucarístico [a Missa] torna presente não só o mistério da paixão e morte do Salvador, mas também o mistério da sua ressurreição, que dá ao sacrifício a sua coroação. Por estar vivo e ressuscitado é que Cristo pode tornar-se “pão da vida” (Jo 6,35.48), “pão vivo” (Jo 6,51) na Eucaristia» (<em>Encíclica sobre a Eucaristia<\/em>, n. 14)."}, {"t": "h", "x": "Como preparar-se bem"}, {"t": "p", "x": "Será que todas as vezes que você vai à Missa se prepara para “isso”? Não? Então, tire as consequências."}, {"t": "p", "x": "A primeira e fundamental, segundo me parece, é a que exprime o ditado «amor com amor se paga». Portanto:"}, {"t": "p", "x": "• Seria penoso ir ao encontro de Jesus na Missa e na Comunhão com um coração que carregasse, sem se importar com isso, ofensas graves contra Deus, pecados mortais não perdoados numa boa confissão. Que falta de amor e de respeito! É lógico que a Igreja tenha ensinado sempre, sem mudar jamais, o que hoje ensina o <em>Catecismo<\/em> grande:"}, {"t": "p", "x": "«Quem quer receber a Cristo na comunhão eucarística deve estar em estado de graça. Se alguém tem consciência de ter pecado mortalmente, não deve comungar a Eucaristia sem ter recebido previamente a absolvição no sacramento da penitência» (n. 1415)."}, {"t": "p", "x": "A Igreja condena o erro dos que dizem que se pode comungar, ainda que se tenha um pecado mortal, desde que a pessoa se arrependa e se proponha a confessar-se <em>depois<\/em>. Não, a confissão – fora de uns poucos casos de grave impossibilidade e necessidade de comungar – deve ser feita sempre antes de receber a Eucaristia (“necessidade” de comungar é, por exemplo, o caso de perigo de morte, ou a precisão de fazer a comunhão anual, em circunstâncias onde isso só pode ser feito através de um leigo ministro da Comunhão, por falta de padre)."}, {"t": "p", "x": "Depois de esclarecer isso, quero que evite uma possível confusão. Quando, infelizmente, uma pessoa não pode comungar por ter algum pecado mortal não confessado, isso não quer dizer que não possa assistir à Missa com muito proveito (pense na Missa pelas almas, que é de grande proveito para os falecidos, ainda que evidentemente eles não possam comungar)."}, {"t": "p", "x": "A “necessidade” da confissão prévia é para a Comunhão, não para a Missa. Por isso, se tiver a desgraça de algum dia não poder comungar, porque cometeu um pecado grave, vá assim mesmo à Missa, não perca esse tesouro! Peça perdão a Jesus no coração, e confie em que aquela Missa lhe dará, da parte de Deus, forças para melhorar e capacidade de entender melhor o valor da confissão frequente."}, {"t": "p", "x": "• Voltemos a pensar – como víamos antes – que a Missa é o máximo ato de amor de Cristo, que nela você vai ao encontro de <em>this tremendous lover <\/em>(esse tremendo amante), como diz o poeta inglês Francis Thompson. Se está convencido disso, sentirá naturalmente o desejo de se preparar fazendo, por dentro, muitos atos de contrição também pelos pecados veniais: “Perdão, Jesus, por essas faltas que não são mortais, mas são indelicadezas!”. E fará atos de fé, de esperança e de amor. Antes de ir à Missa, medite bem no que vai fazer, reze algumas das preces que os bons livros de orações trazem para «antes da Comunhão»."}, {"t": "p", "x": "O melhor mesmo seria fazer, antes da Missa, em casa ou na igreja, uns minutos de oração mental. Às vezes isso será difícil (pois outras pessoas da família se atrasam, ou você viajou e chega em cima da hora...), mas sempre se pode conseguir um pouco de recolhimento interior e dizer breves orações no carro, na condução ou andando pela rua."}, {"t": "p", "x": "• Antes lhe falava da diferente preparação que deveríamos fazer conforme fôssemos simplesmente encontrar um colega, ou fôssemos visitar o Papa. Pois bem, na Missa e na Comunhão nos espera, nos acolhe, vem a nós, alguém infinitamente maior que qualquer outro ser humano, por importante que seja: Jesus, Deus e Homem. Acha lógico irmos ao encontro dEle relaxados, usando por comodismo uma bermuda, camiseta e chinelos; ou, no caso das mulheres, vestindo um tipo de roupa – ou de escassez de roupa – que em nenhuma hipótese ousariam usar numa visita ao Papa? Então, repito o que antes lhe dizia: tire as consequências."}, {"t": "p", "x": "Por hoje, acabamos aqui. Teremos, nas próximas reflexões, mais algumas conversas sobre outros aspectos da grandeza da Missa bem vivida."}], "footnote": null}, {"n": 24, "label": "Capítulo 24", "title": "Amor à Missa: como participar?", "items": [{"t": "h", "x": "A família de Deus"}, {"t": "p", "x": "Você já ouviu dizer que a Igreja deseja que todos os fiéis participem na Missa «com conhecimento de causa, ativa e frutuosamente». Essa foi uma das metas que propôs o Concílio Vaticano II (<em>Constituição sobre a Liturgia<\/em>, n. 11)."}, {"t": "p", "x": "Pois bem, é sobre isso que agora vamos conversar. Você imagine que já está dentro da igreja ou capela onde vai ser celebrada a Missa. Quem é que lá se reuniu? Um <em>grupo<\/em> – grande ou pequeno – de fiéis. A Missa não é uma oração individual. É a oração, o culto de uma<em> família<\/em> reunida, da <em>família de Deus<\/em>, de que fala São Paulo, referindo-se à Igreja (Ef 2,19)."}, {"t": "p", "x": "Quer dizer que a Missa é um ato <em>comunitário<\/em>, e um ato comunitário impressionante, porque cada uma das Missas – qualquer Missa – não é apenas o culto de <em>uma comunidade <\/em>concreta, mas da <em>Igreja inteira<\/em>. Na realidade, em cada Missa é sempre a Igreja toda, o <em>Corpo de Cristo <\/em>(1 Cor 12,12), que, juntamente com a Cabeça desse Corpo – Jesus, que é o Sacerdote Eterno, o Celebrante principal e a Vítima do Sacrifício –, se oferece a Deus Pai, na unidade do Espírito Santo. O sacerdote celebrante é apenas o «instrumento vivo de Cristo Sacerdote» (Concílio Vaticano II). Não se esqueça nunca disso, e pense que essa realidade grandiosa se dá mesmo numa Missa a que assista uma só pessoa."}, {"t": "p", "x": "Mas voltemos ao que dizíamos no início. Imagine que está começando a participar na Santa Missa. Se a Missa é – como de fato é – um ato de Cristo e da Igreja, é natural que o seu coração – juntamente com os dos que participam dessa Missa –bata bem unido ao coração de Jesus e ao coração da Igreja, seu Corpo inseparável. Essa é a principal <em>participação<\/em>: a união sincera, íntima, amorosa, com a oração da Igreja, ou seja, com a Liturgia da Igreja. Sem ela, qualquer outra participação seria superficial ou falha."}, {"t": "h", "x": "Participação externa e interna"}, {"t": "p", "x": "A Igreja insiste em que a principal participação é a <em>interior<\/em>. As orações litúrgicas, que todos devemos recitar em comum, serão “nossas”, se realmente são “minhas”, isto é, se são preces vividas intimamente por mim, por você, e não sons externos que se limitam a acompanhar os dizeres de outras pessoas (falados ou cantados). Penso que isso se pode resumir bem com umas palavras de São Josemaria Escrivá: «Viver a Santa Missa é permanecer em oração contínua» (É Cristo que passa, n. 88)."}, {"t": "p", "x": "Como deve ser essa oração? Não pretendo esgotar as riquezas da Liturgia da Missa. Vou sugerir-lhe apenas – neste capítulo e nos próximos – alguns dos modos de “orar na Missa”."}, {"t": "p", "x": "• Nos ritos iniciais, toda Missa inclui um “ato penitencial”. Você, com a sua oração, unida à do celebrante e à dos outros participantes, realiza nesse momento o que o <em>Catecismo da Igreja<\/em> chama «o primeiro movimento da oração de súplica, o pedido de perdão» (n. 2631), lembrando-nos a seguir a parábola do fariseu e o publicano: Deus não escutou, no Templo, a oração vaidosa do fariseu, mas acolheu com carinho a oração humilde do publicano: Ó Deus, tem piedade de mim, que sou um pecador! (Lc 18,13). Por isso, procure rezar ou cantar esse ato penitencial fomentando a dor pelos seus pecados e indelicadezas para com Deus."}, {"t": "p", "x": "• Após a “oração coleta” recitada pelo sacerdote, começa a Liturgia da Palavra. Por meio das leituras bíblicas, Deus nos fala (<em>Palavra do Senhor!<\/em> – dizemos). E essa Palavra de Deus é, para cada um de nós, um começo de conversa, um apelo que se dirige à alma e sugere – sob a inspiração do Espírito Santo –uma resposta. Portanto, também essa parte da Missa é oração, diálogo."}, {"t": "p", "x": "Escute as leituras e seu comentário – a homilia – com atenção. Caso o som funcione mal (coisa não rara, às vezes) acompanhe-as lendo os textos do dia no folheto dominical, no impresso da Liturgia semanal, ou num missal dos fiéis..., mas acompanhe. A própria Liturgia, depois, ajuda a responder à Palavra com o Salmo responsorial e a aclamação ao Evangelho."}, {"t": "p", "x": "Mas você, que quer aprofundar na vida espiritual, não se contente com isso. Vá mais a fundo. Um bom costume é fazer, antes da Missa, um tempo de oração sobre essas leituras; ou fazer a meditação das leituras da liturgia do dia depois, ao voltar a casa, num horário oportuno. Não lhe digo mais, porque a essa reflexão litúrgica se aplicam as mesmas coisas que já foram comentadas ao falarmos da oração mental, da meditação e da leitura do Evangelho."}, {"t": "p", "x": "• A segunda parte da Missa, riquíssima – o verdadeiro âmago da Missa –, é a Oração Eucarística, que começa com o Prefácio. Tudo, nessa parte – especialmente no seu ápice, a Consagração, que é a essência da Missa –, eleva e arrasta para uma oração intensa, maravilhosa, que nunca, por longa que seja a nossa vida, nos cansaremos de viver e saborear. Ao contrário, a pessoa que ama a Missa, descobre nela cada dia uma fonte<em> <\/em>inesgotável, que sacia sem saciar."}, {"t": "p", "x": "Acompanhe, pois, atentamente, com sede espiritual, cada palavra, como a abelha que vai libando o mel de cada flor. “Diga” essas palavras a Deus, fazendo-as “suas”. E peça a nosso Senhor que o livre do absurdo de assistir como um espectador, que só fica observando e julgando como é que o padre se mexe, fala ou canta. Nunca esqueça que nós, os padres, não somos nem o centro nem o pivô da Missa. E que, às vezes, você terá que se esforçar bastante por viver bem o Sacrifício da Missa, “apesar de nós, os padres”."}, {"t": "p", "x": "Especialmente se vai comungar, fixe o olhar da alma na Eucaristia que vai receber, e – com a ajuda do missalzinho ou do folheto, se não as sabe de cor – procure rezar com devoção as orações de preparação litúrgica para a Comunhão («Senhor Jesus Cristo, Filho de Deus vivo...», etc.), que o celebrante deve dizer em silêncio. Coloque “mais alma” ainda ao dizer, instantes antes da Comunhão: «Senhor, eu não sou digno de que entreis em minha morada...»; e ao responder «Amém», olhando para a Hóstia santa que lhe é apresentada com as palavras: «O Corpo de Cristo!»."}, {"t": "p", "x": "• Não quero terminar a reflexão de hoje sem uma referência aos gestos e posições do corpo previstos na liturgia da Igreja. Eles também são oração: de pé, de joelhos, fazendo uma inclinação profunda (por ex., ao dizer <em>E se encarnou...<\/em>, no <em>Credo<\/em> mais longo), sentados... Os gestos são <em>símbolos<\/em>, como o são as palavras. Para exprimir o amor entre os esposos, tanto valor tem uma palavra carinhosa, como o gesto de dar uma flor ou um beijo."}, {"t": "p", "x": "Para uma pessoa que ama, seria incompreensível desprezar ou dispensar esses gestos e atitudes. Na Missa, ajudam o espírito a acompanhar melhor a oração, a viver atentamente a escuta orante da Palavra, a expressar a adoração, a união fraterna (rito da paz), a receber com reverência o Corpo de Cristo na Comunhão... E, além disso, são gestos vividos em conjunto, que refletem a união da <em>família de Deus<\/em>, que quer viver o máximo momento da vida cristã com as mesmas expressões de fé e oração."}, {"t": "p", "x": "Talvez você queira me perguntar: Que fazer quando se indicam ou praticam gestos que se afastam da liturgia e até a contrariam?"}, {"t": "p", "x": "O Papa Bento XVI os lamenta e diz que a liturgia, que é «ação de Deus [...], não está a mercê do nosso arbítrio e não pode suportar a chantagem das modas passageiras» (Exortação <em>Sacramentum caritatis<\/em>, n. 37), frisando ainda que «a simplicidade dos gestos e a sobriedade dos sinais, situados na ordem e nos momentos previstos, comunicam e cativam mais do que o artificialismo de adições inoportunas» (n. 40)."}, {"t": "p", "x": "Aquilo que não está de acordo com a Liturgia da Igreja não obriga em consciência. Não temos por que obedecer a uma desobediência. Mas devemos evitar atitudes que manifestem externamente crítica, revolta ou falta de caridade."}, {"t": "p", "x": "Será que a participação interior na Missa se esgota com o que vimos agora, nesses quatro itens? Não. Por isso, nas próximas reflexões consideraremos mais alguns aspectos dessa participação."}], "footnote": null}, {"n": 25, "label": "Capítulo 25", "title": "Amor à Missa: as orações do coração", "items": [{"t": "h", "x": "O Senhor olha o coração"}, {"t": "p", "x": "<em>O homem vê a face, mas o Senhor olha o coração <\/em>(1 Sam 16,7). Lembra-se desta frase da Bíblia? Ela deve ser sempre uma bússola que guie a nossa vida. Não importam as aparências exteriores, ou que os outros veem ou pensam, o que importa é o que Deus vê, o <em>interior do coração<\/em>, onde reside o verdadeiro valor do que fazemos (cf. Mc 7,21)."}, {"t": "p", "x": "Por isso São Paulo dizia que as ações aparentemente mais heroicas e belas, se fossem feitas sem amor de Deus e do próximo, seriam vazias: <em>como um bronze que soa ou um címbalo que retine<\/em> (1 Cor 13,1). Pois bem, a mesma coisa pode-se dizer da participação na Missa. Se não tiver raízes no amor do coração, merecerá a censura do profeta Isaías, que Jesus recorda: <em>Este povo honra-me com os lábios, mas o seu coração está longe de mim. É inútil o culto que me prestam<\/em> (Mc 7,6-7)."}, {"t": "p", "x": "Na reflexão anterior, já vimos que a melhor participação na Missa é unirmo-nos interiormente à voz de Deus, que nos fala nas Leituras, e a todas as orações e gestos da Liturgia com as quais nós Lhe falamos e O escutamos ao mesmo tempo."}, {"t": "p", "x": "Mas a participação na Missa não se esgota com essa participação consciente e ativa na Liturgia. Viver a Liturgia, certamente, é um modo essencial e insubstituível de participar, que não pode ser trocado por nada. Mas o nosso coração é potencialmente muito grande, é um <em>abismo<\/em>, diz a Escritura (Ecli 42,18), e, dentro dele, a Liturgia bem vivida pode despertar sentimentos íntimos muito pessoais, que são expressões riquíssimas de adoração, de amor, de agradecimento, de súplica..."}, {"t": "p", "x": "Vamos refletir agora um pouco sobre essas expressões de piedade, que poderíamos chamar “orações do coração”."}, {"t": "h", "x": "Viver os quatro fins da Missa"}, {"t": "p", "x": "Como lembra o clássico <em>Catecismo Romano<\/em> (IV, nn. 78-79), os quatro fins do Sacrifício da Missa, que coincidem com os quatro grandes sentimentos com que Jesus se ofereceu a Deus Pai na Cruz, são: <em>a adoração (ou o louvor), a ação de graças, a reparação pelos pecados e a súplica ou oração de petição<\/em>."}, {"t": "p", "x": "Os textos da Missa, quando bem vivida, despertam intensamente na alma essas quatro atitudes:"}, {"t": "p", "x": "• <em>Adoração e louvor.<\/em> Pensemos, por exemplo, quantas coisas nos podem sugerir orações litúrgicas como estas: «Glória a Deus nas alturas... Nós vos adoramos, nós vos glorificamos!», «Santo, Santo, Santo, Senhor Deus do universo; o céu e a terra proclamam a vossa glória», «Pai de misericórdia, a quem sobem nossos louvores», «Na verdade, vós sois santo, ó Deus do universo, e tudo o que criastes proclama o vosso louvor», «Por Cristo, com Cristo, em Cristo, a vós, Deus Pai todo-poderoso, toda a honra e toda a glória...», e tantas outras."}, {"t": "p", "x": "Mas não esqueçamos que, além dos textos, há também os <em>gestos<\/em> litúrgicos de adoração, que também movem a alma a orar."}, {"t": "p", "x": "A <em>Instrução Geral do Missal Romano<\/em> (n. 42), que contém as normas oficiais da Igreja para a celebração da Missa, indica, por exemplo, que os fiéis se «ajoelhem durante a Consagração», e que, onde for costume, é louvável «permanecer de joelhos do fim da aclamação do Santo até o final da Oração eucarística; e antes da Comunhão, quando o sacerdote mostra a Hóstia consagrada e diz “Eis o Cordeiro de Deus”». Gestos de adoração, que arrastam a alma com eles!"}, {"t": "p", "x": "Como lhe dizia antes, é fácil perceber que essas orações e gestos de reverência podem despertar, interiormente, expressões muito ricas de adoração e louvor. Por exemplo, exclamar interiormente “Meu Senhor e meu Deus!”, quando o celebrante eleva a Hóstia e o Cálice, e depois faz genuflexão; ou “Adoro-te com devoção, Deus escondido”, quando ficamos de joelhos, ou quando fazemos a genuflexão que a Liturgia prescreve ao passarmos diante do sacrário, ou diante do altar após a Consagração da Missa, etc."}, {"t": "p", "x": "São Josemaria confidenciou certa vez a dois de seus filhos, fazendo oração em voz alta, depois da Missa, que após a Consagração costumava dizer por dentro a Jesus: «Bem-vindo ao altar!»."}, {"t": "p", "x": "• <em>Ação de graças<\/em>. Basta que você pense no que sugerem textos litúrgicos como os seguintes: «Na verdade, ó Pai, é nosso dever dar-vos graças», «nos vos oferecemos em ação de graças este sacrifício de vida e santidade», e outros..."}, {"t": "p", "x": "Como é possível que, diante da doação total de Cristo por nós na Missa, não lhe agradeçamos de muitas maneiras? Pode bastar, sem palavras – só com o coração –, um simples “Obrigado, Senhor, por tudo”; ou um “Obrigado por isso e aquilo”; ou deixarmos que a alma exclame interiormente: “Como és bom, Senhor, como és bom!”. E não há dúvida de que o maior momento de ação de graças é a conversa que mantemos com Jesus após a Comunhão (disso trataremos mais amplamente em outra reflexão)."}, {"t": "p", "x": "Mas o coração pode ir além na gratidão. Convençamo-nos de que, muitas vezes, a melhor ação de graças, a melhor retribuição, será o oferecimento generoso – em união com a oblação de Cristo – do nosso dia, da nossa semana, dos nossos trabalhos e deveres cotidianos; e também a entrega a Deus das nossas dores e alegrias, do nosso apostolado... Quantas palavras íntimas não podem “entrar” aí, quantas “oferendas” não podemos colocar, com a intenção, na patena de cada Missa!"}, {"t": "p", "x": "• <em>Reparação pelos pecados próprios e alheios,<\/em> por tantas ofensas que Deus recebe. A Liturgia também nos move à contrição e à reparação: «Deus todo-poderoso tenha compaixão de nós, perdoe os nossos pecados e nos conduza à vida eterna», «Senhor, tende piedade de nós!», «Vós que tirais o pecado do mundo, acolhei a nossa súplica», «...todos os que circundam este altar... elevam a vós as suas preces para alcançar o perdão de suas faltas...», «enfim, nós vos pedimos, tende piedade de todos nós e dai-nos participar da vida eterna...», etc."}, {"t": "p", "x": "Como é bom rezar essas orações, e acrescentar-lhes nossos pedidos interiores de perdão, dizendo por dentro, por exemplo, aquela “oração do coração” de que fala o <em>Catecismo da Igreja Católica<\/em> (nn. 2616 e 2667): «Jesus Cristo, Filho de Deus, Senhor, tem piedade de mim, pecador!», tão característica da espiritualidade russo-bizantina; ou repetindo o belo ato de arrependimento e desagravo de São Pedro após a ressurreição de Cristo: <em>Senhor, tu sabes tudo, tu sabes que eu te amo!<\/em> (Jo 21, 17)."}, {"t": "p", "x": "• <em>Súplicas, petições<\/em>. Toda a Missa é, também, uma constante súplica pelos que participam conosco da mesma Missa – «por si e por todos os seus» –, por toda a Igreja, a começar pelo Papa e pelo Bispo, pelos vivos e os defuntos: «Lembrai-vos, ó Pai...». E, em concreto, por tantas intenções que visam às necessidades mais prementes do mundo e da Igreja: a paz, a harmonia dos povos, a justiça na vida social e econômica, a defesa dos valores da família, a fidelidade dos governos à Lei de Deus, as vocações... (intenções lembradas especialmente na “Oração dos fiéis”), bem como as múltiplas intenções estritamente pessoais ou familiares, que vamos colocando mentalmente na patena, para que Cristo as assuma ao descer aos vasos sagrados."}, {"t": "h", "x": "Não é muita coisa?"}, {"t": "p", "x": "Se pretendêssemos fazer em cada Missa “tudo” o que acabo de sugerir, sim, seria muita coisa! Seria demais! Mas não se trata disso. Eu não lhe quis dar uma “cartilha única e obrigatória”. Deus me livre! Quis apenas rasgar um pouco o horizonte de “possibilidades” de fazer da Missa uma “oração continuada”. Fica na sua mão escolher algumas."}, {"t": "p", "x": "Na prática, uns dias você focalizará na Missa sobretudo as ações de graças; outros dias se concentrará na adoração – como é grata a Deus a adoração! –; em outras ocasiões, fixará especialmente o coração em algumas intenções que leva ao altar; em outras, suplicará sobretudo o perdão de Deus, como o filho pródigo, ou desejará desagravar a Jesus pelas inúmeras ofensas e esquecimentos com que o ferem todos os dias..."}, {"t": "p", "x": "Cabe, portanto, a você a iniciativa do que vai fazer na Missa. Será bom que o concretize q

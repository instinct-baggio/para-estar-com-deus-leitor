var store = (function () {
  try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); return localStorage; }
  catch (e) { var m = {}; return { getItem: function (k) { return k in m ? m[k] : null; },
    setItem: function (k, v) { m[k] = String(v); } }; }
})();

function lerJSON(k, padrao) {
  try { var v = store.getItem(k); return v ? JSON.parse(v) : padrao; } catch (e) { return padrao; }
}
var pos = lerJSON('ped-pos.v1', { n: 0, y: 0 });
var fonte = lerJSON('ped-fonte.v1', 19);
var persistente = (store === (function(){ try { return localStorage; } catch(e){ return null; } })());

function nomeCap(ch) { return ch.n === 0 ? 'Introdução' : ch.label + ' · ' + ch.title; }
function esc(s) { return s; }

var app = document.getElementById('app');
var saveTimer = null;
var restaurado = false;
var capAtual = null;

function salvarPos() {
  if (!restaurado || capAtual === null) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function () {
    var y = Math.max(0, Math.round(window.scrollY || 0));
    if (pos.n !== capAtual || Math.abs(pos.y - y) > 60) {
      pos = { n: capAtual, y: y };
      try { store.setItem('ped-pos.v1', JSON.stringify(pos)); } catch (e) {}
    }
  }, 350);
}

function ctlFonte() {
  var s = document.createElement('span');
  s.className = 'fontctl';
  s.innerHTML = '<button type="button" data-d="-2" aria-label="Diminuir letra">A−</button>' +
                '<button type="button" data-d="2" aria-label="Aumentar letra">A+</button>';
  s.addEventListener('click', function (ev) {
    var b = ev.target.closest('button'); if (!b) return;
    fonte = Math.min(27, Math.max(15, fonte + parseInt(b.dataset.d, 10)));
    try { store.setItem('ped-fonte.v1', JSON.stringify(fonte)); } catch (e) {}
    var a = document.querySelector('article'); if (a) a.style.fontSize = fonte + 'px';
  });
  return s;
}

function barraProgresso() {
  var el = document.querySelector('article');
  var barra = document.getElementById('barra');
  if (!el || !barra) return;
  var total = el.offsetHeight - window.innerHeight;
  var f = total > 0 ? Math.max(0, Math.min(1, (window.scrollY || 0) / total)) : 1;
  barra.style.transform = 'scaleX(' + f + ')';
}

function toolbar(ch) {
  var t = document.createElement('div');
  t.className = 'toolbar';
  var voltar = document.createElement('a');
  voltar.className = 'nav'; voltar.href = '#/'; voltar.textContent = '‹ Sumário';
  var p = document.createElement('span');
  p.className = 'pos';
  p.textContent = ch.n === 0 ? 'Introdução' : 'Capítulo ' + ch.n + ' de ' + (LIVRO.length - 1);
  t.appendChild(voltar); t.appendChild(p); t.appendChild(ctlFonte());
  return t;
}

function renderHome() {
  capAtual = null; restaurado = false;
  document.title = 'Para estar com Deus - Francisco Faus';
  app.innerHTML = '';
  document.getElementById('barra').style.transform = 'scaleX(0)';

  var h = document.createElement('header');
  h.className = 'capa';
  h.innerHTML = '<img src="' + CAPA + '" alt="Livro aberto sobre uma mesa de madeira, com uma vela acesa e um terço">' +
    '<h1>Para estar com Deus</h1><div class="autor">Francisco Faus</div>' +
    '<div class="sub">Conselhos de vida interior para um católico.<br>A página lembra onde você parou e deixa ajustar o tamanho da letra.</div>';
  app.appendChild(h);

  var w = document.createElement('div'); w.className = 'wrap';
  var iniciado = LIVRO[pos.n] && (pos.n > 0 || pos.y > 100);
  var alvo = LIVRO[pos.n] || LIVRO[0];
  var cta = document.createElement('a');
  cta.className = 'cta'; cta.href = '#/ler/' + (iniciado ? alvo.n : 0);
  cta.textContent = iniciado ? 'Continuar lendo · ' + nomeCap(alvo) : 'Começar a ler';
  w.appendChild(cta);

  var h2 = document.createElement('h2'); h2.className = 'toc'; h2.textContent = 'Sumário';
  w.appendChild(h2);
  var ol = document.createElement('ol'); ol.className = 'toc';
  LIVRO.forEach(function (ch) {
    var li = document.createElement('li');
    var a = document.createElement('a');
    a.href = '#/ler/' + ch.n;
    a.innerHTML = '<span class="n">' + (ch.n === 0 ? '•' : ch.n) + '</span><span>' + ch.title + '</span>';
    li.appendChild(a); ol.appendChild(li);
  });
  w.appendChild(ol);
  app.appendChild(w);

  var f = document.createElement('footer'); f.className = 'fim';
  f.textContent = 'Texto integral do livro, já disponível gratuitamente no site do autor. ' +
    (persistente
      ? 'Sua posição de leitura e o tamanho da letra ficam salvos neste navegador, sem precisar de conta.'
      : 'Este navegador bloqueou o armazenamento local; sua posição ficará salva só enquanto esta aba estiver aberta.');
  app.appendChild(f);
  window.scrollTo(0, 0);
}

function renderCap(idx) {
  var ch = LIVRO[idx]; if (!ch) { location.hash = '#/'; return; }
  capAtual = ch.n; restaurado = false;
  document.title = ch.title + ' · Para estar com Deus';
  app.innerHTML = '';
  app.appendChild(toolbar(ch));

  var w = document.createElement('div'); w.className = 'wrap';
  var art = document.createElement('article');
  art.style.fontSize = fonte + 'px';
  var html = '';
  if (ch.n > 0) html += '<p class="caplabel">' + ch.label + '</p>';
  html += '<h1>' + ch.title + '</h1>';
  ch.items.forEach(function (it) {
    html += it.t === 'h' ? '<h2 class="sub">' + it.x + '</h2>' : '<p>' + it.x + '</p>';
  });
  if (ch.footnote) html += '<div class="nota"><span class="rotulo">Nota</span>' + ch.footnote + '</div>';
  art.innerHTML = html;
  w.appendChild(art);

  var nav = document.createElement('nav'); nav.className = 'prevnext';
  var prev = idx > 0 ? LIVRO[idx - 1] : null;
  var next = idx < LIVRO.length - 1 ? LIVRO[idx + 1] : null;
  var a1 = document.createElement('a'); a1.className = 'nav';
  a1.href = prev ? '#/ler/' + prev.n : '#/';
  a1.textContent = prev ? '‹ ' + (prev.n === 0 ? 'Introdução' : prev.title) : '‹ Sumário';
  var a2 = document.createElement('a'); a2.className = 'nav';
  a2.href = next ? '#/ler/' + next.n : '#/';
  a2.textContent = next ? next.title + ' ›' : 'Fim do livro · Sumário';
  nav.appendChild(a1); nav.appendChild(ctlFonte()); nav.appendChild(a2);
  w.appendChild(nav);
  app.appendChild(w);

  setTimeout(function () {
    if (pos.n === ch.n && pos.y > 100) {
      var blocos = art.querySelectorAll('p, h2');
      var alvoEl = art, melhor = 0;
      for (var i = 0; i < blocos.length; i++) {
        var top = blocos[i].offsetTop;
        if (top <= pos.y + 60) { melhor = top; alvoEl = blocos[i]; } else break;
      }
      window.scrollTo(0, Math.max(0, melhor));
    } else {
      window.scrollTo(0, 0);
      if (pos.n !== ch.n) { pos = { n: ch.n, y: 0 }; try { store.setItem('ped-pos.v1', JSON.stringify(pos)); } catch (e) {} }
    }
    restaurado = true;
    barraProgresso();
  }, 60);
}

function rota() {
  var m = /^#\/ler\/(\d+)$/.exec(location.hash || '');
  if (m) renderCap(parseInt(m[1], 10)); else renderHome();
}
window.addEventListener('hashchange', rota);
window.addEventListener('scroll', function () { salvarPos(); barraProgresso(); }, { passive: true });
rota();
</script>
